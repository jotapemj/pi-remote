<script id="boot">
/* pick the theme before first paint, or the wrong one flashes on load */
try{
  var p = localStorage.getItem("pi.theme") || "auto";
  document.documentElement.dataset.theme = p !== "auto" ? p
    : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
}catch(e){}
</script>

:root{
  /* dark stays the base, so the page is right even if the theme script dies */
  color-scheme:dark;
  --panel:#12151a; --surface:#191e25; --raise:#212832; --rule:#2b333e;
  --ink:#dde2e8; --dim:#8b95a2; --faint:#7d8794;
  --amber:#f2a63b; --mint:#4fb894; --coral:#e2574c;
  --on-amber:#12151a;                    /* ink that sits on an amber fill */
  --plate-a:#1a1f27; --plate-b:#151a21;  /* nameplate gradient */
  --ask-a:#1e1c16;   --ask-b:#191e25;    /* approval card gradient */
  --deck:#0e1116;                        /* readout, sunk below the panel */
  --lit:#e8c98a;                         /* inline code */
  --stop:#3b2723;
  --veil:#0009;
  --cast:0 -14px 28px #0007;
  --lift:none;
  --mint-wash:#00f1001a; --coral-wash:#c22f361a;
  --add:#00f100; --del:#e0454c;      /* el #c22f36 exacto daba 2.99 aqui */
  --head:#191e25; --head-ink:#8b95a2;   /* barra de una caja plegable */
  --box:#191e25;  --box-ink:#8b95a2;    /* su cuerpo, ya desplegado */
  --field-ink:#dde2e8;                  /* lo que escribes */
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --gut:14px;
  /* shape, lifted from the horizon template */
  --r-card:14px; --r-tool:12px; --r-pill:26px; --r-bubble:18px;
  --cast-card:none;
}
:root[data-theme="klaude"]{
  color-scheme:dark;
  --panel:#151515; --surface:#1b1b1b; --raise:#262625; --rule:#353535;
  --ink:#e6e6e4; --dim:#a2a298; --faint:#7c7c75;
  --amber:#da7757; --mint:#5fae86; --coral:#c22f36;
  --on-amber:#ffffff;                   /* la flecha de enviar, blanca */
  --plate-a:#1a1a1a; --plate-b:#151515;
  --ask-a:#231c18;   --ask-b:#1b1b1b;
  --deck:#0d0d0d;
  --lit:#689bd4;                        /* codigo suelto en el texto */
  --stop:#4a2b2b;
  --veil:#0009;
  --cast:0 -14px 28px #0009;
  --lift:none;
  --cast-card:none;
  --mint-wash:#00f1001a; --coral-wash:#c22f361a;
  --add:#00f100; --del:#c22f36;
  --head:#0d0d0d; --head-ink:#a2a298;
  --box:#111111;  --box-ink:#878d93;
  --field-ink:#a3a3a1;
}
:root[data-theme="light"]{
  /* same instrument under bench light: paper, not a chat app */
  color-scheme:light;
  --panel:#eceef2; --surface:#ffffff; --raise:#e4e8ee; --rule:#cfd5de;
  --ink:#151920; --dim:#59636f; --faint:#6f7987;
  --amber:#8f5405; --mint:#0d7355; --coral:#b8342a;
  --on-amber:#fff8ec;
  --plate-a:#ffffff; --plate-b:#f3f5f9;
  --ask-a:#fdf5e6;   --ask-b:#ffffff;
  --deck:#e6eaf0;
  --lit:#8a5a10;
  --stop:#e3c3bf;
  --veil:#1b202899;
  --cast:0 -14px 28px #0f172a1f;
  --lift:0 1px 2px #0f172a12;
  --mint-wash:#00f1001f; --coral-wash:#c22f361f;
  --add:#008f00; --del:#c22f36;      /* el verde puro da 1.55 sobre blanco */
  --head:#ffffff; --head-ink:#59636f;
  --box:#ffffff;  --box-ink:#59636f;
  --field-ink:#151920;
  --cast-card:14px 17px 40px 4px rgba(112,144,176,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--panel); color:var(--ink);
  font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
}

/* ---------- header: instrument nameplate ---------- */
.plate{
  display:flex; align-items:center; gap:10px;
  padding:9px var(--gut); border-bottom:1px solid var(--rule);
  background:linear-gradient(var(--plate-a),var(--plate-b));
}
.plate .txt{
  flex:1; min-width:0; display:flex; flex-direction:column;
  justify-content:center;
}
.plate h1{
  font:600 13px/1.2 var(--mono); margin:0; letter-spacing:.02em;
}
.plate h1 > span{transition:opacity .22s ease}
.plate h1 > span.out{opacity:0}
.plate .sub{
  font:400 11px/1.45 var(--mono); color:var(--faint);
  opacity:0; height:0;
  transition:opacity .3s ease, height .28s cubic-bezier(.32,.72,0,1);
}
.plate .sub.on{opacity:1;height:16px}
.iconbtn{
  background:none;border:1px solid var(--rule);color:var(--dim);
  font:500 11px/1 var(--mono); padding:7px 9px;border-radius:5px;
  cursor:pointer; flex:none;
}
.iconbtn:hover{color:var(--ink);border-color:var(--faint)}
.ico{padding:7px;display:flex}
.i{width:18px;height:18px;flex:none;display:block}
.i-lg{width:32px;height:32px;margin:0 auto 10px;color:var(--faint)}
.iconbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.warnbar{
  display:flex; align-items:center; gap:8px; flex:none;
  padding:7px var(--gut); background:var(--coral-wash);
  border-bottom:1px solid var(--rule); color:var(--coral);
  font:500 11px/1.4 var(--mono);
}
.warnbar[hidden]{display:none}
.warnbar .i{width:15px;height:15px;flex:none}
.warnbar span{flex:1;min-width:0}
.wclose{
  background:none; border:none; color:var(--coral); cursor:pointer;
  padding:2px; display:flex; flex:none; opacity:.75;
}
.wclose:hover{opacity:1}

/* ---------- transcript ---------- */
main{flex:1; overflow-y:auto; padding:16px var(--gut) 8px; position:relative;
  overscroll-behavior:contain; scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto}
.turn{margin-bottom:20px;animation:rise-in .22s ease-out}
.nofx .turn{animation:none}   /* a snapshot must not animate 40 rows */

/* you are a bubble on the right; pi answers across the whole width */
.msg{display:flex; justify-content:flex-end}
.blk-you{
  max-width:80%; border-radius:var(--r-bubble);
  background:var(--raise); border:1px solid var(--rule);
  padding:13px 17px; color:var(--ink); font-weight:500;
  white-space:pre-wrap; word-break:break-word;
}
.tag{
  display:block; font:700 10px/1.4 var(--sans); letter-spacing:.09em;
  color:var(--amber); text-transform:uppercase; margin-bottom:5px;
}

.said{word-break:break-word;font-size:var(--chat-size,15px)}
.blk-you{font-size:var(--chat-size,15px)}
.said p{margin:0 0 .7em}
.said p:last-child{margin-bottom:0}
.said h4{font:600 15px/1.4 var(--sans);margin:1.1em 0 .4em}
.said ul,.said ol{margin:.2em 0 .8em;padding-left:1.25em}
.said li{margin:.15em 0}
.said a{color:var(--mint)}
.said code{
  font:500 13px/1.4 var(--mono); background:var(--raise);
  padding:1px 5px; border-radius:3px; color:var(--lit);
}
.said pre{
  background:var(--box); border:1px solid var(--rule);
  border-radius:var(--r-tool); padding:12px 13px; overflow-x:auto;
  margin:.7em 0;
}
.said pre code{background:none;padding:0;color:var(--box-ink);font-size:12.5px}
.cwrap{position:relative}
.cwrap pre{padding-right:48px}
.copyb{
  position:absolute; top:8px; right:8px; width:30px; height:30px;
  border-radius:8px; border:1px solid var(--rule); background:var(--head);
  color:var(--head-ink); cursor:pointer; opacity:.7;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .18s ease, color .18s ease, border-color .18s ease;
}
.copyb:hover{opacity:1;color:var(--ink);border-color:var(--faint)}
.copyb .i{width:16px;height:16px}
.copyb.done{color:var(--mint);border-color:var(--mint);opacity:1}
.cursor{
  display:inline-block; width:7px; height:15px; background:var(--amber);
  vertical-align:-2px; border-radius:1px;
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes blink{50%{opacity:0}}
.wordi{
  font:500 13px/1 var(--mono); color:var(--amber); margin-left:8px;
  letter-spacing:.02em; transition:opacity .22s ease;
}
.wordi.out{opacity:0}
body.waiting .cursor{display:none}   /* pi no escribe: te espera */

/* ---------- tool rows ---------- */
.tool{
  border:1px solid var(--rule); border-radius:var(--r-tool);
  background:var(--box); margin:9px 0; overflow:hidden;
  box-shadow:var(--lift);
}
.tool>summary{
  list-style:none; cursor:pointer; padding:8px 11px;
  font:500 12px/1.4 var(--mono); color:var(--head-ink);
  background:var(--head);
  display:flex; align-items:center; gap:8px;
  white-space:nowrap; overflow:hidden;      /* args largos no desbordan */
}
.tool>summary .nm{
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
}
.tool>summary::-webkit-details-marker{display:none}
.tool .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.tool[data-s="done"] .dot{background:var(--mint)}
.tool[data-s="error"] .dot{background:var(--coral)}
.tool[data-s="running"] .dot{animation:blink 1.1s steps(2) infinite}
.tool > pre, .tool > .diff{
  transition:height .18s cubic-bezier(.32,.72,0,1);
}
.tool.moving > pre, .tool.moving > .diff{overflow:hidden}
.tool pre{
  margin:0; padding:10px 11px; border-top:1px solid var(--rule);
  font:400 12px/1.5 var(--mono); color:var(--box-ink);
  white-space:pre-wrap; word-break:break-word; max-height:340px; overflow:auto;
}
/* cuenta de lineas en la fila plegada, como en la tui */
.tally{display:flex;gap:7px;flex:none;font:600 11px/1 var(--mono)}
.tally .plus{color:var(--add)}
.tally .minus{color:var(--del)}
.diff{
  margin:0; border-top:1px solid var(--rule); max-height:340px;
  overflow:auto; font:400 12px/1.55 var(--mono);
}
.diff div{padding:1px 11px; white-space:pre-wrap; word-break:break-word}
.diff .add{color:var(--add); background:var(--mint-wash)}
.diff .del{color:var(--del); background:var(--coral-wash)}
.diff .at{color:var(--faint)}

/* ---------- notes ---------- */
.note{
  font:500 12px/1.5 var(--mono); color:var(--dim);
  border-left:2px solid var(--faint); padding:3px 0 3px 11px; margin:10px 0;
  display:flex; align-items:flex-start; gap:8px;
}
.note .i{width:16px;height:16px;margin-top:1px}
.note.warn{border-color:var(--amber);color:var(--amber)}
.note.error{border-color:var(--coral);color:var(--coral)}

/* ---------- approval card ---------- */
.ask{
  border:1px solid var(--amber); border-radius:var(--r-card); margin:14px 0;
  box-shadow:var(--cast-card);
  background:linear-gradient(var(--ask-a),var(--ask-b));
}
.ask .cap{
  font:700 10px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--amber); padding:10px 13px 0;
}
.ask h3{font:600 14px/1.4 var(--sans);margin:6px 13px 0}
.ask .body{
  font:400 12.5px/1.5 var(--mono); color:var(--dim);
  margin:6px 13px 0; white-space:pre-wrap; word-break:break-word;
}
/* que va a ejecutarse exactamente */
.ask .what{
  margin:9px 13px 0; border:1px solid var(--rule); border-radius:var(--r-tool);
  background:var(--box); overflow:hidden;
}
.ask .what .who{
  display:flex; align-items:center; gap:7px; padding:6px 10px;
  background:var(--head); color:var(--head-ink);
  font:500 11.5px/1.4 var(--mono);
}
.ask .what .who .i{width:15px;height:15px}
.ask .what .says{padding:9px 10px; font:400 12.5px/1.5 var(--sans)}
.ask .what .says p{margin:0; color:var(--ink)}
.ask .what .says p + p{margin-top:4px}
.ask .what .says + pre{border-top:1px solid var(--rule)}
.ask .what pre{
  margin:0; padding:9px 10px; font:400 12px/1.5 var(--mono);
  color:var(--box-ink); white-space:pre-wrap; word-break:break-word;
  max-height:190px; overflow:auto;
}
.ask .opts{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px 13px}
.opt{
  font:500 12.5px/1 var(--mono); padding:9px 13px; border-radius:5px;
  border:1px solid var(--rule); background:var(--raise); color:var(--ink);
  cursor:pointer; flex:1 1 auto; min-width:96px;
}
.opt:hover{border-color:var(--amber)}
.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.opt.yes{border-color:var(--mint);color:var(--mint)}
.opt.no{border-color:var(--coral);color:var(--coral)}
.ask.done{border-color:var(--rule);background:var(--surface)}
.ask.done .opts{display:none}
.ask .verdict{
  font:500 12px/1 var(--mono); color:var(--mint); padding:9px 13px 12px;
  display:flex; align-items:center; gap:7px;
}
.ask .verdict .i{width:16px;height:16px}

/* ---------- readout: the signature ---------- */
.readout[hidden]{display:none}     /* display:flex below beats [hidden] */
.readout{
  border-top:1px solid var(--rule); background:var(--deck);
  padding:7px var(--gut); display:flex; align-items:center; gap:10px;
  font:500 12px/1 var(--mono);
}
.ctx{
  flex:1; min-width:0; height:22px; border-radius:11px;
  background:var(--raise); border:1px solid var(--rule);
  position:relative; overflow:hidden;
}
.ctx i{
  position:absolute; left:0; top:0; bottom:0; width:0;
  background:var(--mint); opacity:.32; border-radius:11px;
  transition:width .45s cubic-bezier(.32,.72,0,1), background-color .3s;
}
.ctx.hot i{background:var(--amber)}
.ctx.max i{background:var(--coral)}
.ctx span{
  position:relative; display:block; text-align:center;
  font:500 11px/20px var(--mono); color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.stopb{
  background:none; border:1px solid var(--stop); color:var(--coral);
  border-radius:999px; font:500 11px/1 var(--mono); padding:5px 10px;
  cursor:pointer; flex:none; display:flex; align-items:center; gap:5px;
}
.stopb .i{width:15px;height:15px}
.stopb:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.readout .sec{color:var(--faint);font-variant-numeric:tabular-nums}
.readout .sec{flex:none}

/* ---------- composer ---------- */
footer{
  border-top:1px solid var(--rule); background:var(--surface);
  /* --kb es el alto que ocupa el teclado del movil */
  padding:9px var(--gut) calc(9px + env(safe-area-inset-bottom) + var(--kb,0px));
  position:relative;
  transition:padding-bottom .18s ease;
}

.godown{
  position:absolute; left:50%; bottom:calc(100% + 12px); z-index:14;
  width:40px; height:40px; border-radius:50%; cursor:pointer;
  background:var(--surface); border:1px solid var(--rule); color:var(--ink);
  box-shadow:var(--cast); display:flex; align-items:center;
  justify-content:center;
  opacity:0; visibility:hidden; transform:translateX(-50%) scale(.7);
  transition:opacity .2s ease,
             transform .24s cubic-bezier(.32,.72,0,1),
             visibility 0s linear .24s;
}
.godown.on{
  opacity:1; visibility:visible; transform:translateX(-50%) scale(1);
  transition:opacity .2s ease,
             transform .24s cubic-bezier(.32,.72,0,1), visibility 0s;
}
.godown .i{width:20px;height:20px;transform:rotate(180deg)}

/* ---------- rows inside a dialog ---------- */
.mrow{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:var(--raise); border:1px solid var(--rule);
  border-radius:var(--r-tool); color:var(--ink); cursor:pointer;
  padding:13px 14px; margin-bottom:7px; font:400 13px/1.35 var(--sans);
}
.mrow:hover{border-color:var(--amber)}
.mrow.bad{color:var(--coral)}
.mrow.bad .i{color:var(--coral)}
.mrow .i{color:var(--faint)}

/* ---------- slash palette ---------- */
.palette{
  position:absolute; left:0; right:0; bottom:100%;
  background:var(--surface); border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  max-height:52vh; overflow-y:auto; z-index:15;
  box-shadow:var(--cast);
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.32,.72,0,1),
             visibility 0s linear .22s;
}
.palette.open{
  opacity:1; visibility:visible; transform:none;
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.32,.72,0,1),
             visibility 0s;
}
.palette .phead{
  font:700 10px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); padding:11px var(--gut) 8px;
  position:sticky; top:0; background:var(--surface);
}
.cmd{
  display:flex; align-items:baseline; gap:10px; width:100%;
  background:none; border:none; border-left:2px solid transparent;
  padding:9px var(--gut); cursor:pointer; text-align:left; color:var(--ink);
}
.cmd b{font:600 13px/1.3 var(--mono);color:var(--ink);flex:none}
.cmd span{font:400 12px/1.3 var(--sans);color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd.sel{background:var(--raise);border-left-color:var(--amber)}
.cmd.sel b{color:var(--amber)}
.cmd:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.palette .none{padding:12px var(--gut) 16px;font:400 12px/1.4 var(--mono);
  color:var(--faint)}
.entry{display:flex;gap:8px;align-items:flex-end}
.field{flex:1; min-width:0; position:relative; display:flex}
textarea{
  flex:1; resize:none; background:var(--panel); color:var(--field-ink);
  border:1px solid var(--rule); border-radius:var(--r-pill);
  padding:15px 20px 15px 48px; font:15px/1.45 var(--sans);
  max-height:38vh; min-height:54px;
  transition:padding-left .22s cubic-bezier(.32,.72,0,1),
             background-color .18s, border-color .18s, color .18s;
}
.field.typing textarea{padding-left:20px}

/* the key that opens the palette, shown as itself */
.slashb{
  position:absolute; left:9px; top:50%; transform:translateY(-50%);
  width:36px; height:36px; border-radius:50%; flex:none;
  border:1px solid var(--rule); background:var(--raise); color:var(--amber);
  font:600 16px/1 var(--mono); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.32,.72,0,1);
}
.slashb:hover{border-color:var(--amber)}
.slashb:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.field.typing .slashb{
  opacity:0; transform:translateY(-50%) scale(.55); pointer-events:none;
}
textarea:focus{outline:none;border-color:var(--faint)}
.send{
  background:var(--amber); color:var(--on-amber); border:none;
  width:54px; height:54px; border-radius:50%; padding:0; cursor:pointer;
  flex:none; display:flex; align-items:center; justify-content:center;
}
.send .i{width:22px;height:22px}
.send:disabled{background:var(--rule);color:var(--faint);cursor:default}

/* ---------- sheet ---------- */
.sheet{
  position:fixed; inset:0; background:var(--veil); display:flex;
  align-items:flex-end; justify-content:center; z-index:20;
  opacity:0; visibility:hidden;
  transition:opacity .22s ease, visibility 0s linear .22s;
}
.sheet.open{
  opacity:1; visibility:visible;
  transition:opacity .22s ease, visibility 0s;
}
.sheet .card{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:12px 12px 0 0; width:100%; max-width:760px;
  max-height:78vh; overflow-y:auto;
  padding:14px var(--gut) calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%); will-change:transform;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.sheet.open .card{transform:none}
.sbar{display:flex; align-items:center; gap:9px; margin:2px 0 12px}
.sheet h2{
  font:700 11px/1 var(--sans); letter-spacing:.1em; color:var(--faint);
  text-transform:uppercase; margin:0; flex:1;
}
.backb{
  background:none; border:none; color:var(--dim); cursor:pointer;
  padding:2px; margin-left:-2px; display:flex; flex:none;
}
.backb:hover{color:var(--ink)}
.backb[hidden]{display:none}
.backb .i{width:19px;height:19px}

/* al entrar en una seccion el contenido llega desde la derecha,
   y al volver desde la izquierda */
#sheetBody{
  transition:transform .2s cubic-bezier(.32,.72,0,1), opacity .16s ease;
}
#sheetBody.to-left{transform:translateX(-26px);opacity:0}
#sheetBody.to-right{transform:translateX(26px);opacity:0}
.pick{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:var(--raise); border:1px solid var(--rule);
  border-radius:var(--r-tool); color:var(--ink);
  padding:13px 14px; margin-bottom:7px; cursor:pointer;
  font:400 13px/1.35 var(--sans); box-shadow:var(--lift);
}
.pick .txt{flex:1;min-width:0}
.pick .ch{width:16px;height:16px;color:var(--faint)}
.pick:hover{border-color:var(--amber)}
.pick small{display:block;font:400 11px/1.4 var(--mono);color:var(--faint);
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.nav .path{flex:1;font:400 11px/1.35 var(--mono);color:var(--dim);
  word-break:break-all}
.usebtn{
  display:block; width:100%; background:var(--amber); color:var(--on-amber);
  border:none; border-radius:7px; font:600 12.5px/1 var(--mono);
  padding:12px; margin-bottom:11px; cursor:pointer;
}
.usebtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pick small.mk{color:var(--amber)}
.spin{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:34px; height:34px; border-radius:50%;
  border:3px solid var(--rule); border-top-color:var(--amber);
  animation:turn .8s linear infinite;
  transition:opacity .25s ease;
}
.spin.out{opacity:0}
@keyframes turn{to{transform:translate(-50%,-50%) rotate(360deg)}}

.empty{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(86%,300px); background:none; cursor:pointer;
  border:1.5px dashed var(--rule); border-radius:16px; padding:30px 22px;
  text-align:center; color:var(--faint); font:400 12.5px/1.5 var(--sans);
  transition:border-color .18s,color .18s;
}
.empty:hover{border-color:var(--amber);color:var(--dim)}
.nosub{padding:14px 4px;color:var(--faint);font:400 12.5px/1.5 var(--sans)}
.empty:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.empty b{display:block;font:700 12px/1.4 var(--sans);color:var(--amber);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}

/* ---------- side rail: projects ---------- */
.scrim{position:fixed;inset:0;background:var(--veil);z-index:25;
  opacity:0;transition:opacity .22s ease}
.scrim.on{opacity:1}
.scrim{will-change:opacity}
.scrim[hidden]{display:none}
.rail{
  position:fixed; top:0; bottom:0; left:0; width:min(82%,292px); z-index:26;
  background:var(--surface); border-right:1px solid var(--rule);
  padding:calc(15px + env(safe-area-inset-top)) 11px
          calc(15px + env(safe-area-inset-bottom));
  overflow-y:auto; transform:translateX(-101%);
  transition:transform .3s cubic-bezier(.32,.72,0,1),
             background-color .18s, border-color .18s;
  will-change:transform;
}
.rail.on{transform:none}
.railtop{font:600 15px/1.2 var(--mono);color:var(--ink);padding:4px 8px 15px}
.addp{
  display:flex; align-items:center; gap:9px; width:100%;
  background:var(--amber); color:var(--on-amber); border:none;
  border-radius:var(--r-tool); padding:12px 14px; cursor:pointer;
  font:600 13px/1 var(--mono); margin-bottom:5px;
}
.addp svg{width:17px;height:17px;flex:none}
.proj{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; border-radius:var(--r-tool);
  padding:10px 13px; cursor:pointer;
  color:var(--ink); font:500 13px/1.3 var(--sans);
}
.proj .txt{flex:1;min-width:0}
.proj .i{color:var(--faint)}
.proj.on .i{color:var(--amber)}
.proj:hover{background:var(--raise)}
.proj.on{background:var(--raise);color:var(--amber)}
.proj small{
  display:block; font:400 10.5px/1.4 var(--mono); color:var(--faint);
  margin-top:3px;
}
.proj .ch{
  margin-left:auto; transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.pgroup.open .proj .ch{transform:rotate(90deg)}

/* the session list grows from nothing: 0fr to 1fr needs no known height */
.subs{
  display:grid; grid-template-rows:0fr; opacity:0;
  transition:grid-template-rows .28s cubic-bezier(.32,.72,0,1),
             opacity .2s ease;
}
.pgroup.open .subs{grid-template-rows:1fr; opacity:1}
.subs > div{overflow:hidden}
.sess{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:none; border-radius:var(--r-tool);
  padding:9px 12px 9px 30px; cursor:pointer; color:var(--dim);
  font:400 12.5px/1.3 var(--sans);
}
.sess:hover{background:var(--raise);color:var(--ink)}
.sess .i{width:15px;height:15px;color:var(--faint);flex:none}
.sess .txt{flex:1;min-width:0}
.sess small{display:block;font:400 10px/1.4 var(--mono);color:var(--faint);
  margin-top:2px}
.sess.new{color:var(--amber);font-weight:600}
.sess.new .i{color:var(--amber)}
.subs .none{padding:8px 12px 10px 30px;color:var(--faint);
  font:400 11.5px/1.4 var(--mono)}

/* ---------- modal dialogs ---------- */
.modal{
  position:fixed; inset:0; z-index:30; display:flex; padding:20px;
  align-items:center; justify-content:center; background:var(--veil);
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  opacity:0; visibility:hidden;
  transition:opacity .2s ease, visibility 0s linear .2s;
}
.modal.open{
  opacity:1; visibility:visible;
  transition:opacity .2s ease, visibility 0s;
}
.mcard{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-card); box-shadow:var(--cast-card);
  width:100%; max-width:470px; max-height:82vh; padding:20px;
  display:flex; flex-direction:column;
  transform:scale(.94) translateY(14px); will-change:transform;
  transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.modal.open .mcard{transform:none}
.mcard h3{font:600 15px/1.3 var(--sans);margin:0 0 13px;color:var(--ink)}
.mbody{overflow-y:auto;font:400 13px/1.55 var(--sans);color:var(--dim)}
.mbody dt{font:600 12.5px/1.5 var(--mono);color:var(--amber);margin-top:11px}
.mbody dt:first-child{margin-top:0}
.mbody dd{margin:1px 0 0}
.mbody p{margin:0 0 9px}
.mbody b{color:var(--ink)}
.macts{display:flex; gap:8px; margin-top:16px; flex:none}
.ok{
  flex:1; background:var(--amber); color:var(--on-amber);
  border:1px solid transparent; border-radius:var(--r-tool);
  padding:12px; cursor:pointer; font:600 13px/1 var(--mono);
}
.ok:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ok.alt{background:var(--raise);color:var(--dim);border-color:var(--rule)}
.ok.alt:hover{color:var(--ink)}
/* what it does cannot be undone: outline, not a filled button */
.ok.danger{background:none;border-color:var(--coral);color:var(--coral)}
@keyframes rise-in{from{opacity:0;transform:translateY(7px)}
                   to{opacity:1;transform:none}}
/* what does not fit slides by, faded at both ends.
   the mask only exists while it runs, or a short label would
   sit there with its edges dissolved for no reason. */
.mq{display:block; overflow:hidden}   /* un span inline mide 0 de ancho */
.mq > span{display:block; white-space:nowrap}
.mq:not(.run) > span{overflow:hidden; text-overflow:ellipsis}
.mq.run{
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 12px,
                     #000 calc(100% - 12px), transparent 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 12px,
             #000 calc(100% - 12px), transparent 100%);
}
.mq.run > span{
  width:max-content; will-change:transform;
  animation:mq var(--mq-dur, 9s) linear infinite;
}
@keyframes mq{
  0%,14%    {transform:translateX(0)}
  46%,54%   {transform:translateX(var(--mq-shift))}
  86%,100%  {transform:translateX(0)}
}

/* la fila elegida de un dialogo de seleccion */
.mrow.on{border-color:var(--amber);color:var(--amber)}
.mrow.on .i{color:var(--amber)}

/* tamano del texto del chat, con las dos A a su tamano real */
.sizecard{
  background:var(--raise); border:1px solid var(--rule);
  border-radius:var(--r-tool); padding:12px 14px; margin-bottom:7px;
  box-shadow:var(--lift);
}
.sizecard .lbl{
  font:700 10px/1 var(--sans); letter-spacing:.11em; color:var(--faint);
  text-transform:uppercase; margin-bottom:12px;
}
.fsize{display:flex; align-items:center; gap:14px}
.fsize .a{flex:none; color:var(--ink); font-weight:600; line-height:1}
.fsize .a.sm{font-size:16px}
.fsize .a.lg{font-size:30px}
.track{position:relative; flex:1; min-width:0; height:24px}
.track .srail{
  position:absolute; left:0; right:0; top:5px; height:14px;
  border-radius:7px; background:var(--panel); border:1px solid var(--rule);
}
.track .dots{
  position:absolute; left:13px; right:13px; top:5px; height:14px;
  background-image:radial-gradient(circle at center,
                   var(--faint) 2.2px, transparent 2.3px);
  background-size:calc(100% / 7) 100%;
}
.track input{
  position:absolute; left:0; top:0; width:100%; height:24px; margin:0;
  background:none; -webkit-appearance:none; appearance:none; cursor:pointer;
}
.track input::-webkit-slider-thumb{
  -webkit-appearance:none; width:24px; height:24px; border-radius:50%;
  background:var(--panel); border:2.5px solid var(--ink);
}
.track input::-moz-range-thumb{
  width:24px; height:24px; border-radius:50%; box-sizing:border-box;
  border:2.5px solid var(--ink); background:var(--panel);
}
.track input:focus-visible::-webkit-slider-thumb{border-color:var(--amber)}
.shead{
  font:700 10px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); margin:15px 0 9px;
}
.shead:first-child{margin-top:0}
.shead[hidden]{display:none}

/* only the theme swap animates; everything else stays instrument-quick */
body,.plate,.readout,footer,.tool,.ask,.pick,@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="plate">
  <button class="iconbtn ico" id="railBtn" aria-label="projects"></button>
  <div class="txt">
    <h1 class="mq" id="title"><span>connecting</span></h1>
    <div class="sub mq" id="sub"><span></span></div>
  </div>
  <button class="iconbtn ico" id="menuBtn"></button>
</header>

<div class="warnbar" id="warnbar" hidden></div>
<main id="main"><div class="wrap" id="feed"></div></main>

<div class="readout" id="readout" hidden>
  <span class="sec" id="secs">0s</span>
  <div class="ctx" id="bar"><i></i><span></span></div>
  <button class="stopb" id="stopBtn"><span data-t="stop"></span></button>
</div>

<footer>
  <button class="godown" id="godown" aria-label="down"></button>
  <div class="palette" id="palette">
    <div class="phead" id="phead">commands</div>
    <div id="plist"></div>
  </div>
  <div class="entry">
    <div class="field" id="field">
      <button class="slashb" id="slashBtn" aria-label="/">/</button>
      <textarea id="box" rows="1"></textarea>
    </div>
    <button class="send" id="send" aria-label="send"></button>
  </div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="rail" id="rail">
  <div class="railtop">pi remote</div>
  <button class="addp" id="addBtn"><span data-t="addProject"></span></button>
  <div class="shead" id="recentHead" data-t="recent"></div>
  <div id="recents"></div>
</aside>

<div class="sheet" id="sheet"><div class="card">
  <div class="sbar">
    <button class="backb" id="sheetBack" hidden aria-label="back"></button>
    <h2 id="sheetTitle"></h2>
  </div>
  <div id="sheetBody"></div>
</div></div>

<div class="modal" id="modal"><div class="mcard">
  <h3 id="modalTitle"></h3>
  <div class="mbody" id="modalBody"></div>
  <div class="macts">
    <button class="ok alt" id="modalNo" hidden></button>
    <button class="ok" id="modalOk">OK</button>
  </div>
</div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const $ = s => document.querySelector(s);
const feed = $("#feed"), main = $("#main");
let ws, state = {}, nodes = new Map(), tick = null, CWD = "";
let firstSnap = true;

/* ---------- material icons, apache 2.0 ---------- */
const ICONS = {
  remove:"M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z",
  session:"M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z",

/* corta por &&, ||, ; y | sin partir dentro de comillas */
function cmdPieces(s){
  const out = []; let cur = "", q = null;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(q){ cur += c; if(c === q) q = null; continue; }
    if(c === '"' || c === "'"){ q = c; cur += c; continue; }
    if(c === ";" || c === "\n"){ out.push(cur); cur = ""; continue; }
    if((c === "&" || c === "|") && s[i + 1] === c){
      out.push(cur); cur = ""; i++; continue;
    }
    if(c === "|"){ out.push(cur); cur = ""; continue; }
    cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(Boolean);
}

function readCmd(piece){
  let w = piece.match(/"[^"]*"|'[^']*'|\S+/g) || [];
  const keep = [], warn = [];
  let redir = "", root = false;
  for(let i = 0; i < w.length; i++){          // fuera las redirecciones
    const t = w[i];
    if(/^\d*(>>|>)$/.test(t)){ redir = unq(w[++i] || ""); continue; }
    if(/^\d*<$/.test(t)){ i++; continue; }
    const m = /^(>>|>)(\S+)$/.exec(t);
    if(m){ redir = unq(m[2]); continue; }
    if(/^\d*(>>|>|<|>&)/.test(t)) continue;
    keep.push(t);
  }
  w = keep;
  while(w.length){                            // fuera lo que solo es prefijo
    const h = unq(w[0]);
    if(/^[A-Za-z_]\w*=/.test(h)){ w.shift(); continue; }
    if(/^(sudo|doas|runas)$/.test(h)){ root = true; w.shift(); continue; }
    if(/^(time|nohup|env|exec|command)$/.test(h)){ w.shift(); continue; }
    break;
  }
  if(!w.length) return null;
  const name = unq(w[0]).replace(/\\/g, "/").split("/").pop()
    .toLowerCase().replace(/\.(exe|cmd|bat|ps1|com)$/, "");
  const flags = [];
  let args = [];
  for(const raw of w.slice(1)){
    const t = unq(raw);
    if(/^--[A-Za-z]/.test(t)) flags.push(t.slice(2).split("=")[0].toLowerCase());
    else if(/^-[A-Za-z]/.test(t)) for(const c of t.slice(1)) flags.push(c);
    else if(t !== "-" && t !== "--") args.push(t);
  }
  let key = CMD[name] || "", shown = name;
  // `git push -d rama` no sube nada: borra en el remoto
  const pushDel = name === "git" && (args[0] || "").toLowerCase() === "push"
    && flags.some(f => f === "d" || f === "delete");
  if(pushDel){ args.shift(); key = "gitPushDel"; }
  const tbl = pushDel ? null : (SUB[key] || SUB[name]);
  if(tbl){
    const s0 = (args[0] || "").toLowerCase();
    if(tbl[s0]){ key = tbl[s0]; args.shift(); }
    else { key = ""; if(s0) shown = name + " " + s0; }
  }
  if(key === "pkgAdd" && !args.length) key = "pkgAll";
  if(key === "gitClean" && flags.some(f => f === "x" || f === "X"))
    key = "gitCleanX";
  // en chmod y chown el primer argumento son los permisos, no el fichero:
  // hay que leerlo antes de tirarlo
  if(/^(chmod|chown|icacls|attrib)$/.test(name) && args.length > 1){
    const mode = args.shift();
    if(/^[0-7]?7{2,3}$/.test(mode) || /o\+w/.test(mode)) warn.push("world");
  }
  const rules = FL[key] || FL[name] || {};
  for(const f of flags)
    if(rules[f] && warn.indexOf(rules[f]) < 0) warn.push(rules[f]);
  const fixed = FIX[key] || FIX[name];
  if(fixed && warn.indexOf(fixed) < 0) warn.push(fixed);
  if(root) warn.push("admin");            // lo ultimo, que es un matiz
  if(redir && /^(echo|printf|cat|type)$/.test(name)){
    key = "writeFile"; args = [redir];
  }
  const a = args.length
    ? shortArg(args[0])
      + (args.length > 1 && MANY.indexOf(key) >= 0
         ? " (+" + (args.length - 1) + ")" : "")
    : "";
  let tpl = key ? X(key) : "";
  if(!tpl || (!a && tpl.indexOf("{a}") >= 0)) tpl = X("run");
  const t = tpl.replace("{a}", a).replace("{n}", shown).trim();
  warn.sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  return {name: name, t: warn.reduce(
    (acc, k) => acc + (GLUE.indexOf(k) < 0 ? ", " : " ") + XT(k), t)};
}

/* [{t:"Elimina ./build y todo su contenido"}, ...] */
function explain(tool, detail){
  if(!detail) return [];
  const cat = toolIcon(tool);
  if(cat !== "terminal"){
    const k = {read:"xRead", edit:"xEdit", search:"xFind"}[cat];
    return k ? [{t: X(k).replace("{a}", shortArg(detail))}] : [];
  }
  const out = cmdPieces(detail).map(readCmd).filter(Boolean);
  for(let i = 0; i < out.length - 1; i++)     // curl ... | sh
    if(/^(curl|wget|iwr)$/.test(out[i].name)
       && /^(sh|bash|zsh|python|python3|node|pwsh|powershell)$/
          .test(out[i + 1].name))
      out[i + 1].t = X("webRun");
  return out;
}


/* ---------- tiny markdown ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const LIST = /^\s*([-*+]|\d+[.)])\s+/;
function inline(t){
  return t
    .replace(/\*\*\*(.+?)\*\*\*/gs,"<strong><em>$1</em></strong>")
    .replace(/\*\*(.+?)\*\*/gs,"<strong>$1</strong>")
    .replace(/(?<![\w*])\*(?!\s)(.+?)(?<!\s)\*(?![\w*])/gs,"<em>$1</em>")
    .replace(/~~(.+?)~~/gs,"<s>$1</s>")
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function block(src){
  return src.split(/\n{2,}/).map(chunk=>{
    const lines = chunk.split("\n").filter(l => l.trim() !== "");
    let out = "", para = [], list = [], ol = false;
    const flushP = () => { if(para.length){ out += "<p>"+para.join("<br>")+"</p>"; para=[]; } };
    const flushL = () => { if(list.length){
      const tag = ol ? "ol" : "ul";
      out += `<${tag}>`+list.join("")+`</${tag}>`; list=[]; } };
    for(const l of lines){
      const h = l.match(/^#{1,6}\s*(.+)$/);
      if(h){ flushP(); flushL(); out += "<h4>"+inline(h[1])+"</h4>"; }
      else if(LIST.test(l)){
        const num = /^\s*\d/.test(l);
        if(list.length && num !== ol) flushL();
        ol = num; flushP();
        list.push("<li>"+inline(l.replace(LIST,""))+"</li>"); }
      else { flushL(); para.push(inline(l)); }
    }
    flushP(); flushL();
    return out;
  }).join("");
}
function md(src){
  const store = [];
  const held = String(src).replace(/```[\s\S]*?```|`[^`\n]+`/g, m => {
    store.push(m.startsWith("```")
      ? `<div class="cwrap"><pre><code>`
        + esc(m.replace(/^```[\w+-]*\n?|```$/g,"").replace(/\n$/,""))
        + `</code></pre><button class="copyb" type="button"`
        + ` aria-label="copy">${ico("copy")}</button></div>`
      : "<code>"+esc(m.slice(1,-1))+"</code>");
    return "\u0000"+(store.length-1)+"\u0000";
  });
  return block(esc(held))
    .replace(/\u0000(\d+)\u0000/g, (_,i) => store[i])
    .replace(/<p>(<div class="cwrap">[\s\S]*?<\/div>)<\/p>/g, "$1")
    .replace(/<br>(<div class="cwrap">)/g, "$1")
    .replace(/(<\/div>)<br>/g, "$1");
}

/* ---------- rendering ---------- */
function atBottom(){ return main.scrollHeight - main.scrollTop - main.clientHeight < 90; }
function goDown(){
  const show = feed.children.length && !atBottom()
            && !palette.classList.contains("open");
  $("#godown").classList.toggle("on", !!show);
}
addEventListener("load", ()=>{
  main.addEventListener("scroll", goDown, {passive:true});
  $("#godown").onclick = ()=>
    main.scrollTo({top:main.scrollHeight, behavior:"smooth"});
});
const jumpTo = y => main.scrollTo({top:y, behavior:"instant"});
function keepDown(was){
  if(was) jumpTo(main.scrollHeight);   // instant: el suave llega tarde
  requestAnimationFrame(goDown);
}

function render(item){
  const was = atBottom();
  let el = nodes.get(item.id);
  if(!el){ el = document.createElement("div"); el.className="turn";
           nodes.set(item.id, el); feed.appendChild(el); }
  el.__item = item;
  el.innerHTML = html(item);
  if(item.kind === "ask") wireAsk(el, item);
  keepDown(was);
  return el;
}

const tail = it => it.streaming
  ? `<span class="cursor"></span><span class="wordi">${esc(curWord)}</span>`
  : "";

function html(it){
  if(it.kind === "user")
    return `<div class="msg mine"><div class="blk blk-you">`
         + (it.steer ? `<span class="tag">steer</span>` : "")
         + `${esc(it.text)}</div></div>`;
  if(it.kind === "assistant")
    return `<div class="said" data-body>${md(it.text)}${tail(it)}</div>`;
  if(it.kind === "note")
    return `<div class="note ${it.level||""}">`
         + ico(NOTE_ICON[it.level] || "info")
         + `<span>${esc(noteText(it))}</span></div>`;
  if(it.kind === "tool"){
    const body = it.lines ? diffHtml(it.lines)
               : it.output ? `<pre>${esc(it.output)}</pre>` : "";
    const out = body;
    const arg = it.lines
      ? " " + esc((it.args && (it.args.path || it.args.filePath)) || "")
      : it.args ? " " + esc(JSON.stringify(it.args)).slice(0,90) : "";
    const tally = it.added != null
      ? `<span class="tally"><span class="plus">+${it.added}</span>`
        + `<span class="minus">-${it.removed}</span></span>` : "";
    return `<details class="tool" data-s="${it.status||"running"}"${it.output?"":" open"}>
      <summary><span class="dot"></span>${ico(toolIcon(it.name))}`
    + `<span class="nm">${esc(it.name||T("tools"))}${arg}</span>${tally}`
    + `</summary>${out}</details>`;
  }
  if(it.kind === "ask"){
    const done = it.answered ? " done" : "";
    let opts = "";
    const cancel = `<button class="opt no" data-c="__cancel__">`
                 + `${esc(T("cancel"))}</button>`;
    if(it.method === "confirm")
      opts = `<button class="opt yes" data-c="__yes__">${esc(T("yes"))}</button>`
           + `<button class="opt no" data-c="__no__">${esc(T("no"))}</button>`;
    else if(it.method === "select")
      opts = (it.options||[]).map(o=>`<button class="opt" data-c="${esc(o)}">${esc(o)}</button>`).join("")
           + cancel;
    else
      opts = `<button class="opt" data-c="__text__">${esc(T("typeAnswer"))}`
           + `</button>` + cancel;
    const said = explain(it.tool, it.detail).slice(0, 4)
      .map(e => `<p>${esc(e.t)}</p>`).join("");
    const what = it.detail
      ? `<div class="what"><div class="who">${ico(toolIcon(it.tool))}`
        + `${esc(it.tool || T("tools"))}</div>`
        + (said ? `<div class="says">${said}</div>` : "")
        + `<pre>${esc(it.detail)}</pre></div>`
      : "";
    return `<div class="ask${done}" data-rid="${esc(it.rid)}">
      <div class="cap">${esc(T("asking"))}</div>
      <h3>${esc(it.title)}</h3>
      ${it.body?`<div class="body">${esc(it.body)}</div>`:""}
      ${what}
      <div class="opts">${opts}</div>
      ${it.answered?`<div class="verdict">${ico("done")}`
        + `<span>${esc(T("answered"))}: ${esc(it.answered)}</span></div>`:""}
    </div>`;
  }
  return "";
}

/* delegado: los bloques se rehacen en cada token del streaming */
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  ta.remove();
  return ok;
}
/* los <details> nativos abren de golpe: se anima la altura a mano */
feed.addEventListener("click", e=>{
  const sum = e.target.closest(".tool > summary");
  if(!sum) return;
  const det = sum.parentNode;
  const body = det.querySelector(":scope > pre, :scope > .diff");
  if(!body || STILL.matches) return;          // sin cuerpo, comportamiento normal
  e.preventDefault();
  const done = () => {
    det.classList.remove("moving");
    body.style.height = "";
  };
  det.classList.add("moving");
  if(det.open){
    body.style.height = body.scrollHeight + "px";
    requestAnimationFrame(()=>{ body.style.height = "0px"; });
    setTimeout(()=>{ det.open = false; done(); }, 190);
  } else {
    det.open = true;
    const h = body.scrollHeight;
    body.style.height = "0px";
    requestAnimationFrame(()=>{ body.style.height = h + "px"; });
    setTimeout(done, 190);
  }
});

feed.addEventListener("click", async e=>{
  const b = e.target.closest(".copyb");
  if(!b) return;
  const code = b.parentNode.querySelector("code");
  const text = code ? code.textContent : "";
  let ok = false;
  try {                       // sin https no hay clipboard api: hay respaldo
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch(err){ ok = legacyCopy(text); }
  b.innerHTML = ico(ok ? "check" : "copy");
  b.classList.toggle("done", ok);
  if(!ok) note(T("copyFailed"));      // callarse seria peor que fallar
  setTimeout(()=>{
    b.innerHTML = ico("copy");
    b.classList.remove("done");
  }, 1500);
});

const diffHtml = lines => '<div class="diff">' + lines.map(l => {
  const k = l[0] === "+" ? "add" : l[0] === "-" ? "del"
          : l[0] === "@" ? "at" : "";
  return `<div class="${k}">${esc(l)}</div>`;
}).join("") + "</div>";

function wireAsk(el, it){
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    let choice = b.dataset.c;
    if(choice === "__text__"){
      const v = prompt(it.title, it.prefill||"");
      if(v === null) return;
      choice = v;
    }
    send({type:"answer", rid: it.rid, choice});
  });
}

/* ---------- state ---------- */
function paint(){
  const has = !!state.cwd;
  if(has) CWD = state.cwd;
  $("#send").disabled = !has;
  box.placeholder = has ? T("ask") : T("pickFirst");

  if(!has){
    title("");
    $("#sub").classList.remove("on");   // se desvanece
  } else {
    title(state.sessionName || T("unnamed"));
    const bits = [CWD.split(/[\\/]/).filter(Boolean).pop() || CWD,
                  state.model || T("noModel"), state.thinking || "-"];
    if(state.queue && (state.queue.followUp||[]).length)
      bits.push(state.queue.followUp.length + " " + T("queued"));
    $("#sub").firstElementChild.textContent = bits.join("  ·  ");
    $("#sub").classList.add("on");
  }
  emptyState(has);
  paintRail();
  paintWarning();
  marqueeAll($("#title").parentNode);

  // the readout is for work in progress: not while pi waits on you
  document.body.classList.toggle("waiting", !!state.waiting);
  const busy = state.running && !state.waiting;
  $("#readout").hidden = !busy;
  if(busy && !tick) tick = setInterval(secs, 1000);
  if(!busy && tick){ clearInterval(tick); tick = null; }
  if(busy && !wordTimer){
    if(!curWord) pickWord();
    wordTimer = setInterval(()=>{ pickWord(); showWord(true); }, WORD_ROTATE);
  }
  if(!busy && wordTimer){
    clearInterval(wordTimer); wordTimer = null; curWord = "";
  }
  if(busy){ showWord(false); secs(); }

  paintCtx();
}
function title(name){
  const el = $("#title").firstElementChild;
  const txt = name ? "pi-remote | " + name : "pi-remote";
  if(el.textContent === txt) return;
  const done = ()=>{
    el.textContent = txt;
    el.classList.remove("out");
    marqueeAll($("#title").parentNode);
  };
  if(!el.textContent) return done();     // primera vez: sin fundido
  el.classList.add("out");
  setTimeout(done, 220);
}
/* el aviso sale una vez por navegador: dejarlo fijo lo vuelve invisible.
   El estado del acceso se puede consultar siempre en "acerca de". */
function warned(){
  try { return localStorage.getItem("pi.warned") === "1"; }
  catch(e){ return false; }
}
let warnDone = false;              // ya resuelto en esta carga, no tocar mas
function paintWarning(){
  const bar = $("#warnbar");
  if(state.open !== true){ bar.hidden = true; return; }
  if(warnDone) return;             // sin esto el propio repintado lo tapaba
  warnDone = true;
  if(warned()){ bar.hidden = true; return; }
  bar.innerHTML = ico("warn") + `<span>${esc(T("noToken"))}</span>`
    + `<button class="wclose" aria-label="close">${ico("close")}</button>`;
  bar.querySelector(".wclose").onclick = ()=>{ bar.hidden = true; };
  try { localStorage.setItem("pi.warned", "1"); } catch(e){}
  bar.hidden = false;
}
/* el historial tarda un instante en llegar: sin esto la pantalla
   se queda en blanco y parece que no hay nada */
let spinTimer = null;
function spinner(on){
  clearTimeout(spinTimer);
  let el = $("#spin");
  if(!on){
    if(!el) return;
    el.classList.add("out");
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, 260);
    return;
  }
  if(el) return;
  el = document.createElement("div");
  el.id = "spin"; el.className = "spin";
  main.appendChild(el);
  spinTimer = setTimeout(()=> spinner(false), 8000);   // por si nunca llega
}

function emptyState(has){
  let el = $("#nostate");
  if(has || feed.children.length || $("#spin")){
    if(el) el.remove();
    return;
  }
  if(!el){
    el = document.createElement("button");
    el.id = "nostate"; el.className = "empty";
    el.onclick = () => browse("");
    main.appendChild(el);
  }
  el.innerHTML = ico("folderOpen", "i-lg")
    + `<b>${esc(T("noProject"))}</b>${esc(T("noProjectHint"))}`;
}

/* ---------- side rail ---------- */
function openRail(){
  const sc = $("#scrim");
  sc.hidden = false;
  void sc.offsetWidth;              // force layout, or the class lands too soon
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    sc.classList.add("on");
    $("#rail").classList.add("on");
  }));
  // a mitad del deslizamiento los anchos aun no valen: medir al terminar
  setTimeout(()=> marqueeAll($("#rail")), 320);
}
function closeRail(){
  $("#rail").classList.remove("on");
  $("#scrim").classList.remove("on");
  setTimeout(()=>{ $("#scrim").hidden = true; }, 300);
}
/* hold a row instead of tapping it: same gesture as a long press */
function longPress(el, run){
  let timer = null, fired = false, x = 0, y = 0;
  const stop = () => { clearTimeout(timer); timer = null; };
  el.addEventListener("pointerdown", e=>{
    fired = false; x = e.clientX; y = e.clientY;
    timer = setTimeout(()=>{ fired = true; stop(); run(); }, 480);
  });
  el.addEventListener("pointermove", e=>{
    if(timer && Math.hypot(e.clientX - x, e.clientY - y) > 10) stop();
  });
  ["pointerup","pointerleave","pointercancel"].forEach(k=>
    el.addEventListener(k, stop));
  el.addEventListener("contextmenu", e=> e.preventDefault());
  el.addEventListener("click", e=>{
    if(fired){ e.preventDefault(); e.stopPropagation(); fired = false; }
  }, true);
}

let openProj = "";                 // one folder unfolded at a time
const sessCache = {};

async function fetchSessions(path){
  const u = "/api/sessions?token=" + encodeURIComponent(TOKEN)
          + "&path=" + encodeURIComponent(path);
  try { return (await (await fetch(u)).json()).sessions || []; }
  catch(e){ return []; }
}
function groupOf(path){
  return [...document.querySelectorAll(".pgroup")]
    .find(g => g.dataset.path === path);
}
async function toggleProj(path){
  const g = groupOf(path);
  if(!g) return;
  if(openProj === path){            // solo la clase: repintar mata la
    openProj = "";                  // transicion, el nodo naceria ya abierto
    g.classList.remove("open");
    marqueeAll($("#rail"));
    return;
  }
  document.querySelectorAll(".pgroup.open")
    .forEach(x => x.classList.remove("open"));
  openProj = path;
  g.classList.add("open");
  marqueeAll($("#rail"));            // arranca el suyo, para el del anterior
  if(sessCache[path]){ fillSubs(g, path); return; }   // repinta lo cacheado
  const list = await fetchSessions(path);
  sessCache[path] = list;
  if(openProj === path && groupOf(path)) fillSubs(groupOf(path), path);
}
function menuModal(title, rows){
  openModal(title, rows.map((r, i) =>
    `<button class="mrow${r.bad ? " bad" : ""}" data-i="${i}">`
    + (r.icon ? ico(r.icon) : "") + `<span>${esc(r.label)}</span></button>`
  ).join(""), null);
  $("#modalOk").textContent = T("close");   // aqui solo cierra
  $("#modalBody").querySelectorAll(".mrow").forEach(b=>{
    b.onclick = () => { closeModal(); rows[+b.dataset.i].run(); };
  });
}

function projMenu(r){
  menuModal(r.name, [
    {icon:"add", label:T("newSession"), run:()=>{
      closeRail(); send({type:"open_project", path:r.path}); }},
    {icon:"remove", bad:true, label:T("removeProject"), run:()=>
      confirmModal(T("removeQ"), esc(T("removeB")),
                   ()=>send({type:"forget_project", path:r.path}))},
  ]);
}

function sessMenu(projPath, x){
  menuModal(x.label, [
    {icon:"session", label:T("openSession"), run:()=>{
      closeRail();
      send({type:"open_project", path:projPath, session:x.path}); }},
    {icon:"remove", bad:true, label:T("deleteSession"), run:()=>
      confirmModal(T("deleteQ"), esc(T("deleteB")),

}

function paintRail(){
  const list = $("#recents"), rec = state.recent || [];
  $("#recentHead").hidden = !rec.length;
  list.innerHTML = "";
  rec.forEach(r=>{
    const group = document.createElement("div");
    group.className = "pgroup" + (openProj === r.path ? " open" : "");
    group.dataset.path = r.path;

    const head = pickBtn({
      cls: "proj" + (r.path === state.cwd ? " on" : ""),
      icon: "folder", label: r.name, hint: r.path, chevron: true,
      run: () => toggleProj(r.path)});
    longPress(head, () => projMenu(r));
    group.appendChild(head);

    const subs = document.createElement("div");
    subs.className = "subs";
    subs.appendChild(document.createElement("div"));
    group.appendChild(subs);
    list.appendChild(group);
    fillSubs(group, r.path);
  });
  marqueeAll(list);

function fillSubs(group, path){

function paintCtx(){
  const c = state.context, bar = $("#bar");
  const fill = bar.firstElementChild, label = bar.lastElementChild;
  if(!c || c.percent == null){
    fill.style.width = "0%"; label.textContent = ""; return;
  }
  const p = Math.max(0, Math.min(100, c.percent));
  fill.style.width = p + "%";
  bar.classList.toggle("hot", p > 60 && p <= 85);
  bar.classList.toggle("max", p > 85);

/* ---------- socket ---------- */
let backoff = 500;
function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => { backoff = 500; };
  ws.onclose = () => {
    state.alive = false; paint();
    title(T("reconnecting"));
    setTimeout(connect, backoff); backoff = Math.min(backoff*2, 8000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.type === "snapshot"){
      // al reconectar se conserva donde estabas leyendo
      const stay = main.scrollTop, wasDown = atBottom();
      feed.classList.add("nofx");
      feed.innerHTML = ""; nodes.clear(); CWD = m.cwd || "";
      m.items.forEach(render); state = m.state; paint();
      const goEnd = firstSnap || wasDown;
      firstSnap = false;
      requestAnimationFrame(()=>{
        jumpTo(goEnd ? main.scrollHeight : stay);
        feed.classList.remove("nofx");
        goDown();
        spinner(false);              // ya hay contenido que ensenar
      });
    }
    else if(m.type === "item") render(m.item);
    else if(m.type === "patch"){
      const it = m.fields, el = nodes.get(m.id);
      if(!el) return;
      const cur = Object.assign(el.__item || {}, it);
      el.__item = cur; el.innerHTML = html(cur);
      if(cur.kind === "ask") wireAsk(el, cur);
    }
    else if(m.type === "delta"){
      const el = nodes.get(m.id); if(!el) return;
      const was = atBottom();
      el.__item = el.__item || {kind:"assistant", text:"", streaming:true, id:m.id};
      el.__item.text += m.delta;
      const body = el.querySelector("[data-body]");
      if(body) body.innerHTML = md(el.__item.text) + tail(el.__item);
      else el.innerHTML = html(el.__item);
      keepDown(was);
    }
    else if(m.type === "state"){ state = m.state; paint(); }
    else if(m.type === "cleared"){
      feed.innerHTML=""; nodes.clear();
      if(state.cwd) delete sessCache[state.cwd];   // pudo nacer una sesion
      spinner(true);
      paint();
    }
    else if(m.type === "rpc") onRpc(m);
  };
}

/* ---------- composer ---------- */
const box = $("#box"), palette = $("#palette"), plist = $("#plist");
let sel = 0, shown = [];

function slashToggle(){
  $("#field").classList.toggle("typing", box.value.length > 0);
}
box.addEventListener("input", ()=>{
  box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 320)+"px";
  paintPalette(); slashToggle();
});
$("#slashBtn").onclick = ()=>{
  box.value = "/";              // sin focus: el teclado movia toda la vista
  paintPalette(); slashToggle();
};
box.addEventListener("blur", ()=>setTimeout(()=>closePalette(), 150));

function query(){
  const v = box.value;
  if(!v.startsWith("/") || v.includes("\n")) return null;
  const m = v.slice(1).match(/^(\S*)(\s?)/);
  return m[2] ? null : m[1];       // once you type a space, it is an argument
}
function paintPalette(){
  const q = query();
  if(q === null) return closePalette();
  shown = CMDS.filter(c => c.n.startsWith(q.toLowerCase()));
  if(!shown.length){
    plist.innerHTML = `<div class="none">no command matches /${esc(q)}</div>`;
    palette.classList.add("open"); return;
  }
  if(sel >= shown.length) sel = 0;
  plist.innerHTML = shown.map((c,i)=>
    `<button class="cmd${i===sel?" sel":""}" data-i="${i}">
       <b>/${c.n}${c.arg?" &lt;"+esc(argOf(c))+"&gt;":""}</b><span>${esc(c.h)}</span></button>`
  ).join("");
  plist.querySelectorAll(".cmd").forEach(b=>{
    b.onmousedown = e => e.preventDefault();      // keep focus in the textarea
    b.onclick = () => choose(shown[+b.dataset.i]);
  });
  $("#phead").textContent = q ? `${T("commands")} ${T("matching")} /${q}`
                              : T("commands");
  palette.classList.add("open");
}
function closePalette(){
  palette.classList.remove("open"); sel = 0;
  if(box.value === "/"){        // barra suelta de un panel que no se uso
    box.value = ""; box.style.height = "auto"; slashToggle();
  }
}
main.addEventListener("pointerdown", ()=>{
  if(palette.classList.contains("open")) closePalette();
});
function choose(c){
  if(c.arg){                                   // needs text: prefill and wait
    box.value = "/" + c.n + " ";
    box.focus(); closePalette(); slashToggle(); return;
  }
  box.value = ""; box.style.height = "auto";
  closePalette(); slashToggle(); c.run();
}
function runLine(text){
  const m = text.match(/^\/(\S+)\s*([\s\S]*)$/);
  const c = CMDS.find(x => x.n === m[1].toLowerCase());
  if(!c) return note(`no command called /${m[1]}. type / to see the list`);
  if(c.arg && !m[2].trim()) return note(`/${c.n} <${argOf(c)}>`);
  c.run(m[2].trim());
}

box.addEventListener("keydown", e=>{
  if(palette.classList.contains("open") && shown.length){
    if(e.key === "ArrowDown"){ e.preventDefault(); sel=(sel+1)%shown.length; paintPalette(); return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); sel=(sel-1+shown.length)%shown.length; paintPalette(); return; }
    if(e.key === "Tab"){ e.preventDefault(); choose(shown[sel]); return; }
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); choose(shown[sel]); return; }
    if(e.key === "Escape"){ closePalette(); return; }
  }
  if(e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){
    e.preventDefault(); submit();
  }
});
$("#send").onclick = submit;
function submit(){
  const text = box.value.trim(); if(!text) return;
  box.value = ""; box.style.height = "auto"; closePalette(); slashToggle();
  if(text.startsWith("/")) return runLine(text);
  send({type:"prompt", message:text});
}

/* notes come from the bridge as a key plus values, so they can be said
   in either language. an unknown key falls back to its english text. */
const NOTES = {
  en:{pi_stdin:"pi is not accepting input: {err}",
      pi_exited:"pi exited. reopen the project.",
      not_folder:"not a folder: {path}",
      start_failed:"could not start pi: {err}",
      project:"project: {path}",
      no_project:"no project open. pick a folder first.",
      cmd_failed:"{cmd} failed: {err}",
      compacted:"context compacted: {before} to {after} tokens",
      retrying:"retrying {n}/{max}",
      extension:"extension: {err}",
      exported:"exported to {path}",
      del_ok:"session moved to _trash",
      del_in_use:"that session is open right now",
      del_missing:"that session is not there any more",
      del_outside:"that file is not one of pi's sessions",
      del_bad_path:"bad session path",
      del_failed:"could not move the session"},
  es:{pi_stdin:"pi no acepta entrada: {err}",
      pi_exited:"pi ha salido. vuelve a abrir el proyecto.",
      not_folder:"no es una carpeta: {path}",
      start_failed:"no se pudo arrancar pi: {err}",
      project:"proyecto: {path}",
      no_project:"sin proyecto. elige una carpeta primero.",
      cmd_failed:"{cmd} ha fallado: {err}",
      compacted:"contexto comprimido: de {before} a {after} tokens",
      retrying:"reintentando {n}/{max}",
      extension:"extensi\u00f3n: {err}",
      exported:"exportado a {path}",
      del_ok:"sesi\u00f3n movida a _trash",
      del_in_use:"esa sesi\u00f3n est\u00e1 abierta ahora mismo",
      del_missing:"esa sesi\u00f3n ya no est\u00e1",
      del_outside:"ese fichero no es una sesi\u00f3n de pi",
      del_bad_path:"ruta de sesi\u00f3n no v\u00e1lida",
      del_failed:"no se pudo mover la sesi\u00f3n"},
};
function noteText(it){
  const tpl = it.key && (NOTES[lang()] || NOTES.en)[it.key];
  if(!tpl) return it.text || "";
  const a = it.args || {};
  return tpl.replace(/\{(\w+)\}/g, (_, k) => a[k] != null ? a[k] : "");
}

const WORD_ROTATE = 8000;
let curWord = "", wordTimer = null;

function pickWord(){
  const list = WORDS[lang()] || WORDS.en;
  let w = curWord;
  while(w === curWord && list.length > 1) w = list[Math.random() * list.length | 0];
  curWord = w;
}
function showWord(fade){
  const el = feed.querySelector(".wordi");
  if(!el || el.textContent === curWord) return;
  if(!fade){ el.textContent = curWord; return; }
  el.classList.add("out");
  setTimeout(()=>{ el.textContent = curWord; el.classList.remove("out"); }, 220);
}

/* ---------- theme ---------- */
const THEMES = ["auto", "light", "dark", "klaude"];
const THEME_NAME = t => t === "klaude" ? "Klaude" : T(t);
const SIZES = [13, 14, 15, 16, 17, 18, 19, 20];
const SYS = matchMedia("(prefers-color-scheme: light)");

function themePref(){
  try { return localStorage.getItem("pi.theme") || "auto"; }
  catch(e){ return "auto"; }
}
function sizeStep(){
  try {
    const v = parseInt(localStorage.getItem("pi.size"), 10);
    if(v >= 0 && v < SIZES.length) return v;
  } catch(e){}
  return 2;                        // 15px, el de siempre
}
function applySize(step){
  document.documentElement.style.setProperty(
    "--chat-size", SIZES[step] + "px");
}
function setSize(step){
  try { localStorage.setItem("pi.size", String(step)); } catch(e){}
  applySize(step);
}
applySize(sizeStep());

function applyTheme(pref){
  const t = pref !== "auto" ? pref : (SYS.matches ? "light" : "dark");
  document.documentElement.dataset.theme = t;
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta){                       // the phone browser chrome follows along
    const v = getComputedStyle(document.documentElement)
                .getPropertyValue("--plate-b").trim();
    if(v) meta.content = v;
  }
}
function setTheme(pref){
  try { localStorage.setItem("pi.theme", pref); } catch(e){}
  applyTheme(pref);
}
applyTheme(themePref());
SYS.addEventListener("change", () => {
  if(themePref() === "auto") applyTheme("auto");
});

/* ---------- menu ---------- */
function sizeCard(body){
  const card = document.createElement("div");
  card.className = "sizecard";
  card.innerHTML = `<div class="lbl">${esc(T("fontSize"))}</div>`
    + `<div class="fsize"><div class="a sm">A</div>`
    + `<div class="track"><div class="srail"></div><div class="dots"></div>`
    + `<input type="range" min="0" max="${SIZES.length - 1}" step="1"`
    + ` value="${sizeStep()}" aria-label="${esc(T("fontSize"))}"></div>`
    + `<div class="a lg">A</div></div>`;
  card.querySelector("input").oninput = e => setSize(+e.target.value);
  body.appendChild(card);
}

/* el menu es un cuaderno de paginas: raiz, apariencia, idioma */
let sheetPage = "root";
function paintSheet(page){
  sheetPage = page;
  const body = $("#sheetBody"), back = $("#sheetBack");
  body.innerHTML = "";
  back.hidden = page === "root";
  if(!back.innerHTML) back.innerHTML = ico("back");
  back.onclick = () => turnTo("root", -1);

  const head = t => {
    const h = document.createElement("div");
    h.className = "shead"; h.textContent = T(t); body.appendChild(h);
  };
  const act = (key, icon, run) => body.appendChild(pickBtn({
    icon: icon, label: T(key), chevron: true, run: run}));

  if(page === "appearance"){
    $("#sheetTitle").textContent = T("appearance");
    body.appendChild(pickBtn({icon:"palette", label:T("theme"),
                              chevron:true, run:themeModal}));
    sizeCard(body);
    return;
  }
  if(page === "language"){
    $("#sheetTitle").textContent = T("language");
    LANGS.forEach(l => body.appendChild(pickBtn({
      icon: l === lang() ? "check" : null, label: LANG_NAME[l],
      run: () => { setLang(l); turnTo("root", -1); }})));
    return;
  }

  $("#sheetTitle").textContent = T("menu");
  act("appearance", "palette", () => turnTo("appearance", 1));
  act("language", "lang", () => turnTo("language", 1));
  head("\u00a0");
  body.appendChild(pickBtn({icon:"help", label:T("help"),
    run: () => { $("#sheet").classList.remove("open"); helpModal(); }}));
  body.appendChild(pickBtn({icon:"info", label:T("about"),
    run: () => { $("#sheet").classList.remove("open"); aboutModal(); }}));
  body.appendChild(pickBtn({icon:"donate", label:T("donate"),
    run: () => { $("#sheet").classList.remove("open");
      PAYPAL ? open(PAYPAL, "_blank", "noopener")
             : modal(T("donate"), "<p>Coming soon.</p>"); }}));
}

function turnTo(page, dir){
  const body = $("#sheetBody");
  if(STILL.matches){ paintSheet(page); return; }
  body.classList.add(dir > 0 ? "to-left" : "to-right");
  setTimeout(()=>{
    paintSheet(page);
    body.classList.remove("to-left", "to-right");
    body.classList.add(dir > 0 ? "to-right" : "to-left");
    requestAnimationFrame(()=> requestAnimationFrame(()=>
      body.classList.remove("to-left", "to-right")));
  }, 170);
}

function menuSheet(){
  paintSheet("root");
  $("#sheet").classList.add("open");
  marqueeAll($("#sheetBody"));
}
$("#menuBtn").onclick = menuSheet;

/* ---------- sheet ---------- */
/* slide the overflow instead of cutting it. measured, not guessed:
   only what actually sticks out gets a marquee. */
const STILL = matchMedia("(prefers-reduced-motion: reduce)");
function marquee(el){
  const inner = el.firstElementChild;
  if(!inner) return;
  // en la barra lateral solo se mueve el proyecto desplegado: cuatro
  // textos deslizandose a la vez marean mas de lo que ayudan
  const group = el.closest(".pgroup");
  if(group && !group.classList.contains("open")){
    el.classList.remove("run");
    return;
  }
  const over = inner.scrollWidth - el.clientWidth;
  if(over > 3 && !STILL.matches){
    el.style.setProperty("--mq-shift", -(over + 4) + "px");
    el.style.setProperty("--mq-dur", (over / 26 + 6).toFixed(1) + "s");
    el.classList.add("run");
  } else {
    el.classList.remove("run");
  }
}
function marqueeAll(root){
  requestAnimationFrame(()=>                    // tras el reflow, con ancho ya
    (root || document).querySelectorAll(".mq").forEach(marquee));
}
if(document.fonts) document.fonts.ready.then(()=> marqueeAll());
addEventListener("resize", ()=> marqueeAll());

/* el teclado no encoge la ventana, solo el viewport visual */
if(window.visualViewport){
  const vv = window.visualViewport;
  const fitKeyboard = ()=>{
    const gap = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", Math.round(gap) + "px");
  };
  vv.addEventListener("resize", fitKeyboard);
  vv.addEventListener("scroll", fitKeyboard);
  fitKeyboard();
}
STILL.addEventListener("change", ()=> marqueeAll());

const mqSpan = (cls, text) =>
  `<${cls} class="mq"><span>${esc(text)}</span></${cls}>`;

function pickBtn(o){
  const b = document.createElement("button");
  b.className = o.cls || "pick";
  b.innerHTML = (o.icon ? ico(o.icon) : "")
    + `<span class="txt">` + mqSpan("span", o.label)
    + (o.hint ? mqSpan("small", o.hint) : "") + "</span>"
    + (o.chevron ? ico("chevron", "ch") : "");
  b.onclick = o.run;
  return b;
}
function sheet(title, rows){
  $("#sheetTitle").textContent = title;
  const body = $("#sheetBody"); body.innerHTML = "";
  rows.forEach(r=>{
    r.run = (run => () => { $("#sheet").classList.remove("open"); run(); })(r.run);
    body.appendChild(pickBtn(r));
  });
  $("#sheet").classList.add("open");
  marqueeAll(body);
}
$("#sheet").onclick = e => {
  if(e.target.id === "sheet") e.target.classList.remove("open");
};
addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if($("#modal").classList.contains("open")) return closeModal();
  if($("#rail").classList.contains("on")) return closeRail();
  if($("#sheet").classList.contains("open") && sheetPage !== "root")
    return turnTo("root", -1);       // Escape sube un nivel antes de cerrar
  $("#sheet").classList.remove("open");
});

async function loadSessions(){
  const r = await fetch("/api/sessions?token=" + encodeURIComponent(TOKEN));
  const d = await r.json();
  if(!d.sessions || !d.sessions.length)
    return sheet(T("sessions"),
      [{label:T("noSessions"), hint:d.dir, run(){}}]);
  sheet(T("sessions"), d.sessions.map(s=>({
    label: s.label,
    hint: new Date(s.mtime*1000).toLocaleString(),
    run: () => send({type:"switch_session", sessionPath:s.path})
  })));
}

/* ---------- folder picker: one tap walks in, button picks ---------- */
async function browse(path){
  const u = "/api/browse?token=" + encodeURIComponent(TOKEN) +
            (path ? "&path=" + encodeURIComponent(path) : "");
  let d;
  try { d = await (await fetch(u)).json(); }
  catch(e){ return note("cannot reach the bridge"); }
  if(d.error) return note(d.error);

  $("#sheetTitle").textContent = T("project");
  const body = $("#sheetBody"); body.innerHTML = "";

  const nav = document.createElement("div");
  nav.className = "nav";
  const up = document.createElement("button");
  up.className = "iconbtn ico"; up.innerHTML = ico("up");
  up.title = up.ariaLabel = T("up"); up.disabled = !d.parent;
  up.onclick = () => browse(d.parent);
  const where = document.createElement("span");
  where.className = "path"; where.textContent = d.path;
  nav.append(up, where); body.appendChild(nav);

  const use = document.createElement("button");
  use.className = "usebtn";
  use.textContent = T("useFolder") + (d.mark ? "  (" + d.mark + ")" : "");
  use.onclick = () => {
    $("#sheet").classList.remove("open");
    send({type:"open_project", path:d.path});
  };
  body.appendChild(use);

  (d.dirs||[]).forEach(x=>{
    const b = pickBtn({icon:"folder", label:x.name, chevron:true,
                       run:()=>browse(x.path)});
    if(x.mark) b.querySelector(".txt").insertAdjacentHTML("beforeend",
      `<small class="mk">${esc(x.mark)}</small>`);
    body.appendChild(b);
  });
  if(!(d.dirs||[]).length){
    const p = document.createElement("div");
    p.className = "nosub"; p.textContent = T("noSub");
    body.appendChild(p);
  }
  $("#sheet").classList.add("open");
}

function onRpc(m){
  const d = m.data || {};
  if(m.command === "get_available_models")
    return sheet("model", (d.models||[]).map(x=>({
      label:x.name, hint:`${x.provider}  ·  ${x.contextWindow||"?"} ctx`,
      run:()=>send({type:"set_model", provider:x.provider, modelId:x.id})})));
  if(m.command === "get_available_thinking_levels")
    return sheet("thinking", (d.levels||[]).map(l=>({
      label:l, run:()=>send({type:"set_thinking_level", level:l})})));
  if(m.command === "get_fork_messages")
    return sheet("fork from", (d.messages||[]).slice(-12).reverse().map(x=>({
      label:(x.text||"(empty)").slice(0,90),
      run:()=>send({type:"fork", entryId:x.entryId})})));
  if(m.command === "get_last_assistant_text")
    return alert(d.text || "nothing yet");
}

connect();
