/* ---------- state ---------- */
function paint(){
  const has = !!state.cwd;
  if(has) CWD = state.cwd;
  // mientras trabaja el boton para, y para eso no hace falta texto
  const ro = state.readOnly === true;
  $("#send").disabled = !has || ro;
  box.contentEditable = ro ? "false" : "true";
  phDefault = ro ? T("noToken")
                 : (has ? T("ask") : T("pickFirst"));
  applyPh();

  if(!has){
    title("");
    $("#sub").classList.remove("on");   // se desvanece
    $("#cmeta").textContent = "";
  } else {
    if(sessLoading){
      if(state.sessionName) resolveTitle();               // llego: fade-in
      else $("#title").firstElementChild.classList.add("out");  // en blanco
    } else if(state.sessionName){
      title(state.sessionName);
    } else {
      // sesion sin nombre (RPC sin /name): en blanco, nunca "sin titulo"
      const el = $("#title").firstElementChild;
      if(el.textContent) el.textContent = "";
      el.classList.remove("out");
    }
    $("#sub").firstElementChild.textContent =
      CWD.split(/[\\/]/).filter(Boolean).pop() || CWD;
    $("#sub").classList.add("on");
    const meta = [state.model || T("noModel"), state.thinking || "-"];
    if(state.queue && (state.queue.followUp||[]).length)
      meta.push(state.queue.followUp.length + " " + T("queued"));
    $("#cmeta").textContent = meta.join("  ·  ");
  }
  emptyState(has);
  paintRail();
  maybeChats();
  paintWarning();
  marqueeAll($("#title").parentNode);

  // the readout is for work in progress: not while pi waits on you
  document.body.classList.toggle("waiting", !!state.waiting);
  const busy = state.running && !state.waiting;
  const wasHidden = $("#readout").hidden;
  if(busy) barShown = true;                 // una vez aparece, se queda
  $("#readout").hidden = !(busy || barShown);
  if((busy || barShown) && wasHidden){      // recien aparecida: no tapar
    const ro = $("#readout");
    ro.classList.remove("show"); void ro.offsetWidth; ro.classList.add("show");
    // el relleno nace de cero: paintCtx corre despues en este mismo pase,
    // asi que el reset se deja para el frame siguiente. Sin transicion en el
    // reset (si no, la barra baja animada desde el valor viejo) y con flag:
    // ningun paintCtx ajenos lo pisan durante la secuencia. Espera a que la
    // barra haya entrado (fila 450 ms + fade hasta ~950 ms) antes de subir
    ctxIntro = true;
    requestAnimationFrame(()=> {
      const f = $("#bar i");
      f.style.transition = "none";
      f.style.width = "0%";
      void f.offsetWidth;
      f.style.transition = "";
      setTimeout(()=>{ ctxIntro = false; paintCtx(); }, 1000);
    });
    requestAnimationFrame(()=> jumpTo(main.scrollHeight));
  }
  if(!(busy || barShown)) $("#readout").classList.remove("show");
  $("#send").classList.toggle("halting", busy);
  // el aro del resumen lo manda el puente: vive desde el abort hasta que
  // llega el resumen, cruzando el hueco en que el agente no esta ocupado
  $("#send").classList.toggle("summing", !!state.summarizing);
  $("#field").classList.toggle("busy", busy);
  if(busy) stopSending();
  if(busy && !tick) tick = setInterval(secs, 1000);
  if(!busy && tick){ clearInterval(tick); tick = null; }
  if(busy && !wordTimer){
    if(!curWord) pickWord();
    wordTimer = setInterval(()=>{ pickWord(); showWord(true); }, WORD_ROTATE);
  }
  if(!busy && wordTimer){
    clearInterval(wordTimer); wordTimer = null; curWord = "";
  }
  if(busy) showWord(false);
  paintStatus();

  paintCtx();
}
function title(name){
  const el = $("#title").firstElementChild;
  const txt = name || "pi-remote";
  if(el.textContent === txt) return;
  const done = ()=>{
    el.textContent = txt;
    el.classList.remove("out");
    marqueeAll($("#title").parentNode);
  };
  if(!el.textContent) return done();     // primera vez: sin fundido
  el.classList.add("out");
  setTimeout(done, 220);
}
/* llego el nombre (o se agoto la gracia): el titulo estaba en blanco (.out,
   opacidad 0) mientras cargaba; ponemos el nombre y lo fundimos a la vista.
   Evita el flash de "sesion sin titulo". */
function resolveTitle(){
  clearTimeout(titleGrace);
  sessLoading = false;
  const el = $("#title").firstElementChild;
  // nunca "sesion sin titulo": si aun no hay nombre, en blanco (el nombre
  // entrara luego con fade). El subtitulo ya muestra la carpeta.
  el.textContent = state.sessionName || "";
  el.classList.add("out");                                 // parte invisible
  requestAnimationFrame(()=> el.classList.remove("out"));  // y funde a la vista
  marqueeAll($("#title").parentNode);
}

   El estado del acceso se puede consultar siempre en "acerca de". */

function paintWarning(){
  const bar = $("#warnbar");
  if(state.readOnly !== true){ bar.hidden = true; return; }

  warnDone = true;

  bar.innerHTML = ico("warn") + `<span>${esc(T("noToken"))}</span>`
    + `<button class="wclose" aria-label="close">${ico("close")}</button>`;

/* hold a row instead of tapping it: same gesture as a long press */
function longPress(el, run){
  let timer = null, fired = false, x = 0, y = 0;
  const stop = () => { clearTimeout(timer); timer = null; };
  el.addEventListener("pointerdown", e=>{
    fired = false; x = e.clientX; y = e.clientY;
    timer = setTimeout(()=>{ fired = true; stop(); run(); }, 480);
  });
  el.addEventListener("pointermove", e=>{
    if(timer && Math.hypot(e.clientX - x, e.clientY - y) > 10) stop();
  });
  ["pointerup","pointerleave","pointercancel"].forEach(k=>
    el.addEventListener(k, stop));
  el.addEventListener("contextmenu", e=> e.preventDefault());
  el.addEventListener("click", e=>{
    if(fired){ e.preventDefault(); e.stopPropagation(); fired = false; }
  }, true);
}

let openProj = "";                 // one folder unfolded at a time
const sessCache = {};

async function fetchSessions(path){
  const u = "/api/sessions?token=" + encodeURIComponent(TOKEN)
          + "&path=" + encodeURIComponent(path);
  try { return (await (await fetch(u)).json()).sessions || []; }
  catch(e){ return []; }
}
function groupOf(path){
  return [...document.querySelectorAll(".pgroup")]
    .find(g => g.dataset.path === path);
}
const loadingSubs = {};
async function loadSubs(path){
  if(loadingSubs[path]) return;
  loadingSubs[path] = true;
  const list = await fetchSessions(path);
  delete loadingSubs[path];
  sessCache[path] = list;
  const g = groupOf(path);
  if(g && openProj === path){
    fillSubs(g, path);
    const inner = g.querySelector(".subs > div");   // funde al mostrar
    if(inner) inner.style.animation = "subsIn .3s ease";
  }
}

async function toggleProj(path){
  const g = groupOf(path);
  if(!g) return;
  if(openProj === path){            // solo la clase: repintar mata la
    openProj = "";                  // transicion, el nodo naceria ya abierto
    g.classList.remove("open");
    marqueeAll($("#rail"));
    return;
  }
  document.querySelectorAll(".pgroup.open")
    .forEach(x => x.classList.remove("open"));
  openProj = path;
  g.classList.add("open");
  marqueeAll($("#rail"));            // arranca el suyo, para el del anterior
  fillSubs(g, path);                 // pide por su cuenta si no hay nada
}

function fillSubs(group, path){
  const inner = group.querySelector(".subs > div");
  inner.innerHTML = "";
  inner.appendChild(pickBtn({
    cls: "sess new", icon: "add", label: T("newSession"),
    run: () => { closeRail();

      else send({type:"open_project", path}); }}));

  const cached = sessCache[path];
  const note = txt => {
    const p = document.createElement("div");
    p.className = "none"; p.textContent = txt; inner.appendChild(p);
  };
  if(!cached){
    if(group.classList.contains("open")){ note(T("loading")); loadSubs(path); }
    return;
  }
  if(!cached.length) return note(T("noSessionsYet"));
  cached.forEach(x=>{
    const b = pickBtn({
      cls:"sess", icon:"session", label:x.label,
      hint:new Date(x.mtime*1000).toLocaleString(),
      run: () => { closeRail();
        send({type:"open_project", path, session:x.path}); }});
    longPress(b, () => sessMenu(path, x));
    inner.appendChild(b);
  });
  marqueeAll(inner);
}

/* ---------- la columna de proyectos, en pantalla ancha ----------
   En estrecho la barra sigue siendo un cajon: aqui es una columna del
   grid, y lo que se ajusta es su ancho. */
const WIDE = matchMedia("(min-width:1000px)");
const RAIL_MIN = 190, RAIL_MAX = 480;

function railWidth(){
  try {
    const v = parseInt(localStorage.getItem("pi.rail"), 10);
    if(v >= RAIL_MIN && v <= RAIL_MAX) return v;
  } catch(e){}
  return 292;
}
function setRailWidth(px, save){
  const v = Math.max(RAIL_MIN, Math.min(RAIL_MAX, Math.round(px)));
  document.documentElement.style.setProperty("--rail-w", v + "px");
  if(save){ try { localStorage.setItem("pi.rail", v); } catch(e){} }
  return v;
}
function folded(){
  try { return localStorage.getItem("pi.fold") === "1"; } catch(e){}
  return false;
}
function setFolded(on){
  document.body.classList.toggle("folded", !!on);
  try { localStorage.setItem("pi.fold", on ? "1" : "0"); } catch(e){}
  marqueeAll($("#rail"));
}
setRailWidth(railWidth(), false);
if(folded()) document.body.classList.add("folded");

$("#foldBtn").onclick = () => setFolded(true);

(() => {                                  // arrastrar la linea divisoria
  const grip = $("#grip");
  let from = 0, base = 0;
  grip.addEventListener("pointerdown", e => {
    from = e.clientX; base = railWidth();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add("drag");
    document.body.classList.add("dragging");
    e.preventDefault();
  });
  grip.addEventListener("pointermove", e => {
    if(!grip.classList.contains("drag")) return;
    setRailWidth(base + (e.clientX - from), false);
  });
  const done = e => {
    if(!grip.classList.contains("drag")) return;
    grip.classList.remove("drag");
    document.body.classList.remove("dragging");
    setRailWidth(railWidthNow(), true);
    marqueeAll($("#rail"));
    try { grip.releasePointerCapture(e.pointerId); } catch(err){}
  };
  grip.addEventListener("pointerup", done);
  grip.addEventListener("pointercancel", done);
  grip.addEventListener("dblclick", () => setRailWidth(292, true));
})();
const railWidthNow = () => parseInt(
  getComputedStyle(document.documentElement)
    .getPropertyValue("--rail-w"), 10) || 292;

function openModal(title, body, run, opts){

                   : () => closeModal();

   queda un tema aplicado que el dialogo marca como no elegido. */

/* gestos del lightbox: pinch para zoom, un dedo para desplazar (con zoom) o
   arrastrar abajo para cerrar (sin zoom). El resto de la app no hace zoom. */
const lbpts = new Map();
let lbDist = 0, lbStartScale = 1, lbDrag = false, lbSX = 0, lbSY = 0,
    lbPX = 0, lbPY = 0;
const lbHyp = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
LB.addEventListener("touchstart", e => {
  for(const t of e.changedTouches)
    lbpts.set(t.identifier, {x: t.clientX, y: t.clientY});
  const p = [...lbpts.values()];
  LBimg.style.transition = "none";
  if(p.length === 2){ lbDist = lbHyp(p[0], p[1]); lbStartScale = lbScale; }
  else if(p.length === 1){
    lbDrag = true; lbSX = p[0].x; lbSY = p[0].y; lbPX = lbX; lbPY = lbY;
  }
}, {passive: false});
LB.addEventListener("touchmove", e => {
  e.preventDefault();
  for(const t of e.changedTouches)
    if(lbpts.has(t.identifier)) lbpts.set(t.identifier, {x: t.clientX, y: t.clientY});
  const p = [...lbpts.values()];
  if(p.length >= 2 && lbDist){
    lbScale = Math.max(1, Math.min(5, lbStartScale * lbHyp(p[0], p[1]) / lbDist));
    lbApply();
  } else if(p.length === 1 && lbDrag){
    const dx = p[0].x - lbSX, dy = p[0].y - lbSY;
    if(lbScale > 1.02){ lbX = lbPX + dx; lbY = lbPY + dy; lbApply(); }
    else {                              // sin zoom: arrastrar abajo cierra
      lbY = Math.max(0, dy);
      LBimg.style.transform = `translateY(${lbY}px) scale(1)`;
      LB.style.opacity = String(Math.max(0, 1 - lbY / 320));
    }
  }
}, {passive: false});
function lbEnd(e){
  for(const t of e.changedTouches) lbpts.delete(t.identifier);
  if(lbpts.size === 0){
    if(lbScale <= 1.02){
      if(lbY > 90){                     // arrastrado abajo: desliza y cierra
        LBimg.style.transition = "transform .2s ease";
        LBimg.style.transform = `translateY(${innerHeight}px) scale(1)`;
        closeLightbox(); return;        // NO resetear ahora: eso era el glitch
      }
      LBimg.style.transition = "transform .2s ease";   // no llego: vuelve suave
      lbScale = 1; lbX = 0; lbY = 0; LB.style.opacity = ""; lbApply();
    }
    lbDrag = false;
  } else if(lbpts.size === 1){          // de pinch a un dedo: re-anclar el pan
    const q = [...lbpts.values()][0];
    lbDrag = true; lbSX = q.x; lbSY = q.y; lbPX = lbX; lbPY = lbY;
  }
}
LB.addEventListener("touchend", lbEnd);
LB.addEventListener("touchcancel", lbEnd);

    `<button class="mrow" data-fam="${f.id}">`

  const foot =
    `<div class="tmode">`
    + `<div class="frow"><span class="flbl">${esc(T("auto"))}</span>`
    + `<button class="sw" role="switch" aria-label="${esc(T("auto"))}">`
    + `<span class="knob"></span></button></div>`
    + `<div class="seg" role="group" aria-label="${esc(T("theme"))}">`
    + `<button data-m="light">${esc(T("light"))}</button>`
    + `<button data-m="dark">${esc(T("dark"))}</button></div></div>`;
  openModal(T("theme"), rows + foot,
            () => { setTheme(fam, mode);
                    // refresca "Tema | <familia>" en ajustes, que queda detras
                    if(sheetPage === "appearance") paintSheet("appearance"); },
            {plain: true, cancel: () => applyTheme(beforeFam, beforeMode)});
  const body = $("#modalBody");
  const sw = body.querySelector(".tmode .sw");
  const seg = body.querySelector(".seg");
  function paint(){
    body.querySelectorAll(".mrow").forEach(x =>
      x.classList.toggle("on", x.dataset.fam === fam));
    const auto = mode === "auto";
    sw.setAttribute("aria-checked", auto ? "true" : "false");
    seg.classList.toggle("off", auto);
    const eff = modeLight(mode) ? "light" : "dark";
    seg.querySelectorAll("button").forEach(b => {
      b.disabled = auto;
      b.classList.toggle("on", b.dataset.m === eff);
    });
    applyTheme(fam, mode);           // solo vista previa
  }
  body.querySelectorAll(".mrow").forEach(b => {
    b.onclick = () => { fam = b.dataset.fam; paint(); };
  });
  sw.onclick = () => {
    mode = mode === "auto" ? (SYS.matches ? "light" : "dark") : "auto";
    paint();
  };
  seg.querySelectorAll("button").forEach(b => {
    b.onclick = () => { if(mode === "auto") return; mode = b.dataset.m; paint(); };
  });
  paint();
}

const kilo = v => v >= 1000 ? Math.round(v / 1000) + "k" : String(v || 0);
function paintCtx(){
  const c = state.context, bar = $("#bar");
  const fill = bar.firstElementChild, label = bar.lastElementChild;
  if(!c || c.percent == null){
    fill.style.width = "0%"; label.textContent = ""; return;
  }
  const p = Math.max(0, Math.min(100, c.percent));
  if(!ctxIntro) fill.style.width = p + "%";   // durante la entrada: a cero
  bar.classList.toggle("hot", p > 60 && p <= 85);
  bar.classList.toggle("max", p > 85);
  label.textContent = p.toFixed(2) + "%"
    + (c.tokens != null ? "  |  " + kilo(c.tokens) + "/" + kilo(c.window) : "");
}
function elapsed(){
  if(!state.startedAt) return "";
  // el reloj del puente puede ir por delante del navegador: nunca negativo
  return Math.max(0, Math.round(Date.now()/1000 - state.startedAt)) + "s";
}
/* piensa = trabaja pero no ha escrito texto en el ultimo instante */
let lastDelta = 0, barShown = false, ctxIntro = false;   // secuencia de entrada de la barra
function thinking(){
  return state.running && !state.waiting && Date.now() - lastDelta > 700;
}
/* prefill = el modelo reingiere el contexto antes del primer token. pi no lo
   avisa: se infiere. Certero al cambiar de sesion o compactar; por tiempo
   cuando llama.cpp se reinicio y la reingesta tarda. */
let produced = false, coldNext = false, turnStart = 0;
let pendingUser = null;            // burbuja recien enviada, aun sin ack de pi
let sessLoading = false;   // cambiando de sesion: el titulo va en skeleton
let titleGrace = null;     // espera de gracia por el nombre antes de rendirse
const PREFILL_MS = 1500;
function prefilling(){
  return state.running && !state.waiting && !produced
      && (coldNext                       // certero: sesion fria o compactacion
          || (turnStart > 0 && Date.now() - turnStart > PREFILL_MS));  // heuristico
}
function coldTurn(){
  produced = false; coldNext = true; turnStart = Date.now();
  paintStatus();               // muestra "prefilling…" ya, sin esperar al tick
}
function noteProduced(){
  // pi ya produjo: confirma la burbuja del usuario (quita el estado sin ack)
  if(pendingUser){ pendingUser.classList.remove("you-pending"); pendingUser = null; }
  if(produced) return;
  produced = true; coldNext = false;
  paintStatus();               // quita "prefilling…" y su clase en cuanto sale algo
}
function paintStatus(){
  const rs = $("#rsecs");
  if(rs) rs.textContent = state.running ? elapsed() : "";
  const pre = prefilling();
  $("#readout").classList.toggle("thinking", thinking() || pre);
  $("#readout").classList.toggle("prefill", pre);
  showWord(true);             // sigue el cambio prefill <-> palabra rotatoria
}
let statsAsked = 0;
function secs(){
  if(!state.startedAt) return;
  paintStatus();
  // pi no avisa cuando el contexto cambia: hay que preguntarlo
  if(state.cwd && state.running && Date.now() - statsAsked > 5000){
    statsAsked = Date.now();
    send({type:"get_session_stats"});
  }
}

/* El telon rellena el titulo UNA vez; despues respira hasta que hay algo
   que ensenar (snapshot) o hasta el tope de 4s, y entonces transiciona a la
   interfaz. El dibujo se ve siempre entero: la salida espera a que termine.
   Mejor la interfaz con su aviso de reconexion que una pantalla colgada. */
let booted = false;    // snapshot o tope de 4s: ya se puede entrar
let drawn = false;     // el relleno (una sola vez) termino
const DRAW_MS = 2050;  // trazo + relleno de las 8 letras (~69% de los 2.9s)
const RM_CURTAIN = matchMedia("(prefers-reduced-motion: reduce)").matches;

function leaveCurtain(){                    // transicion final a la ui
  requestAnimationFrame(()=> $("#curtain").classList.add("gone"));
}
function drawDone(){
  if(drawn) return;
  drawn = true;
  if(booted) leaveCurtain();                // ya listos: fuera directo
  else if(!RM_CURTAIN) $("#curtain").classList.add("lit");  // si no, respira
}
function boot(){
  if(booted) return;
  booted = true;
  if(drawn) leaveCurtain();                 // dibujo hecho (respirando) -> fuera
  // si aun dibuja, drawDone() saldra al terminar
}
setTimeout(drawDone, RM_CURTAIN ? 0 : DRAW_MS);
setTimeout(boot, 4000);

/* Telon de reinicio: al llegar la nota "restarting", tras 2 s baja el mismo
   telon del splash (el titulo respirando) con un subtitulo, y se retira con
   fundido cuando el puente vuelve (snapshot). Si el socket cae antes de los
   2 s, se muestra ya. Un tope lo retira si el puente no volviera. */
let restartMode = false, restartT = null, restartSafety = null;
function showRestartCurtain(){
  const c = $("#curtain");
  let sub = $("#curtsub");
  if(!sub){ sub = document.createElement("div"); sub.id = "curtsub";
            sub.className = "curtsub"; c.appendChild(sub); }
  sub.textContent = (NOTES[lang()] || NOTES.en).restarting || "";
  c.classList.remove("gone");
  c.classList.add("lit", "restarting");
}
function endRestartCurtain(){
  clearTimeout(restartT); clearTimeout(restartSafety);
  restartMode = false;
  $("#curtain").classList.add("gone");
  $("#curtain").classList.remove("restarting");
}
function beginRestartOverlay(){
  if(restartMode) return;
  restartMode = true;
  restartT = setTimeout(showRestartCurtain, 2000);       // igual que el puente
  restartSafety = setTimeout(endRestartCurtain, 42000);   // por si no vuelve
}

if("serviceWorker" in navigator
   && (location.protocol === "https:" || location.hostname === "localhost"

/* ---------- socket ---------- */
let backoff = 500;
function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => { backoff = 500; };
  ws.onclose = () => {
    state.alive = false; paint();
    if(restartMode) showRestartCurtain();   // cayo antes de los 2 s: telon ya
    title(T("reconnecting"));
    setTimeout(connect, backoff); backoff = Math.min(backoff*2, 8000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.type === "snapshot"){
      // no forzamos fuera el skeleton: paint() lo funde cuando llega el nombre
      // (o la espera de gracia lo resuelve), evitando el flash de "sin titulo"
      // al reconectar se conserva donde estabas leyendo
      const stay = main.scrollTop, wasDown = atBottom();
      feed.classList.add("nofx");
      feed.innerHTML = ""; nodes.clear(); pendingUser = null; CWD = m.cwd || "";
      m.items.forEach(render); state = m.state; paint();
      if(!state.running) groupToolRun();
      placeActions();
      const goEnd = firstSnap || wasDown;
      firstSnap = false;
      requestAnimationFrame(()=>{
        jumpTo(goEnd ? main.scrollHeight : stay);
        feed.classList.remove("nofx");
        goDown();
        spinner(false);              // ya hay contenido que ensenar
        boot();                      // y con el la cabecera ya tiene alto
        if(restartMode) endRestartCurtain();   // el puente volvio: retira el telon
      });
    }
    else if(m.type === "item"){
      render(m.item);
      if(m.item.kind === "user"){
        stopSending();
        // sin ack aun: la burbuja entra tenue+cursiva hasta que pi produce
        pendingUser = nodes.get(m.item.id) || null;
        if(pendingUser) pendingUser.classList.add("you-pending");
        // siempre al fondo absoluto, tras el layout (haya o no sugerencias)
        requestAnimationFrame(()=> jumpTo(main.scrollHeight));
      }
      if(m.item.kind === "tool") noteProduced();   // una tool ya es salida
      if(m.item.key === "compacted") coldTurn();    // tras compactar, reingesta
      if(m.item.key === "restarting") beginRestartOverlay();  // baja el telon
      placeActions();
    }
    else if(m.type === "patch"){
      const it = m.fields, el = nodes.get(m.id);
      if(!el) return;
      const cur = Object.assign(el.__item || {}, it);
      el.__item = cur;
      if(cur.key === "compacted") coldTurn();   // fin de compactacion: reingesta
      if(cur.kind === "note"){          // funde el texto, no lo cambia de golpe
        el.classList.add("fade");
        setTimeout(()=>{ el.innerHTML = html(cur);
                         requestAnimationFrame(()=>el.classList.remove("fade")); },
                   200);
      } else {
        el.innerHTML = html(cur);
        if(cur.kind === "ask") wireAsk(el, cur);
      }
      placeActions();
    }
    else if(m.type === "delta"){
      const el = nodes.get(m.id); if(!el) return;
      noteProduced();                    // primer token: fin del prefill
      const was = atBottom();
      el.__item = el.__item || {kind:"assistant", text:"", streaming:true, id:m.id};
      el.__item.text += m.delta;
      if(el.__item.kind !== "thinking"){   // pensar no cuenta como teclear
        lastDelta = Date.now();
        $("#readout").classList.remove("thinking");
      }
      if(motion === "fade" && !REDUCED
         && el.__item.kind === "assistant" && el.__item.streaming){
        scheduleReveal(el);              // se revela de izquierda a derecha
      } else {
        const body = el.querySelector("[data-body]");
        if(body) body.innerHTML = md(visibleText(el.__item.text, el.__item.streaming)) + tail(el.__item);
        else el.innerHTML = html(el.__item);
      }
      keepDown(was);
    }
    else if(m.type === "state"){
      const wasRunning = state.running;
      // si el nombre cambio (/name), la caché del arbol se queda vieja:
      // fuera antes de pintar para que el proyecto abierto se re-fetch
      if(state.sessionName !== m.state.sessionName && state.cwd)
        delete sessCache[state.cwd];
      state = m.state;
      if(!wasRunning && state.running){    // arranca turno: se espera prefill
        produced = false; turnStart = Date.now();
      }
      paint();
      if(wasRunning && !state.running){     // fin de turno
        groupToolRun();
        maybeNotify();
      }
      placeActions();     // coloca (o quita) acciones y sugerencias del turno
    }
    else if(m.type === "cleared"){
      feed.innerHTML=""; nodes.clear();
      barShown = false;
      coldNext = true; produced = false;   // sesion nueva: caché fria -> prefill
      if(state.cwd) delete sessCache[state.cwd];   // pudo nacer una sesion
      state.sessionName = null;        // el nombre viejo es basura: en blanco
      sessLoading = true;              // hasta que llegue el nuevo, sin flash
      clearTimeout(titleGrace);        // gracia: si no llega nombre, resuelve
      titleGrace = setTimeout(()=>{ if(sessLoading) resolveTitle(); }, 4000);
      spinner(true);
      paint();
    }
    else if(m.type === "drop"){        // envio deshecho: fuera la burbuja
      const el = nodes.get(m.id);
      if(el){ el.remove(); nodes.delete(m.id); }
      if(m.restore && !box.value.trim()){    // devuelve el texto al compositor
        box.value = m.text || "";
        box.dispatchEvent(new Event("input"));
        box.focus();
        try { const s = window.getSelection(), r = document.createRange();
              r.selectNodeContents(box); r.collapse(false);
              s.removeAllRanges(); s.addRange(r); }
        catch(e){}
      }
      stopSending();
      placeActions();
    }
    else if(m.type === "rpc") onRpc(m);
  };
}

  render({id: localId--, kind:"note", level:"info", text});

/* ---------- composer ---------- */
const box = $("#box"), palette = $("#palette"), plist = $("#plist");
let sel = 0, shown = [];

/* sugerencias de respuesta: el modelo propone al final hasta 3 mensajes
   probables (marcadores <hint:> ocultos que el usuario no ve, ver visibleText/
   parseHints y SUGGEST_HINT en el puente); se pintan como filas bajo la
   respuesta (placeSuggests), clic = enviar. El toggle vive en Functions. */
let suggest = (() => {
  try { return localStorage.getItem("pi.suggest") === "1"; }
  catch(e){ return false; }
})();
let notify = (() => {
  try { return localStorage.getItem("pi.notify") === "1"; }
  catch(e){ return false; }
})();
/* Resumen al parar: si esta activo, el boton de stop con el agente pensando
   manda {abort, summary:true}; el puente redirige el turno (steer) para que
   diga en una linea que hacia. Suma contexto: se avisa al activar. */
let stopsum = (() => {
  try { return localStorage.getItem("pi.stopsum") === "1"; }
  catch(e){ return false; }
})();
function setStopsum(on){
  stopsum = !!on;
  try { localStorage.setItem("pi.stopsum", on ? "1" : "0"); } catch(e){}
}
function setNotify(on){
  notify = !!on;
  try { localStorage.setItem("pi.notify", on ? "1" : "0"); } catch(e){}
}
/* Al activar, revisa el tipo de conexion: la API de notificaciones solo existe
   en contexto seguro (HTTPS, p.ej. `tailscale serve`). Segun el caso avisa por
   un dialog; si se puede, pide permiso al navegador. cb(true) si quedan on. */
function requestNotify(cb){
  if(!("Notification" in window) || !window.isSecureContext){
    modal(T("notify"), "<p>" + esc(window.isSecureContext
      ? T("notifUnsupported") : T("notifNeedHttps")) + "</p>");
    return cb(false);
  }
  if(Notification.permission === "granted"){ setNotify(true); return cb(true); }
  if(Notification.permission === "denied"){
    modal(T("notify"), "<p>" + esc(T("notifBlocked")) + "</p>");
    return cb(false);
  }
  Notification.requestPermission().then(p => {
    const ok = p === "granted";
    setNotify(ok);
    if(ok) note(T("notifOn"));
    else if(p === "denied") modal(T("notify"), "<p>" + esc(T("notifBlocked")) + "</p>");
    cb(ok);
  }).catch(() => cb(false));
}
/* Aviso local del navegador al terminar el agente, solo si la pestana no esta
   visible (si la miras, no molesta). Cero terceros: notificacion local, no
   push. */
/* Muestra la notificacion. Android PROHIBE new Notification(): tiene que
   salir del service worker (registration.showNotification), que vale tambien
   en escritorio. new Notification queda de respaldo para cuando no hay SW
   (sin HTTPS, o el registro fallo). El clic lo atiende el SW (notificationclick)
   o el propio objeto en el respaldo. */
function notifyShow(title, opts){
  const sw = navigator.serviceWorker;
  if(sw && sw.ready && typeof sw.ready.then === "function"){
    sw.ready.then(reg => reg.showNotification(title, opts))
            .catch(() => notifyFallback(title, opts));
  } else {
    notifyFallback(title, opts);
  }
}
function notifyFallback(title, opts){
  try {
    const n = new Notification(title, opts);
    n.onclick = () => { window.focus(); n.close(); };
  } catch(e){}
}
function maybeNotify(){
  if(!notify || !("Notification" in window)) return;
  if(Notification.permission !== "granted") return;
  if(!document.hidden) return;
  // titulo fijo, cuerpo = la ultima respuesta del agente (lo que quepa)
  const t = [...feed.children].reverse()
    .find(el => el.__item && el.__item.kind === "assistant");
  let body = t ? visibleText(t.__item.text || "").trim() : "";
  if(!body) body = T("notifDone");
  if(body.length > 220) body = body.slice(0, 219).trimEnd() + "…";
  notifyShow("pi remote",
             {body: body, tag: "pi-turn", icon: "/icons/icon-192.png"});
}
let phDefault = "";
function applyPh(){ box.dataset.ph = phDefault; }
function setSuggest(on){
  suggest = !!on;
  try { localStorage.setItem("pi.suggest", on ? "1" : "0"); } catch(e){}
  placeActions();   // pinta o quita las filas de sugerencias segun el toggle
}

/* El compositor es un contenteditable: admite chips de "texto pegado" en
   linea. Se expone .value para que el resto del codigo (y los tests) lo lea
   y escriba como si fuese un textarea. El getter serializa a texto plano,
   expandiendo cada chip a su contenido completo; el setter mete texto llano. */
const ZW = "​";                     // marca invisible tras un chip
function readBox(){
  let s = "";
  (function walk(node){
    for(const n of node.childNodes){
      if(n.nodeType === 3) s += n.nodeValue;
      else if(n.nodeName === "BR") s += "\n";
      else if(n.nodeType === 1 && n.classList.contains("chip"))
        s += n.dataset.full || "";
      else if(n.nodeType === 1){
        if(/^(DIV|P)$/.test(n.nodeName) && s && !s.endsWith("\n")) s += "\n";
        walk(n);
      }
    }
  })(box);
  // fuera los huecos invisibles: ZW y el BOM del envoltorio de chip
  return s.split(ZW).join("").split("\uFEFF").join("");
}
Object.defineProperty(box, "value", {
  get(){ return readBox(); },
  set(v){ box.innerHTML = "";
          if(v) box.appendChild(document.createTextNode(v));
          slashToggle(); },
});
function slashToggle(){
  // el navegador deja un <br> fantasma al vaciar: fuera, o nunca esta vacio
  if(box.childNodes.length === 1 && box.firstChild.nodeName === "BR")
    box.innerHTML = "";
  const empty = readBox().length === 0 && !box.querySelector(".chip");
  box.classList.toggle("ce-blank", empty);
  $("#field").classList.toggle("typing", !empty);
}
box.addEventListener("input", ()=>{ paintPalette(); slashToggle(); applyPh(); });
// con el prompt mas largo que el campo, el arrastre vertical scrollea el
// interior en vez de mover el cursor; sin desborde, ni eso ni el chat
// linea de scrol fina: se dibuja donde termina la linea de texto mas
// ancha, no en el borde lejano del campo. El navegador no deja mover la
// barra nativa: se oculta y esta la sustituye (solo indica, no arrastra)
const sInd = $("#scrollInd");
function paintScrollInd(){
  const over = box.scrollHeight - box.clientHeight;
  if(over < 2){ sInd.style.opacity = "0"; return; }
  const fr = $("#field").getBoundingClientRect();
  const r = document.createRange(); r.selectNodeContents(box);
  let x = 0;
  for(const rc of r.getClientRects()) x = Math.max(x, rc.right);
  sInd.style.left = (x - fr.left + 6) + "px";
  const pad = 8, track = box.clientHeight - pad*2;
  const th = Math.max(20, track * box.clientHeight / box.scrollHeight);
  sInd.style.top = (box.offsetTop + pad + box.scrollTop/over*(track-th)) + "px";
  sInd.style.height = th + "px";
  sInd.style.opacity = "1";
}
box.addEventListener("scroll", paintScrollInd, {passive:true});
new ResizeObserver(()=>{
  box.style.touchAction = box.scrollHeight > box.clientHeight + 1 ? "pan-y" : "none";
  paintScrollInd();
}).observe(box);

/* Pegar: una imagen va a la fila de miniaturas (reusa Fase 1); un bloque
   grande de texto se mete como chip "Texto pegado N lineas" en el punto del
   cursor; lo corto va llano. Siempre texto plano, sin formato heredado. */
const PASTE_LINES = 4, PASTE_CHARS = 240;
function caretRange(){
  const s = window.getSelection();
  if(s && s.rangeCount && box.contains(s.anchorNode)) return s.getRangeAt(0);
  const r = document.createRange();          // sin cursor: al final
  r.selectNodeContents(box); r.collapse(false);
  return r;
}
function placeCaret(r){
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function insertText(t){
  const r = caretRange(); clearSel(r);
  const node = document.createTextNode(t);
  r.insertNode(node); r.setStartAfter(node); r.collapse(true); placeCaret(r);
}
function makeChip(full, lines){
  // El chip es editable, no atomo: en Chrome Android el cursor que cruza
  // un nodo contenteditable=false cierra el teclado (bug de Chromium,
  // ProseMirror#565). Se prubo a envolverlo en un span editable: el
  // arrastre del cursor lo sigue cerrando. La etiqueta es cosmetica; el
  // contenido real vive en dataset.full y las guardas de beforeinput la
  // protegen. Seleccionar a traves del chip incluye la etiqueta, pero
  // copiar y enviar expanden al contenido completo.
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.dataset.full = full;
  chip.textContent = T("pasted").replace("{n}", lines);
  return chip;
}
const isBulk = text => text != null && text !== ""
  && (text.length >= PASTE_CHARS || text.split("\n").length >= PASTE_LINES);
function insertChip(full, lines){
  const frag = document.createDocumentFragment();
  frag.appendChild(makeChip(full, lines));
  const tail = document.createTextNode(ZW);   // hueco para el cursor tras el chip
  frag.appendChild(tail);
  const r = caretRange(); clearSel(r); r.insertNode(frag);
  r.setStartAfter(tail); r.collapse(true); placeCaret(r);
}
/* El chip es texto editable para el navegador, pero se comporta como unidad:
   teclear dentro de la etiqueta sale al final del chip, y borrar come el chip
   entero, no sus letras. readBox() lee dataset.full, asi que la etiqueta puede
   maltratarse sin tocar el contenido. La guarda va en beforeinput, no en
   keydown: el IME movil no manda keydown por letra, commitea por beforeinput,
   y ese evento cubre escritorio y movil a la vez. */
function chipsInRange(r){
  const out = [];
  for(const c of box.querySelectorAll(".chip"))
    if(r.intersectsNode(c)) out.push(c);
  return out;
}
const wrapperOf = c => c.closest(".chipwrap") || c;   // fuera el envoltorio entero
function clearSel(r){
  chipsInRange(r).forEach(c => wrapperOf(c).remove());   // seleccion que toca un chip: fuera
  r.deleteContents();
}
function chipNeighbor(r, after){
  // chip pegado al cursor, con solo huecos ZW de por medio. Vale con el cursor
  // en un nodo de texto o con el contenedor en el propio #box (es donde queda
  // justo tras pegar): por eso el lado se mira con comparePoint, no con
  // compareDocumentPosition del contenedor
  if(!r.collapsed) return null;
  for(const c of box.querySelectorAll(".chip")){
    let side;
    try { side = r.comparePoint(c, 0); } catch(_){ continue; }
    if(after ? side <= 0 : side >= 0) continue;   // chip del lado que toca
    const gap = document.createRange();
    if(after){ gap.setStart(r.startContainer, r.startOffset); gap.setEndBefore(c); }
    else     { gap.setStartAfter(c); gap.setEnd(r.startContainer, r.startOffset); }
    // el hueco cuenta con ZW y BOM: son los respiraderos del envoltorio
    if(gap.toString().split(ZW).join("").split("\uFEFF").join("") === "") return c;
  }
  return null;
}
box.addEventListener("beforeinput", e => {
  const s = window.getSelection();
  if(!s || !s.rangeCount || !box.contains(s.anchorNode)) return;
  const r = s.getRangeAt(0);
  let chips = chipsInRange(r);
  if(!chips.length && r.collapsed){
    if(e.inputType === "deleteContentBackward"){
      const c = chipNeighbor(r, false); if(c) chips = [c];
    } else if(e.inputType === "deleteContentForward"){
      const c = chipNeighbor(r, true); if(c) chips = [c];
    }
  }
  if(!chips.length) return;
  if(e.inputType === "deleteContentBackward"
     || e.inputType === "deleteContentForward"){
    e.preventDefault();
    const at = document.createRange();
    at.setStartBefore(chips[0]); at.collapse(true);
    chips.forEach(c => {
      let g = wrapperOf(c).nextSibling;   // el hueco ZW que lo seguia
      while(g && g.nodeType === 3 && g.nodeValue.split(ZW).join("") === ""){
        const nx = g.nextSibling; g.remove(); g = nx;
      }
      wrapperOf(c).remove();
    });
    try { r.deleteContents(); } catch(_){}   // el resto de la seleccion, si lo hay
    s.removeAllRanges(); s.addRange(at);
    slashToggle();
  } else if(!r.collapsed){
    chips.forEach(c => wrapperOf(c).remove());   // lo escrito reemplaza a la seleccion
  } else {
    // teclear (o Enter) dentro de la etiqueta: fuera. El navegador inserta
    // en la posicion original del evento, no donde muevas la seleccion,
    // asi que se come el input y se inserta a mano tras el chip
    e.preventDefault();
    const nr = document.createRange();
    nr.setStartAfter(chips[chips.length - 1]); nr.collapse(true);
    s.removeAllRanges(); s.addRange(nr);
    if(e.inputType === "insertText" || e.inputType === "insertCompositionText")
      insertText(e.data || "");
    else if(e.inputType === "insertParagraph" || e.inputType === "insertLineBreak"){
      const d = document.createElement("div");
      nr.insertNode(d); nr.setStartAfter(d); nr.collapse(true); placeCaret(nr);
    }
    paintPalette(); slashToggle();
  }
});
// copiar con la seleccion tocando un chip: viaja el contenido completo,
// no la etiqueta cosmetica. La seleccion lo incluye (es texto editable),
// pero reescribirla a mitad del arrastre hace que Chrome la cancele
box.addEventListener("copy", e => {
  const s = window.getSelection();
  if(!s || !s.rangeCount || !box.contains(s.anchorNode)) return;
  if(!chipsInRange(s.getRangeAt(0)).length) return;
  e.preventDefault();
  const frag = s.getRangeAt(0).cloneContents();
  for(const c of frag.querySelectorAll(".chip")){
    const w = c.closest(".chipwrap") || c;
    w.replaceWith(document.createTextNode(c.dataset.full || ""));
  }
  const div = document.createElement("div");
  div.appendChild(frag);
  let t = "";
  (function walk(n){
    for(const k of n.childNodes){
      if(k.nodeType === 3) t += k.nodeValue;
      else if(k.nodeName === "BR") t += "\n";
      else if(/^(DIV|P)$/.test(k.nodeName) && t && !t.endsWith("\n")) t += "\n";
      else if(k.nodeType === 1) walk(k);
    }
  })(div);
  navigator.clipboard.writeText(t.split(ZW).join("").split("\uFEFF").join("")).catch(()=>{});
});
let pasteLock = false;                        // dedupe: 'paste' y 'beforeinput'
function pasteText(text){                     // devuelve true si lo trato
  if(text == null || text === "") return false;
  if(pasteLock) return true;                  // el mismo pegado, dos eventos
  pasteLock = true;                           // se libera al vaciar la microcola
  Promise.resolve().then(() => { pasteLock = false; });
  if(isBulk(text)) insertChip(text, text.split("\n").length);
  else insertText(text);
  paintPalette(); slashToggle();
  return true;
}
box.addEventListener("paste", e => {         // long-press -> pegar, y escritorio
  const dt = e.clipboardData; if(!dt) return;
  const files = [...(dt.items || [])]
    .filter(it => it.kind === "file" && /^image\//.test(it.type))
    .map(it => it.getAsFile()).filter(Boolean);
  if(files.length){                           // imagen pegada -> miniatura
    e.preventDefault();
    files.forEach(f => { const rd = new FileReader();
      rd.onload = () => { const u = String(rd.result), c = u.indexOf(",");
        addImage({data: u.slice(c + 1), mimeType: f.type || "image/png", url: u}); };
      rd.readAsDataURL(f); });
    return;
  }
  if(pasteText(dt.getData("text/plain"))) e.preventDefault();
});
// GBoard y otros teclados pegan por beforeinput, no por 'paste'. En el movil
// el portapapeles no se puede leer desde beforeinput, asi que si no hay texto
// en el evento, marcamos el punto, dejamos insertar, y recogemos el bloque del
// DOM en el 'input' que sigue. mark = marca invisible, sin hueco de texto.
const PASTE_LIKE = new Set(["insertFromPaste", "insertFromDrop"]);
let pMark = null;
function dropMark(){ if(pMark && pMark.parentNode) pMark.remove(); pMark = null; }
box.addEventListener("beforeinput", e => {
  const dt = e.dataTransfer;
  const text = dt ? dt.getData("text/plain") : (e.data || "");
  // algunos teclados pegan como insertText con datos en bloque: nadie
  // teclea 240 chars en un evento, asi que un insertText gordo es pegado
  const like = PASTE_LIKE.has(e.inputType)
    || (e.inputType === "insertText" && isBulk(text));
  if(!like) return;
  if(pasteLock){ e.preventDefault(); return; }   // ya lo trato el evento 'paste'
  if(text){ if(pasteText(text)) e.preventDefault(); return; }   // via directa
  // sin texto legible: marcar y recoger del DOM tras insertar
  try {
    dropMark();
    pMark = document.createElement("span");
    pMark.dataset.pmark = "1"; pMark.style.cssText = "font-size:0;line-height:0";
    const r = caretRange(); r.deleteContents(); r.insertNode(pMark);
    r.setStartAfter(pMark); r.collapse(true); placeCaret(r);
  } catch(err){ pMark = null; }
});
box.addEventListener("input", () => {          // recoge el pegado marcado
  if(!pMark) return;
  const mark = pMark; pMark = null;
  if(!box.contains(mark)) return;
  const s = window.getSelection();
  const r = document.createRange(); r.setStartAfter(mark);
  if(s.rangeCount && box.contains(s.focusNode)) r.setEnd(s.focusNode, s.focusOffset);
  else r.setEndAfter(mark);
  const text = r.toString();
  if(isBulk(text)){
    r.deleteContents();
    const tail = document.createTextNode(ZW);
    mark.replaceWith(makeChip(text, text.split("\n").length), tail);
    const cr = document.createRange();
    cr.setStartAfter(tail); cr.collapse(true); placeCaret(cr);
  } else {
    mark.remove();                             // pegado corto: se queda llano
  }
  paintPalette(); slashToggle();
});
/* Gboard y el paste del sistema en Android no pasan la imagen por el
   portapapeles legible: insertan un <img> crudo dentro de la caja. Ninguna
   otra via mete imagenes aqui, asi que cualquier <img> es un pegado: se
   convierte en adjunto y se quita el nodo. data: directo; blob: a base64 */
function adoptPastedImg(img){
  const src = img.currentSrc || img.src || "";
  const kill = () => { if(img.parentNode) img.remove(); };
  if(src.startsWith("data:")){
    const c = src.indexOf(",");
    addImage({data: src.slice(c + 1), mimeType: src.slice(5, c), url: src});
    kill();
  } else if(src.startsWith("blob:")){
    fetch(src).then(r => r.arrayBuffer())
      .then(b => {
        let s = ""; const u = new Uint8Array(b);
        for(let i = 0; i < u.length; i += 0x8000)
          s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
        addImage({data: btoa(s), mimeType: "image/png", url: src});
        kill();
      }).catch(kill);
  } else kill();
}
box.addEventListener("input", () => {
  box.querySelectorAll("img").forEach(adoptPastedImg);
});
// tocar un chip no debe soltar el foco (cerraria el teclado): mantengo el
// foco y dejo el cursor justo tras el chip
box.addEventListener("pointerdown", e => {
  const chip = e.target.closest && e.target.closest(".chip");
  if(!chip) return;
  e.preventDefault();
  box.focus();
  const r = document.createRange(); r.setStartAfter(chip); r.collapse(true);
  placeCaret(r);
});
// arrastrar el cursor por encima de un chip (contenteditable=false) borra el
// foco y cierra el teclado. El toque en la manija del cursor no genera
// pointerdown en el DOM: es UI del navegador. Se rastrea el ultimo
// pointerdown real; si fue dentro de la caja, el blur es del arrastre y el
// foco vuelve al sitio. Sincrono, para ganarle al cierre del teclado.
let lastDownInBox = false;
document.addEventListener("pointerdown", e => {
  lastDownInBox = !!(e.target.closest && e.target.closest("#box"));
}, true);
box.addEventListener("focusout", e => {
  if(e.relatedTarget || !lastDownInBox) return;   // salto real: no robar foco
  box.focus();
  const s = window.getSelection();
  if(!(s.rangeCount && box.contains(s.anchorNode))) {
    const r = document.createRange();
    r.selectNodeContents(box); r.collapse(false);
    placeCaret(r);
  }
});

// el '+' abre un popup con Commands e Image; el '/' teclado sigue valiendo
$("#slashBtn").innerHTML = ico("add");
const plusMenu = $("#plusMenu"), imgInput = $("#imgInput"), thumbs = $("#thumbs");
plusMenu.querySelectorAll(".pmi-ic").forEach(s => s.innerHTML = ico(s.dataset.ic));
function plusOpen(on){
  $("#slashBtn").classList.toggle("on", on);   // borde ambar solo con menu abierto
  if(on){ plusMenu.hidden = false;
          requestAnimationFrame(()=> plusMenu.classList.add("open")); }
  else { plusMenu.classList.remove("open");
         setTimeout(()=>{ if(!plusMenu.classList.contains("open"))
                            plusMenu.hidden = true; }, 200); }
}
// el '+' no es para escribir: soltar el foco cierra el teclado en el movil.
// con el foco puesto (cursor parpadeando) pulsar '+' lo reabria. El blur en
// el tap enfoca al boton DESPUES del onclick: un blur inmediato no llega,

$("#slashBtn").onclick = () => {

/* --- imagenes adjuntas: la fila anima al entrar y al salir --- */
let pendingImages = [];              // {data, mimeType, url}
imgInput.onchange = () => {
  [...imgInput.files].forEach(f => {
    if(!/^image\//.test(f.type)) return;
    const r = new FileReader();
    r.onload = () => {
      const url = String(r.result), c = url.indexOf(",");
      addImage({data: url.slice(c + 1), mimeType: f.type || "image/png", url});
    };
    r.readAsDataURL(f);
  });
  imgInput.value = "";
};
function addImage(im){
  pendingImages.push(im);
  const el = document.createElement("div");
  el.className = "thumb"; el.__img = im;
  el.innerHTML = `<img src="${im.url}" alt="">`
    + `<button class="thx" aria-label="${esc(T("remove"))}">${ico("close")}</button>`;
  thumbs.hidden = false;
  $("#field").classList.add("hasimg");
  thumbs.appendChild(el);
  requestAnimationFrame(()=> el.classList.add("in"));   // anima la entrada
}
function removeImage(el){
  if(el.classList.contains("out")) return;              // ya saliendo
  pendingImages = pendingImages.filter(x => x !== el.__img);
  const last = pendingImages.length === 0;
  el.classList.remove("in"); el.classList.add("out");   // anima la salida
  setTimeout(()=>{
    el.remove();
    if(last){ thumbs.hidden = true;                      // vuelve a lo normal
              $("#field").classList.remove("hasimg"); }
  }, 200);
}
thumbs.onclick = e => {
  const b = e.target.closest(".thx");
  if(b) removeImage(b.closest(".thumb"));
};
function clearThumbs(){                 // al enviar: la burbuja releva a la fila
  pendingImages = [];
  thumbs.innerHTML = ""; thumbs.hidden = true;
  $("#field").classList.remove("hasimg");
}
// el blur solo cierra la paleta si esta abierta (no al soltar el foco por '+')
box.addEventListener("blur", ()=>{
  if(palette.classList.contains("open")) setTimeout(()=>closePalette(), 150);
});

function query(){
  const v = box.value;
  if(!v.startsWith("/") || v.includes("\n")) return null;
  const m = v.slice(1).match(/^(\S*)(\s?)/);
  return m[2] ? null : m[1];       // once you type a space, it is an argument
}
function paintPalette(){
  const q = query();
  if(q === null) return closePalette();
  shown = CMDS.filter(c => c.n.startsWith(q.toLowerCase()));
  if(!shown.length){
    plist.innerHTML = `<div class="none">no command matches /${esc(q)}</div>`;
    palette.classList.add("open"); return;
  }
  if(sel >= shown.length) sel = 0;
  plist.innerHTML = shown.map((c,i)=>
    `<button class="cmd${i===sel?" sel":""}${locked(c)?" off":""}" data-i="${i}"${locked(c)?" disabled":""}>
       <b>/${c.n}${c.arg?" &lt;"+esc(argOf(c))+"&gt;":""}</b>`
    + `<span>${esc(locked(c) ? T("readOnlyCmd") : hintOf(c))}</span></button>`
  ).join("");
  plist.querySelectorAll(".cmd").forEach(b=>{
    b.onmousedown = e => e.preventDefault();      // keep focus in the textarea
    b.onclick = () => { const c = shown[+b.dataset.i];
                        if(!locked(c)) choose(c); };
  });
  $("#phead").textContent = q ? `${T("commands")} ${T("matching")} /${q}`
                              : T("commands");
  palette.classList.add("open");
}
function closePalette(){
  palette.classList.remove("open"); sel = 0;
  if(box.value === "/"){        // barra suelta de un panel que no se uso
    box.value = "";                        // el setter refresca el estado
  }
}
main.addEventListener("pointerdown", ()=>{
  if(palette.classList.contains("open")) closePalette();
});
function choose(c){
  if(c.arg){                                   // needs text: prefill and wait
    box.value = "/" + c.n + " ";
    box.focus(); closePalette(); slashToggle(); return;
  }
  box.value = "";
  closePalette(); slashToggle(); c.run();
}
function runLine(text){
  const m = text.match(/^\/(\S+)\s*([\s\S]*)$/);
  const c = CMDS.find(x => x.n === m[1].toLowerCase());
  if(!c) return note(`no command called /${m[1]}. type / to see the list`);
  if(c.arg && !m[2].trim()) return note(`/${c.n} <${argOf(c)}>`);
  c.run(m[2].trim());
}

box.addEventListener("keydown", e=>{
  if(palette.classList.contains("open") && shown.length){
    if(e.key === "ArrowDown"){ e.preventDefault(); sel=(sel+1)%shown.length; paintPalette(); return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); sel=(sel-1+shown.length)%shown.length; paintPalette(); return; }
    if(e.key === "Tab"){ e.preventDefault(); choose(shown[sel]); return; }
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); choose(shown[sel]); return; }
    if(e.key === "Escape"){ closePalette(); return; }
  }
  const coarse = matchMedia("(pointer:coarse)").matches;
  if(e.key === "Enter" && !e.shiftKey && !coarse){ e.preventDefault(); submit(); return; }
  if(e.key === "Enter"){          // shift+enter, o enter en el movil: salto limpio
    e.preventDefault(); document.execCommand("insertLineBreak");
    paintPalette(); slashToggle();
  }
});
$("#send").onclick = () => {
  if($("#send").classList.contains("halting")){
    // resumen al parar: si esta activo y el agente trabaja, pide el resumen;
    // el puente aborta e informa con state.summarizing, y el boton queda en aro
    // hasta que llega. Si no, abort normal (que puede deshacer el envio)
    if(stopsum && state.running)
      return send({type:"abort", summary:true});
    return send({type:"abort", undo:true});   // el puente decide si deshace
  }
  submit();
};
function submit(){
  const text = box.value.trim();
  const imgs = pendingImages.map(im => ({type:"image", data:im.data,
                                         mimeType:im.mimeType}));
  if(!text && !imgs.length) return;
  box.value = ""; closePalette(); slashToggle();
  feed.querySelectorAll(".suggests").forEach(el => el.remove());
  clearThumbs();
  if(text.startsWith("/") && !imgs.length) return runLine(text);
  const cmd = {type:"prompt", message:text};
  if(imgs.length) cmd.images = imgs;
  if(suggest) cmd.suggest = true;      // el puente inyecta la instruccion oculta
  send(cmd);
  $("#send").classList.add("sending");
  clearTimeout(sendTimer);
  sendTimer = setTimeout(() => $("#send").classList.remove("sending"), 8000);
}
var sendTimer = null;
function stopSending(){ clearTimeout(sendTimer);
  $("#send").classList.remove("sending"); }

function lang(){
  try { const v = localStorage.getItem("pi.lang");
        if(LANGS.includes(v)) return v; } catch(e){}
  const n = (navigator.language || "en").toLowerCase();
  for(const l of LANGS) if(l !== "en" && n.startsWith(l)) return l;
  return "en";
}
const T = k => (STR[lang()] || STR.en)[k] || STR.en[k] || k;
const argOf = c => (lang() === "es" && c.argEs) ? c.argEs : c.arg;
/* En solo lectura el puente rechaza todo lo que actua. Pintarlo apagado
   es honestidad, no seguridad: la barrera esta en el servidor. */
const READ_CMDS = ["stats", "state", "help", "cwd", "sessdir", "pig"];
const locked = c => state.readOnly === true && !READ_CMDS.includes(c.n);
const hintOf = c => (lang() === "es" && c.hEs) ? c.hEs : c.h;
function setLang(v){
  try { localStorage.setItem("pi.lang", v); } catch(e){}
  applyLang();
}
function applyLang(){
  document.documentElement.lang = lang();
  document.querySelectorAll("[data-t]").forEach(el=>{
    el.textContent = T(el.dataset.t);
  });
  document.querySelectorAll("[data-t-ph]").forEach(el=>{
    el.placeholder = T(el.dataset.tPh);
  });
  $("#modalOk").textContent = T("ok");
  const wspan = $("#warnbar").querySelector("span");
  if(wspan) wspan.textContent = T("noToken");   // sin vaciarlo: no se remonta
  nodes.forEach((el, id)=>{                      // notes carry a key, redraw
    if(el.__item && (el.__item.kind === "note" || el.__item.kind === "ask"))
      el.innerHTML = html(el.__item);
  });
  for(const [id, k] of [["#menuBtn","menu"], ["#railBtn","project"],
                        ["#send","send"]]){
    $(id).title = $(id).ariaLabel = T(k);
  }
  curWord = "";
  paint();
}

function noteText(it){
  const tpl = it.key && (NOTES[lang()] || NOTES.en)[it.key];
  if(!tpl) return it.text || "";
  const a = it.args || {};
  return tpl.replace(/\{(\w+)\}/g, (_, k) => a[k] != null ? a[k] : "");
}

/* ---------- theme ---------- */
/* Un tema es una familia (par claro/oscuro) mas un modo transversal
   (auto|light|dark) que elige la variante. */
const FAMILIES = [
  {id:"pi",     name:"pi remote", light:"light",        dark:"dark"},
  {id:"klaude", name:"Klaude",    light:"klaude-light", dark:"klaude"},
  {id:"jipiti", name:"Jipiti",    light:"jipiti-light", dark:"jipiti-dark"},
  {id:"gemma",  name:"Gemma",     light:"gemma-light",  dark:"gemma-dark"},
];
const FAM = id => FAMILIES.find(f => f.id === id) || FAMILIES[0];
const SIZES = [13, 14, 15, 16, 17, 18, 19, 20];
const SYS = matchMedia("(prefers-color-scheme: light)");

/* migra el viejo pi.theme (un solo string) a familia+modo, una vez */
(function migrateTheme(){
  try{
    if(localStorage.getItem("pi.themeFamily")) return;
    const old = localStorage.getItem("pi.theme");
    if(old == null) return;
    let fam = "pi", mode = "light";
    if(old === "auto"){ mode = "auto"; }
    else {
      const f = FAMILIES.find(f => f.light === old || f.dark === old);
      if(f){ fam = f.id; mode = f.dark === old ? "dark" : "light"; }
    }
    localStorage.setItem("pi.themeFamily", fam);
    localStorage.setItem("pi.themeMode", mode);
    localStorage.removeItem("pi.theme");
  }catch(e){}
})();
function themeFamily(){
  try { return localStorage.getItem("pi.themeFamily") || "pi"; }
  catch(e){ return "pi"; }
}
function themeMode(){
  try { return localStorage.getItem("pi.themeMode") || "light"; }
  catch(e){ return "light"; }
}
/* modo -> variante concreta; auto sigue al sistema */
function modeLight(mode){
  return mode === "light" || (mode !== "dark" && SYS.matches);
}
function resolveTheme(famId, mode){
  const f = FAM(famId);
  return modeLight(mode) ? f.light : f.dark;
}
function sizeStep(){
  try {
    const v = parseInt(localStorage.getItem("pi.size"), 10);
    if(v >= 0 && v < SIZES.length) return v;
  } catch(e){}
  return 2;                        // 15px, el de siempre
}
function applySize(step){
  document.documentElement.style.setProperty(
    "--chat-size", SIZES[step] + "px");
}
function setSize(step){
  try { localStorage.setItem("pi.size", String(step)); } catch(e){}
  applySize(step);
}
applySize(sizeStep());

/* La barra de estado. En el navegador sigue al tema (borde alto de la
   toolbar) y Android saca el contraste de iconos solo. Pero una PWA
   INSTALADA fija el fondo de la barra al color del manifest (grafito) y no
   lo cambia en caliente; ahi, si mandaramos un color claro, los iconos se
   volverian negros sobre grafito = ilegible. Asi que instalada se mantiene
   oscura, para que los iconos sigan blancos y legibles.
   iOS: el estilo se lee al arrancar y no se puede cambiar (ver AGENTS). */
const MANIFEST_BG = "#12151a";
function statusBar(){
  const meta = document.querySelector('meta[name="theme-color"]');
  if(!meta) return;
  const installed = matchMedia("(display-mode: standalone)").matches
    || matchMedia("(display-mode: fullscreen)").matches
    || navigator.standalone === true;
  if(installed){ meta.content = MANIFEST_BG; return; }
  const v = getComputedStyle(document.documentElement)
              .getPropertyValue("--plate-a").trim();
  meta.content = v || MANIFEST_BG;
}

function applyTheme(famId, mode){
  document.documentElement.dataset.theme = resolveTheme(famId, mode);
  statusBar();
}
function setTheme(famId, mode){
  try {
    localStorage.setItem("pi.themeFamily", famId);
    localStorage.setItem("pi.themeMode", mode);
  } catch(e){}
  applyTheme(famId, mode);
}
applyTheme(themeFamily(), themeMode());

/* Motor de revelado del modo fundido: el texto que genera el asistente
   aparece de izquierda a derecha. El texto entero esta siempre en el DOM
   (textContent completo); solo se gradua la opacidad de la cola aun no
   revelada, con una frontera que persigue el final suavizada -> smooth. */
const REDUCED = matchMedia("(prefers-reduced-motion:reduce)").matches;
const REVEAL_FADE = 9;                  // ancho del degradado, en caracteres
const revealing = new Set();
let revealRAF = 0;

/* Separa el bloque final de sugerencias del texto visible. Solo cuentan como
   sugerencias las lineas AL FINAL del mensaje que forman un marcador, cada una
   en su linea; tres formas: canonica <hint: ...>, etiqueta cerrada
   <hint>...</hint> y abierta sin cierre <hint>... (por si el modelo se olvida
   del cierre; durante el streaming se trata como cola en construccion y no
   cuenta hasta que el mensaje termina). Un marcador en medio de la prosa
   (p.ej. el modelo explicando esta misma feature) se queda como texto, no se
   oculta ni se vuelve fila. Durante el streaming, oculta la ultima linea que
   empieza a formar el marcador, para que no parpadee.
   Devuelve {visible, hints}. */
function splitHints(t, streaming){
  if(!t) return {visible: t || "", hints: []};
  const lines = t.split("\n");
  let i = lines.length - 1;
  while(i >= 0 && lines[i].trim() === "") i--;   // ignora lineas vacias del final
  const end = i;                                  // ultima linea con contenido
  const hints = [];
  let saw = false;
  while(i >= 0){
    const s = lines[i].trim();
    // la cerrada antes que la abierta: <hint>x</hint> no capture "x</hint>"
    const done = s.match(/^<hint:\s*([\s\S]*?)>$/)
      || s.match(/^<hint>\s*([\s\S]*?)<\/hint>\s*$/)
      || (!streaming && s.match(/^<hint>([\s\S]*?)>?$/));   // tolera un > de cierre suelto
    if(done){ hints.unshift(done[1].trim()); saw = true; i--; }
    // cola en construccion en su propia linea: "<", "<h", ... "<hint: algo",
    // "<hint>", "<hint>algo"
    else if(i === end && /^<(h(i(n(t((:[\s\S]*)?|>([\s\S]*)?)?)?)?)?)?$/.test(s)){ saw = true; i--; }
    else if(s === "" && saw){ i--; }               // separadora entre hints
    else break;                                    // prosa: fin del bloque
  }
  const visible = lines.slice(0, i + 1).join("\n").replace(/\s+$/, "");
  return {visible, hints: hints.filter(Boolean).slice(0, 3)};
}
function visibleText(t, streaming){ return splitHints(t, streaming).visible; }
function parseHints(t, streaming){ return splitHints(t, streaming).hints; }

function scheduleReveal(el){
  revealing.add(el);
  if(!revealRAF) revealRAF = requestAnimationFrame(revealTick);
}
function revealTick(){
  revealRAF = 0;
  const was = atBottom();
  let more = false;
  revealing.forEach(el => {
    const it = el.__item;
    if(!it || it.kind !== "assistant" || !it.streaming){
      revealing.delete(el); return;
    }
    const vis = visibleText(it.text || "", true);
    const len = vis.length;
    if(it._front == null) it._front = 0;
    if(it._front < len)                 // persigue el final con suavizado
      it._front = Math.min(len, it._front + Math.max(0.8,
        (len - it._front) * 0.22));
    paintSaid(el, vis, it._front);
    if(it._front < len) more = true;
    else revealing.delete(el);
  });
  keepDown(was);
  if(more) revealRAF = requestAnimationFrame(revealTick);
}

/* pinta el .said con el texto completo y funde la cola no revelada */
function paintSaid(el, full, front){
  el.innerHTML = `<div class="said stream" data-body></div>`;
  const body = el.firstChild;
  body.innerHTML = md(full);
  const pending = full.length - front;
  if(pending > 0.01) fadeTail(body, pending);
}

/* grada la opacidad de la cola del ultimo nodo de texto: los caracteres
   pasada la frontera se ocultan y los REVEAL_FADE previos suben de 0 a 1 */
function fadeTail(root, pending){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let last = null, n;
  while(n = w.nextNode()) last = n;
  if(!last) return;
  const t = last.nodeValue, L = t.length;
  const front = L - pending;                       // frontera en este nodo
  const start = Math.max(0, Math.floor(front - REVEAL_FADE));
  if(start >= L) return;
  const frag = document.createDocumentFragment();
  const head = t.slice(0, start);
  if(head) frag.appendChild(document.createTextNode(head));
  for(let i = start; i < L; i++){
    const o = Math.max(0, Math.min(1, (front - i) / REVEAL_FADE));
    const s = document.createElement("span");
    s.className = "rv"; s.style.opacity = o.toFixed(3);
    s.textContent = t[i];
    frag.appendChild(s);
  }
  last.parentNode.replaceChild(frag, last);
}

   en el repo, pero si el usuario la tiene instalada se usa. */

  {id:"sans",  name:"Plus Jakarta Sans",
   css:'"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif'},
  {id:"serif", name:"Source Serif 4",
   css:'"Source Serif 4",Georgia,"Times New Roman",serif'},
  {id:"mono",  name:"IBM Plex Mono",
   css:'"IBM Plex Mono",ui-monospace,Consolas,monospace'},
];
function fontPref(){
  try {
    const v = localStorage.getItem("pi.font");
    if(FONTS.some(f => f.id === v)) return v;
  } catch(e){}
  return "sans";
}
function setFont(id){
  const f = FONTS.find(x => x.id === id) || FONTS[0];
  document.documentElement.style.setProperty("--chat-font", f.css);
  try { localStorage.setItem("pi.font", f.id); } catch(e){}

function fontCard(body){
  const card = document.createElement("div");
  card.className = "sizecard";
  card.innerHTML = `<div class="lbl">${esc(T("font"))}</div>`;
  const row = document.createElement("div");
  row.className = "fonts";
  FONTS.forEach(f => {
    const b = document.createElement("button");
    b.className = "fontb" + (f.id === fontPref() ? " on" : "");
    b.dataset.f = f.id;
    b.style.fontFamily = f.css;
    b.innerHTML = `<b>Aa</b><span>${esc(f.name)}</span>`;
    b.onclick = () => {
      setFont(f.id);
      row.querySelectorAll(".fontb").forEach(x =>
        x.classList.toggle("on", x.dataset.f === f.id));
    };
    row.appendChild(b);

  card.className = "sizecard";

    + `<div class="fsize"><div class="a sm">A</div>`

  const body = $("#sheetBody"), back = $("#sheetBack");
  body.innerHTML = "";
  back.hidden = page === "root";
  if(!back.innerHTML) back.innerHTML = ico("back");
  back.onclick = () => turnTo("root", -1);

  const head = t => {
    const h = document.createElement("div");
    h.className = "shead"; h.textContent = T(t); body.appendChild(h);
  };
  const act = (key, icon, run) => body.appendChild(pickBtn({
    icon: icon, label: T(key), chevron: true, run: run}));

  if(page === "functions"){
    $("#sheetTitle").textContent = T("functions");
    const card = document.createElement("div");
    card.className = "fcard";
    card.innerHTML = `<div class="frow"><div class="ftext">`
      + `<div class="flbl">${esc(T("showThinking"))}</div></div>`

      + ` aria-checked="${showThinking}"><span class="knob"></span></button>`;
    const sw = card.querySelector(".sw");
    sw.onclick = () => {
      const on = sw.getAttribute("aria-checked") !== "true";
      sw.setAttribute("aria-checked", on ? "true" : "false");
      setThinking(on);
    };
    body.appendChild(card);

    const scard = document.createElement("div");
    scard.className = "fcard";
    scard.innerHTML = `<div class="frow"><div class="ftext">`
      + `<div class="flbl">${esc(T("suggest"))}</div></div>`
      + `<button class="sw" role="switch" aria-label="${esc(T("suggest"))}"`
      + ` aria-checked="${suggest}"><span class="knob"></span></button>`;
    const ssw = scard.querySelector(".sw");
    ssw.onclick = () => {
      const on = ssw.getAttribute("aria-checked") !== "true";
      if(on) modal(T("suggest"), "<p>" + esc(T("suggestWarn")) + "</p>");
      ssw.setAttribute("aria-checked", on ? "true" : "false");
      setSuggest(on);
    };
    body.appendChild(scard);

    const qcard = document.createElement("div");
    qcard.className = "fcard";
    qcard.innerHTML = `<div class="frow"><div class="ftext">`
      + `<div class="flbl">${esc(T("stopsum"))}</div></div>`
      + `<button class="sw" role="switch" aria-label="${esc(T("stopsum"))}"`
      + ` aria-checked="${stopsum}"><span class="knob"></span></button>`;
    const qsw = qcard.querySelector(".sw");
    qsw.onclick = () => {
      const on = qsw.getAttribute("aria-checked") !== "true";
      if(on) modal(T("stopsum"), "<p>" + esc(T("stopsumWarn")) + "</p>");
      qsw.setAttribute("aria-checked", on ? "true" : "false");
      setStopsum(on);
    };
    body.appendChild(qcard);

    const ncard = document.createElement("div");
    ncard.className = "fcard";
    const non = notify && ("Notification" in window)
      && window.Notification.permission === "granted";
    ncard.innerHTML = `<div class="frow"><div class="ftext">`
      + `<div class="flbl">${esc(T("notify"))}</div></div>`
      + `<button class="sw" role="switch" aria-label="${esc(T("notify"))}"`
      + ` aria-checked="${non}"><span class="knob"></span></button>`;
    const nsw = ncard.querySelector(".sw");
    nsw.onclick = () => {
      const turningOn = nsw.getAttribute("aria-checked") !== "true";
      if(!turningOn){ setNotify(false);
        nsw.setAttribute("aria-checked", "false"); return; }
      requestNotify(ok => nsw.setAttribute("aria-checked", ok ? "true" : "false"));
    };
    body.appendChild(ncard);

    const mcard = document.createElement("div");
    mcard.className = "fcard";
    mcard.innerHTML = `<div class="frow"><div class="ftext">`
      + `<div class="flbl">${esc(T("movement"))}</div></div>`
      + `<button class="sw" role="switch" aria-label="${esc(T("movement"))}"`
      + ` aria-checked="${motion === "fade"}"><span class="knob"></span></button>`;
    const msw = mcard.querySelector(".sw");
    msw.onclick = () => {                 // on = fundido suave, off = directo
      const on = msw.getAttribute("aria-checked") !== "true";
      msw.setAttribute("aria-checked", on ? "true" : "false");
      setMotion(on ? "fade" : "instant");
    };
    body.appendChild(mcard);
    return;
  }
  if(page === "appearance"){
    $("#sheetTitle").textContent = T("appearance");
    body.appendChild(pickBtn({icon:"palette", label:T("theme"),
                              val:"| " + FAM(themeFamily()).name,
                              chevron:true, run:themeModal}));
    fontCard(body);
    sizeCard(body);
    return;
  }
  if(page === "language"){
    $("#sheetTitle").textContent = T("language");
    LANGS.forEach(l => body.appendChild(pickBtn({
      icon: l === lang() ? "check" : null, label: LANG_NAME[l],
      run: () => { setLang(l); turnTo("root", -1); }})));
    return;
  }

  $("#sheetTitle").textContent = T("menu");
  act("appearance", "palette", () => turnTo("appearance", 1));
  act("language", "lang", () => turnTo("language", 1));
  act("functions", "tool", () => turnTo("functions", 1));
  head("\u00a0");
  body.appendChild(pickBtn({icon:"help", label:T("help"),
    run: () => helpModal()}));
  body.appendChild(pickBtn({icon:"info", label:T("about"),
    run: () => aboutModal()}));
  body.appendChild(pickBtn({icon:"donate", label:T("donate"),
    rightIcon: PAYPAL ? "external" : null,
    run: () => { $("#sheet").classList.remove("open");
      PAYPAL ? open(PAYPAL, "_blank", "noopener")
             : modal(T("donate"), "<p>Coming soon.</p>"); }}));
}

function turnTo(page, dir){
  const body = $("#sheetBody");
  if(STILL.matches){ paintSheet(page); return; }
  body.classList.add(dir > 0 ? "to-left" : "to-right");
  setTimeout(()=>{
    paintSheet(page);
    body.classList.remove("to-left", "to-right");
    body.classList.add(dir > 0 ? "to-right" : "to-left");
    requestAnimationFrame(()=> requestAnimationFrame(()=>
      body.classList.remove("to-left", "to-right")));
  }, 170);
}

/* la hoja con las estadisticas de una respuesta */
const nfmt = v => v == null ? "\u2014" : v.toLocaleString(lang());
function statsRow(label, val, unit){
  return `<div class="strow"><span class="stk">${esc(label)}</span>`
    + `<span class="stv">${esc(val)}`
    + (unit ? ` <em>${esc(unit)}</em>` : "") + `</span></div>`;
}
/* fila con el t/s grande y, debajo en pequeno, el recuento de tokens */
function statsRate(label, tps, tokens){
  return `<div class="strow"><span class="stk">${esc(label)}</span>`
    + `<span class="stv col">`
    + `<span>${esc(tps == null ? "\u2014" : nfmt(tps))} `
    + `<em>${esc(T("tps"))}</em></span>`
    + `<small>${esc(nfmt(tokens))} ${esc(T("tks"))}</small>`
    + `</span></div>`;
}
function statsSheet(st){
  $("#statsTitle").textContent = T("statsTitle");
  const rows = [];
  rows.push(statsRate(T("stGen"), st.genTps, st.output));
  rows.push(statsRate(T("stPrompt"), st.promptTps, st.input));
  if(st.cacheRead) rows.push(statsRow(T("stCache"), nfmt(st.cacheRead),
                                       T("tks")));
  if(st.reasoning) rows.push(statsRow(T("stReason"), nfmt(st.reasoning),
                                       T("tks")));
  rows.push(statsRow(T("stTotal"), nfmt(st.total), T("tks")));
  if(st.cost) rows.push(statsRow(T("stCost"), "$" + st.cost.toFixed(4), ""));
  $("#statsBody").innerHTML = rows.join("");
  $("#statsheet").classList.add("open");
}
$("#statsheet").onclick = e => {

};

/* ---------- gestos tactiles (solo movil) ----------
   La clave es touch-action: el navegador se queda el desplazamiento
   vertical nativo, y el JS solo captura lo que no choca. Asi el contenido
   se desplaza libre. Cerrar una hoja se hace desde su barrita de agarre;
   la barra lateral, deslizando de lado. */
function dragToDismiss(panel, zone, close, fade){
  let y0 = 0, dy = 0, t0 = 0, live = false, drag = false, h = 0;
  const reset = () => {
    panel.style.transition = ""; panel.style.transform = "";
    if(fade) fade.style.opacity = "";
  };
  panel.addEventListener("pointerdown", e => {
    if(WIDE.matches || e.pointerType === "mouse") return;
    if(!e.target.closest(zone)) return;     // solo desde la cabecera
    y0 = e.clientY; t0 = performance.now(); dy = 0; live = true; drag = false;
    h = panel.getBoundingClientRect().height;
  });
  panel.addEventListener("pointermove", e => {
    if(!live) return;
    dy = e.clientY - y0;
    if(!drag){
      if(dy > 6){ drag = true; panel.style.transition = "none";
        try { panel.setPointerCapture(e.pointerId); } catch(_){} }
      else return;                          // aun no: deja pasar el toque
    }
    if(dy < 0) dy = 0;                       // hacia arriba no cierra
    e.preventDefault();
    panel.style.transform = `translateY(${dy}px)`;
    if(fade) fade.style.opacity = String(Math.max(.2, 1 - dy / (h * 1.3)));
  }, {passive:false});
  const end = () => {
    if(!live) return; live = false;
    const dt = performance.now() - t0;
    const v = dt > 40 ? dy / dt : 0;        // sin tiempo no hay velocidad
    panel.style.transition = "";
    if(drag && (dy > 80 || v > 0.5)){
      if(fade){                             // hoja: se desliza fuera
        panel.style.transform = "translateY(110%)";
        fade.style.opacity = "0";
        setTimeout(() => { close(); reset(); }, 260);
      } else {                              // paleta: se desvanece en su sitio
        panel.style.transition = "opacity .18s ease";
        panel.style.opacity = "0";
        setTimeout(() => { close();
          panel.style.transition = ""; panel.style.transform = "";
          panel.style.opacity = ""; }, 190);
      }
    } else {
      reset();
    }
    drag = false;
  };
  panel.addEventListener("pointerup", end);
  panel.addEventListener("pointercancel", end);
}

dragToDismiss($("#sheet .card"), ".grab, .sbar",

(() => {                                   // la barra: deslizar para cerrar
  const rail = $("#rail"), scrim = $("#scrim");
  let x0 = 0, y0 = 0, dx = 0, dy = 0, live = false, drag = false, w = 0;
  rail.addEventListener("pointerdown", e => {
    if(WIDE.matches || !rail.classList.contains("on")
       || e.pointerType === "mouse") return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; dy = 0;
    live = true; drag = false;
    w = rail.getBoundingClientRect().width;
  });
  rail.addEventListener("pointermove", e => {
    if(!live) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if(!drag){
      // el desplazamiento vertical manda: en cuanto se nota, es scroll
      if(Math.abs(dy) > 8){ live = false; return; }
      if(dx < -10){                         // claramente hacia la izquierda
        drag = true; rail.style.transition = "none";
        scrim.style.transition = "none";
        try { rail.setPointerCapture(e.pointerId); } catch(_){}
      } else if(dx > 8){ live = false; return; }
      else return;
    }
    if(dx > 0) dx = 0;
    e.preventDefault();
    rail.style.transform = `translateX(${dx}px)`;
    scrim.style.opacity = String(Math.max(0, 1 + dx / w));
  }, {passive:false});
  const end = () => {
    if(!live) return; live = false;
    rail.style.transition = ""; scrim.style.transition = "";
    rail.style.transform = ""; scrim.style.opacity = "";
    if(drag && dx < -w * 0.33) closeRail();  // el resto anima al soltar
    drag = false;
  };
  rail.addEventListener("pointerup", end);
  rail.addEventListener("pointercancel", end);
})();
