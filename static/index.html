<script id="boot">
/* pick the theme before first paint, or the wrong one flashes on load.
   A theme is a family (a light/dark pair) plus a mode (auto|light|dark).
   IIFE: sus variables no deben chocar con las globales del script grande. */
(function(){try{
  var pairs={pi:["light","dark"],klaude:["klaude-light","klaude"],
    jipiti:["jipiti-light","jipiti-dark"],gemma:["gemma-light","gemma-dark"]};
  var fam=localStorage.getItem("pi.themeFamily");
  var mode=localStorage.getItem("pi.themeMode");
  if(!fam){                                   // migra el viejo pi.theme
    var old=localStorage.getItem("pi.theme")||"light";
    fam="pi"; mode="light";
    if(old==="auto"){ mode="auto"; }
    else for(var k in pairs){
      if(pairs[k][0]===old){ fam=k; mode="light"; }
      else if(pairs[k][1]===old){ fam=k; mode="dark"; }
    }
  }
  var pair=pairs[fam]||pairs.pi;
  var lit = mode==="light" || (mode!=="dark"
    && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.theme = lit ? pair[0] : pair[1];
}catch(e){}})();
</script>

:root{

  --ink:#dde2e8; --dim:#8b95a2; --faint:#7d8794;
  --amber:#f2a63b; --mint:#4fb894; --coral:#e2574c;
  --on-amber:#12151a;                    /* ink that sits on an amber fill */
  --plate-a:#151a21; --plate-b:#151a21;  /* toolbar plana: el color inferior */
  --ask-a:#1e1c16;   --ask-b:#191e25;    /* approval card gradient */

*{box-sizing:border-box}
/* sin el flash azul del navegador al tocar; el foco de teclado se mantiene aparte */
html{-webkit-tap-highlight-color:transparent}
button,.pick,.mrow,summary,.ghead,.mact,.opt{-webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior:none}
body{
  margin:0; background:var(--panel); color:var(--ink);
  font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
  -webkit-user-select:none; user-select:none;   /* cromo no seleccionable */
}
/* pero el contenido si: mensajes, razonamiento, codigo, notas, compositor */
.said, .utext, .tinn, .note, pre, code,
#box, input, textarea, [contenteditable]{
  -webkit-user-select:text; user-select:text;
}

/* ---------- header: instrument nameplate ---------- */
/* El telon del arranque. Tapa la cabecera mientras decide su alto:
   sin proyecto no hay subtitulo, y con el crece 16px.
   El titulo se dibuja letra a letra por contorno y al completarse se
   rellena, UNA sola vez (sin bucle); luego la palabra respira (.lit) hasta
   que se puede entrar, y el telon se va. Cada letra lleva sus keyframes
   propios: con delays la ultima saltaria a la vista. El dibujo dura ~2s
   (trazo .22s/letra, relleno .25s), y queda fijo con forwards. */
.curtain{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center;
  background:var(--panel);
  transition:opacity .34s ease, visibility 0s linear .34s;
}
.curtain svg{display:block; width:200px; height:auto}
.curtain path{
  fill:var(--ink); fill-opacity:0; stroke:var(--ink); stroke-width:.7;
  stroke-dasharray:1; stroke-dashoffset:1;
}
.curtain path:nth-child(1){animation:d1 2.9s linear forwards, f1 2.9s linear forwards}
.curtain path:nth-child(2){animation:d2 2.9s linear forwards, f2 2.9s linear forwards}
.curtain path:nth-child(3){animation:d3 2.9s linear forwards, f3 2.9s linear forwards}
.curtain path:nth-child(4){animation:d4 2.9s linear forwards, f4 2.9s linear forwards}
.curtain path:nth-child(5){animation:d5 2.9s linear forwards, f5 2.9s linear forwards}
.curtain path:nth-child(6){animation:d6 2.9s linear forwards, f6 2.9s linear forwards}
.curtain path:nth-child(7){animation:d7 2.9s linear forwards, f7 2.9s linear forwards}
.curtain path:nth-child(8){animation:d8 2.9s linear forwards, f8 2.9s linear forwards}
@keyframes d1{0%{stroke-dashoffset:1}7.6%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes d2{0%,7.6%{stroke-dashoffset:1}15.2%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes d3{0%,15.2%{stroke-dashoffset:1}22.8%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes d4{0%,22.8%{stroke-dashoffset:1}30.4%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes d5{0%,30.4%{stroke-dashoffset:1}38%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes d6{0%,38%{stroke-dashoffset:1}45.6%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes d7{0%,45.6%{stroke-dashoffset:1}53.2%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes d8{0%,53.2%{stroke-dashoffset:1}60.8%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
/* el trazo se apaga PRONTO, mientras la letra aun entra tenue (relleno ~45%):
   asi no se ve encoger. Cuando la letra ya brilla, el grosor ya es el final
   (relleno puro, mismo peso que el breathe, sin engordar por la arista). */
@keyframes f1{0%,7.6%{fill-opacity:0;stroke-width:.7}11.5%{stroke-width:0}16.2%,100%{fill-opacity:1;stroke-width:0}}
@keyframes f2{0%,15.2%{fill-opacity:0;stroke-width:.7}19.1%{stroke-width:0}23.8%,100%{fill-opacity:1;stroke-width:0}}
@keyframes f3{0%,22.8%{fill-opacity:0;stroke-width:.7}26.7%{stroke-width:0}31.4%,100%{fill-opacity:1;stroke-width:0}}
@keyframes f4{0%,30.4%{fill-opacity:0;stroke-width:.7}34.3%{stroke-width:0}39%,100%{fill-opacity:1;stroke-width:0}}
@keyframes f5{0%,38%{fill-opacity:0;stroke-width:.7}41.9%{stroke-width:0}46.6%,100%{fill-opacity:1;stroke-width:0}}
@keyframes f6{0%,45.6%{fill-opacity:0;stroke-width:.7}49.5%{stroke-width:0}54.2%,100%{fill-opacity:1;stroke-width:0}}
@keyframes f7{0%,53.2%{fill-opacity:0;stroke-width:.7}57.1%{stroke-width:0}61.8%,100%{fill-opacity:1;stroke-width:0}}
@keyframes f8{0%,60.8%{fill-opacity:0;stroke-width:.7}64.7%{stroke-width:0}69.4%,100%{fill-opacity:1;stroke-width:0}}
.curtain.gone{opacity:0; visibility:hidden}
/* rellenado el titulo (una vez), respira hasta que se puede entrar. El
   -1.2s arranca en la fase 50% (opacidad 1): asi no salta desde el estatico. */
.curtain.lit svg{animation:breathe 2.4s ease-in-out -1.2s infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .curtain, .curtain svg, .curtain path{animation:none}
  .curtain{transition:none}
  /* palabra estatica: relleno puro, sin trazo (mismo peso que el breathe) */
  .curtain path{stroke-dashoffset:0; fill-opacity:1; stroke-width:0}
}
/* subtitulo del telon al reiniciar (bajo el titulo que respira) */
.curtsub{
  position:absolute; left:0; right:0; top:calc(50% + 62px); padding:0 24px;
  text-align:center; font:600 13px/1.5 var(--sans); color:var(--dim);
  opacity:0; transition:opacity .34s ease;
}
.curtain.restarting .curtsub{opacity:1}

.plate{
  display:flex; align-items:center; gap:10px;
  padding:13px var(--gut);
  background:linear-gradient(var(--plate-a),var(--plate-b));
}
.plate .txt{
  flex:1; min-width:0; display:flex; flex-direction:column;
  justify-content:center;
}
.plate h1{
  font:600 15px/1.2 var(--sans); margin:0; letter-spacing:.01em;
}
.plate h1 > span{transition:opacity .22s ease}
.plate h1 > span.out{opacity:0}
.plate .sub{
  font:400 13px/1.3 var(--sans); color:var(--faint);
  opacity:0; height:0;
  transition:opacity .3s ease, height .28s cubic-bezier(.32,.72,0,1);
}
.plate .sub.on{opacity:1;height:18px}
.iconbtn{
  background:none;border:1px solid var(--rule);color:var(--dim);
  font:500 11px/1 var(--mono); padding:7px 9px;border-radius:5px;
  cursor:pointer; flex:none;
}
.iconbtn:hover{color:var(--ink);border-color:var(--faint)}
.ico{padding:7px;display:flex}
.i{width:18px;height:18px;flex:none;display:block}
.i-lg{width:32px;height:32px;margin:0 auto 10px;color:var(--faint)}
.iconbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
/* en la toolbar el boton es solo el icono, sin caja y mas grande */
.plate .iconbtn{border:none; padding:6px; background:none}
.plate .iconbtn:hover{background:none}
.plate .iconbtn .i{width:24px; height:24px}

.warnbar{
  display:flex; align-items:center; gap:8px; flex:none;
  padding:7px var(--gut); background:var(--coral-wash);
  border-bottom:1px solid var(--rule); color:var(--coral);
  font:500 11px/1.4 var(--mono);
}
.warnbar[hidden]{display:none}
.warnbar .i{width:15px;height:15px;flex:none}
.warnbar span{flex:1;min-width:0}
.wclose{
  background:none; border:none; color:var(--coral); cursor:pointer;
  padding:2px; display:flex; flex:none; opacity:.75;
}
.wclose:hover{opacity:1}

/* ---------- transcript ---------- */
main{flex:1; overflow-y:auto; padding:16px var(--gut) 8px; position:relative;
  overscroll-behavior:contain; scroll-behavior:smooth;
  --fade:26px;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0,
    #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0,
    #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);}
.wrap{max-width:760px;margin:0 auto}
.turn{margin-bottom:20px;animation:rise-in .22s ease-out}
.nofx .turn{animation:none}   /* a snapshot must not animate 40 rows */

/* you are a bubble on the right; pi answers across the whole width */
.msg{display:flex; justify-content:flex-end}
.blk-you{
  max-width:80%; border-radius:var(--r-bubble);
  background:var(--raise); border:1px solid var(--rule);
  padding:13px 17px; color:var(--you-ink);
  white-space:pre-wrap; word-break:break-word;
}
/* enviado pero sin ack: cursiva y tenue hasta que pi empieza a producir */
.blk-you.you-pending{font-style:italic; opacity:.55}
.tag{
  display:block; font:700 10px/1.4 var(--sans); letter-spacing:.09em;
  color:var(--amber); text-transform:uppercase; margin-bottom:5px;
}
/* mensajes largos del usuario: plegables con un chevron */
.blk-you.foldable{position:relative; padding-bottom:26px}
.foldable .utext{overflow:hidden}
.foldable.folded .utext{
  max-height:4.4em;
  -webkit-mask-image:linear-gradient(to bottom, #000 55%, transparent);
  mask-image:linear-gradient(to bottom, #000 55%, transparent);
}
.ufold{
  position:absolute; right:8px; bottom:4px;
  background:none; border:none; color:var(--faint); cursor:pointer;
  padding:3px; border-radius:6px; display:flex; line-height:0;
}
.ufold:hover{color:var(--ink); background:var(--rule)}
.ufold .i{width:18px; height:18px;
  transition:transform .28s cubic-bezier(.32,.72,0,1)}
.foldable.folded .ufold .i{transform:rotate(90deg)}       /* v: desplegar */
.foldable:not(.folded) .ufold .i{transform:rotate(-90deg)} /* ^: comprimir */

.said{word-break:break-word; font-size:var(--chat-size,15px);
  font-family:var(--chat-font,var(--sans))}
.blk-you{font-family:var(--chat-font,var(--sans))}
.blk-you{font-size:var(--chat-size,15px)}
.said p{margin:0 0 .7em}
.said p:last-child{margin-bottom:0}
.said h4{font:600 15px/1.4 var(--sans);margin:1.1em 0 .4em}
.said ul,.said ol{margin:.2em 0 .8em;padding-left:1.25em}
.said li{margin:.15em 0}
.said a{color:var(--mint)}
.said code{
  font:500 13px/1.4 var(--mono); background:var(--raise);
  padding:1px 5px; border-radius:3px; color:var(--lit);
}
.said pre{
  background:var(--box); border:1px solid var(--rule);
  border-radius:var(--r-tool); padding:12px 13px; overflow-x:auto;
  margin:.7em 0;
}
.said pre code{background:none;padding:0;color:var(--box-ink);font-size:12.5px}
/* tablas GFM: rejilla de instrumento, datos en mono, scroll propio en movil */
.said .twrap{overflow-x:auto; margin:.9em 0; -webkit-overflow-scrolling:touch}
.said table{border-collapse:collapse; font:500 12.5px/1.5 var(--mono)}
.said th,.said td{border:1px solid var(--rule); padding:6px 11px;
  text-align:left; white-space:nowrap; vertical-align:top}
.said thead th{background:var(--raise); color:var(--amber); font-weight:600;
  letter-spacing:.02em; border-bottom:2px solid var(--rule)}
.said tbody tr:nth-child(even){background:var(--surface)}
.said tbody td{color:var(--dim)}
.said tbody td:first-child{color:var(--ink)}   /* la etiqueta de la fila, fuerte */
.said table code{font-size:12px}
.cwrap{position:relative}
.cwrap pre{padding-right:48px}
/* los dos iconos bajo cada respuesta del asistente */
.msgacts{display:flex; gap:4px; margin:2px 0 0 -2px}
.mact{
  background:none; border:none; color:var(--faint); cursor:pointer;
  padding:5px; border-radius:6px; display:flex; line-height:0;
  transition:color .15s ease, background-color .15s ease;
}
.mact:hover{color:var(--ink); background:var(--raise)}
.mact.done{color:var(--mint)}
.mact .i{width:16px;height:16px}

/* filas de la hoja de estadisticas */
#statsBody{display:flex; flex-direction:column}
.strow{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; padding:9px 2px; border-bottom:1px solid var(--rule);
}
.strow:last-child{border-bottom:none}
.sbar .shi{display:flex; color:var(--amber); flex:none}
.sbar .shi .i{width:18px;height:18px}
.stk{font:600 12px/1.3 var(--sans); color:var(--dim)}
.stv{font:600 15px/1.2 var(--mono); color:var(--ink);
  font-variant-numeric:tabular-nums}
.stv em{font:500 11px/1 var(--mono); color:var(--faint); font-style:normal}
.stv.col{display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.stv.col small{font:500 11px/1 var(--mono); color:var(--faint)}

.copyb{
  position:absolute; top:8px; right:8px; width:30px; height:30px;
  border-radius:8px; border:1px solid var(--rule); background:var(--head);
  color:var(--head-ink); cursor:pointer; opacity:.7;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .18s ease, color .18s ease, border-color .18s ease;
}
.copyb:hover{opacity:1;color:var(--ink);border-color:var(--faint)}
.copyb .i{width:16px;height:16px}
.copyb.done{color:var(--mint);border-color:var(--mint);opacity:1}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ---------- grupo de herramientas ---------- */
.toolgroup{margin:9px 0}
.ghead{
  width:100%; display:flex; align-items:center; gap:8px; cursor:pointer;
  background:var(--head); color:var(--head-ink);
  border:1px solid var(--rule); border-radius:var(--r-tool);
  padding:8px 11px; font:500 12px/1.4 var(--mono);
}
.ghead .gn{flex:1; text-align:left}
.ghead .i{width:15px;height:15px;flex:none}
.ghead > .i:last-child{transition:transform .2s ease}
.toolgroup:not(.collapsed) .ghead > .i:last-child{transform:rotate(90deg)}
.gbody{overflow:hidden; transition:height .2s cubic-bezier(.32,.72,0,1)}
.toolgroup.collapsed .gbody{height:0}
.gbody{padding-left:14px}
.gbody > .turn{margin:8px 0 0}

/* ---------- tool rows ---------- */
.tool{
  border:1px solid var(--rule); border-radius:var(--r-tool);
  background:var(--box); margin:9px 0; overflow:hidden;
  box-shadow:var(--lift);
}
.tool>summary{
  list-style:none; cursor:pointer; padding:8px 11px;
  font:500 12px/1.4 var(--mono); color:var(--head-ink);
  background:var(--head);
  display:flex; align-items:center; gap:8px;
  white-space:nowrap; overflow:hidden;      /* args largos no desbordan */
}
.tool>summary .nm{
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
}
.tool>summary::-webkit-details-marker{display:none}
/* razonamiento del modelo: bloque sobrio, plegado por defecto */
.think{margin:6px 0 11px; border-left:2px solid var(--rule)}
.think>summary{
  list-style:none; cursor:pointer; user-select:none;
  display:flex; align-items:center; gap:7px; padding:5px 6px 5px 11px;
  font:500 12px/1.3 var(--mono); letter-spacing:.02em; color:var(--dim);
}
.think>summary::-webkit-details-marker{display:none}
.think>summary:hover{color:var(--ink)}
.think>summary .i{width:15px; height:15px; opacity:.85; flex:none}
.think .tlabel{flex:1; min-width:0}
/* mientras razona: brillo skeleton que barre el rotulo de izquierda a derecha */
.think .tlabel.shine{
  background:linear-gradient(90deg, var(--dim) 42%, var(--ink) 50%, var(--dim) 58%);
  background-size:250% 100%; background-position:100% 0;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  animation:tshine 2.8s cubic-bezier(.45,0,.15,1) infinite;
}
@keyframes tshine{from{background-position:100% 0}to{background-position:0% 0}}
.think .tw{width:16px; height:16px; opacity:.7;
  transition:transform .2s ease}
.think[open] .tw{transform:rotate(90deg)}
/* el padding vertical vive dentro: con padding propio, height:0 no
   llegaba a cero y la animacion nacía y moría en un residuo de 9 px */
.think .tbody{
  padding:0 11px 0 13px; color:var(--dim);
  font:400 13px/1.55 var(--sans); font-style:italic;
  /* apertura y cierre con velocidad suave, como el relleno del contexto */
  transition:height .25s cubic-bezier(.45,0,.15,1);
}
.think .tinn{padding:2px 0 7px}
.think.moving .tbody{overflow:hidden}
.think .tbody p{margin:0 0 .5em}
.think .tbody p:last-child{margin-bottom:0}
.think .tbody code{font-style:normal; font-family:var(--mono)}
.think .copyb{display:none}            /* el razonamiento no se copia */
/* Functions: card de ajuste con interruptor Material */
.fcard{
  background:var(--raise); border:1px solid var(--rule);
  border-radius:var(--r-tool); box-shadow:var(--lift); margin-bottom:7px;
}
.frow{display:flex; align-items:center; gap:14px; padding:14px 16px}
.ftext{flex:1; min-width:0}
.flbl{font:600 14px/1.3 var(--sans); color:var(--ink)}
.sw{
  width:44px; height:26px; border-radius:999px; flex:none;
  background:var(--rule); border:none; padding:0; cursor:pointer;
  position:relative; transition:background .2s ease;
}
.sw[aria-checked="true"]{background:var(--amber)}
.sw .knob{
  position:absolute; top:3px; left:3px; width:20px; height:20px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px #0006;
  transition:transform .2s ease;
}
.sw[aria-checked="true"] .knob{transform:translateX(18px)}
.sw:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
/* el interruptor apagado esconde el razonamiento */
html.hide-think .think-turn{display:none}
/* movement: el texto se revela de izquierda a derecha (fade por caracter,
   la opacidad la pone el motor de revelado en JS sobre spans .rv) */
.said .rv{will-change:opacity}
.tool .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.tool[data-s="done"] .dot{background:var(--mint)}
.tool[data-s="error"] .dot{background:var(--coral)}
.tool[data-s="running"] .dot{animation:blink 1.3s ease-in-out infinite}
/* se quedo a medias: pi se fue sin decir como acabo */
.tool[data-s="stale"] .dot{
  width:7px; height:7px; background:var(--panel);
  box-shadow:inset 0 0 0 2px var(--coral);
}
.tool > pre, .tool > .diff, .tool > .tbody{
  transition:height .18s cubic-bezier(.32,.72,0,1);
}
.tool.moving > pre, .tool.moving > .diff, .tool.moving > .tbody{overflow:hidden}
.tool pre{
  margin:0; padding:10px 11px; border-top:1px solid var(--rule);
  font:400 12px/1.5 var(--mono); color:var(--box-ink);
  white-space:pre-wrap; word-break:break-word; max-height:340px; overflow:auto;
}
/* cuerpo de una herramienta: bloque "comando" y bloque "salida", cada uno
   con su cabecera en versalitas y el texto debajo. El borde superior de cada
   bloque hace de divisoria (titulo | comando | salida) */
.ccmd, .cout{border-top:1px solid var(--rule)}
.ccmd .ch, .cout .ch{
  display:flex; align-items:center; gap:6px; padding:7px 11px 5px;
  font:600 9.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint);
}
.ccmd .ch .i, .cout .ch .i{width:13px; height:13px}
.ccmd pre, .cout pre{border-top:none; padding-top:2px}
.cempty{color:var(--faint); font-style:italic}
/* imagen que devuelve una herramienta: miniatura en la caja, ampliable */
.toolimgs{padding:8px 11px; display:flex; flex-wrap:wrap; gap:8px}
.tim{
  max-height:160px; max-width:100%; border-radius:8px;
  border:1px solid var(--rule); cursor:zoom-in; display:block;
}
.lightbox{
  position:fixed; inset:0; z-index:100; display:flex; padding:20px;
  align-items:center; justify-content:center; overflow:hidden;
  background:var(--veil); opacity:0; transition:opacity .2s ease;
  touch-action:none;                 /* los gestos los maneja el JS */
}
.lightbox.open{opacity:1}
.lightbox[hidden]{display:none}
.lightbox img{
  max-width:100%; max-height:100%; border-radius:10px;
  box-shadow:0 24px 60px #0009;
  transform-origin:center center; will-change:transform;
  user-select:none; -webkit-user-drag:none; touch-action:none;
}
.lbx{
  position:absolute; top:calc(12px + env(safe-area-inset-top)); right:14px;
  z-index:2; width:40px; height:40px; border-radius:50%; border:none;
  background:#0007; color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.lbx .i{width:22px; height:22px}
/* cuenta de lineas en la fila plegada, como en la tui */
.tally{display:flex;gap:7px;flex:none;font:600 11px/1 var(--mono)}
.tally .plus{color:var(--add)}
.tally .minus{color:var(--del)}
.diff{
  margin:0; border-top:1px solid var(--rule); max-height:340px;
  overflow:auto; font:400 12px/1.55 var(--mono);
}
.diff div{padding:1px 11px; white-space:pre-wrap; word-break:break-word}
.diff .add{color:var(--add); background:var(--mint-wash)}
.diff .del{color:var(--del); background:var(--coral-wash)}
.diff .at{color:var(--faint)}

/* ---------- notes ---------- */
.note{
  font:500 12px/1.5 var(--mono); color:var(--dim);
  border-left:2px solid var(--faint); padding:3px 0 3px 11px; margin:10px 0;
  display:flex; align-items:center; gap:8px;
}
.note .i{width:16px;height:16px;flex:none}
.note.warn{border-color:var(--amber);color:var(--amber)}
.note.error{border-color:var(--coral);color:var(--coral)}
.note{transition:opacity .2s ease}
.note.fade{opacity:0}
.note.busy .i{animation:pulse 1.4s ease-in-out infinite}

/* ---------- approval card ---------- */
.ask{
  border:1px solid var(--amber); border-radius:var(--r-card); margin:14px 0;
  box-shadow:var(--cast-card);
  background:linear-gradient(var(--ask-a),var(--ask-b));
}
.ask .cap{
  font:700 10px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--amber); padding:10px 13px 0;
}
.ask h3{font:600 14px/1.4 var(--sans);margin:6px 13px 0}
.ask .body{
  font:400 12.5px/1.5 var(--mono); color:var(--dim);
  margin:6px 13px 0; white-space:pre-wrap; word-break:break-word;
}
/* que va a ejecutarse exactamente */
.ask .what{
  margin:9px 13px 0; border:1px solid var(--rule); border-radius:var(--r-tool);
  background:var(--box); overflow:hidden;
}
.ask .what .who{
  display:flex; align-items:center; gap:7px; padding:6px 10px;
  background:var(--head); color:var(--head-ink);
  font:500 11.5px/1.4 var(--mono);
}
.ask .what .who .i{width:15px;height:15px}
.ask .what .says{padding:9px 10px; font:400 12.5px/1.5 var(--sans)}
.ask .what .says p{margin:0; color:var(--box-ink)}
.ask .what .says p + p{margin-top:4px}
.ask .what .says code{
  font:500 12px/1.4 var(--mono); background:var(--raise);
  padding:1px 5px; border-radius:3px; color:var(--lit);
  word-break:break-all;
}
.ask .what .says + pre{border-top:1px solid var(--rule)}
.ask .what pre{
  margin:0; padding:9px 10px; font:400 12px/1.5 var(--mono);
  color:var(--box-ink); white-space:pre-wrap; word-break:break-word;
  max-height:190px; overflow:auto;
}
.ask .opts{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px 13px}
.opt{
  font:500 12.5px/1 var(--mono); padding:9px 13px; border-radius:5px;
  border:1px solid var(--rule); background:var(--raise); color:var(--ink);
  cursor:pointer; flex:1 1 auto; min-width:96px;
}
.opt:hover{border-color:var(--amber)}
.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.opt.yes{border-color:var(--mint);color:var(--mint)}
.opt.no{border-color:var(--coral);color:var(--coral)}
.ask.done{border-color:var(--rule);background:var(--surface)}
.ask.done .opts{display:none}
.ask .verdict{
  font:500 12px/1 var(--mono); color:var(--mint); padding:9px 13px 12px;
  display:flex; align-items:center; gap:7px;
}
.ask .verdict .i{width:16px;height:16px}

/* ---------- readout: the signature ---------- */
.readout[hidden]{display:none}     /* display:flex below beats [hidden] */
.readout{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin:0 0 9px; font:500 12px/1 var(--mono);
}
.rstat{display:flex; align-items:center; gap:8px; min-width:0}
/* la palabra solo se ve mientras piensa, no mientras teclea */
.rword{
  font:500 13px/1 var(--mono); color:var(--amber); letter-spacing:.02em;
  white-space:nowrap; opacity:0; transition:opacity .28s ease;
}
.readout.thinking .rword{opacity:1}
/* reingiriendo contexto: parpadeo suave y sin contador de tiempo */
.readout.prefill .rword{color:var(--amber);
  animation:prefillBlink 1.6s cubic-bezier(.45,0,.15,1) infinite}
@keyframes prefillBlink{0%,100%{opacity:1} 50%{opacity:.35}}
.readout.prefill .rsecs{display:none}
.rword.out{opacity:0 !important}
.rsecs{font:500 13px/1 var(--mono); color:var(--dim); white-space:nowrap}
.rsecs:empty{display:none}
.ctx{
  width:min(62%, 260px); min-width:0; height:22px; border-radius:11px;
  background:var(--raise); border:1px solid var(--rule);
  position:relative; overflow:hidden;
}
/* la primera vez que aparece: la fila se alarga y la barra entra en fade
   desde transparente (sin crecer de ancho); el relleno lo pone la
   transicion de .ctx i */
.readout.show{animation:rowIn .45s cubic-bezier(.32,.72,0,1); overflow:hidden}
@keyframes rowIn{
  from{max-height:0; margin-bottom:0; opacity:0}
  to{max-height:32px; margin-bottom:9px; opacity:1}
}
/* backwards: durante el delay la barra se queda invisible, asi que la
   fila crece primero y la barra entra despues */
.readout.show .ctx{animation:ctxIn .6s cubic-bezier(.45,0,.15,1) .35s backwards}
@keyframes ctxIn{from{opacity:0}}
.ctx i{
  position:absolute; left:0; top:0; bottom:0; width:0;
  background:var(--mint); opacity:.32; border-radius:11px;
  /* relleno: lento y con velocidad suave (frena a los dos extremos) */
  transition:width .8s cubic-bezier(.45,0,.15,1), background-color .3s;
}
.ctx.hot i{background:var(--amber)}
.ctx.max i{background:var(--coral)}
.ctx span{
  position:relative; display:block; text-align:center;
  font:500 11px/20px var(--mono); color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.readout .sec{color:var(--faint);font-variant-numeric:tabular-nums}
.readout .sec{flex:none}

/* ---------- composer ---------- */
footer{
  /* el fondo va en ::before para poder difuminarlo por los lados sin
     tocar la caja ni los botones, que quedan por encima */
  background:transparent;
  /* --kb es el alto que ocupa el teclado del movil */
  padding:9px var(--gut) calc(9px + env(safe-area-inset-bottom) + var(--kb,0px));
  position:relative;
  transition:padding-bottom .18s ease;
}
footer::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:var(--surface); border-top:1px solid var(--rule);
  border-radius:18px 18px 0 0;
}
footer > *{position:relative; z-index:1}

.godown{
  position:absolute; left:50%; bottom:calc(100% + 12px); z-index:14;
  width:40px; height:40px; border-radius:50%; cursor:pointer;
  background:var(--surface); border:1px solid var(--rule); color:var(--ink);
  box-shadow:0 3px 10px rgba(0,0,0,.28); display:flex; align-items:center;
  justify-content:center;
  opacity:0; visibility:hidden; transform:translateX(-50%) scale(.7);
  transition:opacity .2s ease,
             transform .24s cubic-bezier(.32,.72,0,1),
             visibility 0s linear .24s;
}
.godown.on{
  opacity:1; visibility:visible; transform:translateX(-50%) scale(1);
  transition:opacity .2s ease,
             transform .24s cubic-bezier(.32,.72,0,1), visibility 0s;
}
.godown .i{width:20px;height:20px;transform:rotate(180deg)}

/* ---------- rows inside a dialog ---------- */
.mrow{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:var(--raise); border:1px solid var(--rule);
  border-radius:var(--r-tool); color:var(--ink); cursor:pointer;
  padding:13px 14px; margin-bottom:7px; font:400 13px/1.35 var(--sans);
}
.mrow:hover{border-color:var(--amber)}
.mrow.bad{color:var(--coral)}
.mrow.bad .i{color:var(--coral)}
.mrow .i{color:var(--faint)}
/* pie del selector de tema: switch Auto sobre el toggle claro/oscuro */
.tmode{margin-top:6px; padding-top:14px; border-top:1px solid var(--rule);
  display:flex; flex-direction:column; gap:12px}
.tmode .frow{display:flex; align-items:center; justify-content:space-between}
.tmode .flbl{font:600 13px/1 var(--sans); color:var(--ink)}
.seg{display:flex; border:1px solid var(--rule); border-radius:10px;
  overflow:hidden; transition:opacity .2s ease}
.seg button{flex:1; background:var(--raise); color:var(--ink); border:none;
  border-left:1px solid var(--rule); padding:11px 0; cursor:pointer;
  font:600 13px/1 var(--sans)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--amber); color:var(--on-amber)}
.seg.off{opacity:.4}
.seg button:disabled{cursor:default}

/* ---------- slash palette ---------- */
.palette .grab{margin:6px 0 2px}
.palette{
  position:absolute; left:0; right:0; bottom:100%;
  background:var(--surface); border:1px solid var(--rule);
  border-bottom:none; border-radius:12px 12px 0 0;
  max-height:52vh; overflow-y:auto; z-index:15; touch-action:pan-y;
  box-shadow:var(--cast);
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.32,.72,0,1),
             visibility 0s linear .22s;
}
.palette.open{
  opacity:1; visibility:visible; transform:none;
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.32,.72,0,1),
             visibility 0s;
}
.palette .phead{
  font:700 10px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); padding:11px var(--gut) 8px; touch-action:none;
  position:sticky; top:0; background:var(--surface);
}
.cmd{
  display:flex; align-items:baseline; gap:10px; width:100%;
  background:none; border:none; border-left:2px solid transparent;
  padding:9px var(--gut); cursor:pointer; text-align:left; color:var(--ink);
}
.cmd.off{opacity:.42; cursor:not-allowed}
.cmd.off b{color:var(--faint)}
.cmd b{font:600 13px/1.3 var(--mono);color:var(--ink);flex:none}
.cmd span{font:400 12px/1.3 var(--sans);color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd.sel{background:var(--raise);border-left-color:var(--amber)}
.cmd.sel b{color:var(--amber)}
.cmd:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.palette .none{padding:12px var(--gut) 16px;font:400 12px/1.4 var(--mono);
  color:var(--faint)}
.entry{display:flex;gap:8px;align-items:flex-end}
/* popup del '+' : commands e image */
.plusmenu{
  position:absolute; left:4px; bottom:calc(100% + 8px); z-index:30;
  min-width:184px; padding:6px; transform-origin:bottom left;
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-card); box-shadow:var(--cast-card);
  display:flex; flex-direction:column; gap:2px;
  opacity:0; transform:translateY(6px) scale(.96);
  transition:opacity .16s ease, transform .18s cubic-bezier(.32,.72,0,1);
}
.plusmenu[hidden]{display:none}
.plusmenu.open{opacity:1; transform:none}
.pmi{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:none; border:none; border-radius:9px; cursor:pointer;
  padding:11px 12px; color:var(--ink); font:500 13.5px/1 var(--sans);
}
.pmi:hover{background:var(--raise)}
.pmi .pmi-ic{display:flex; flex:none}
.pmi .i{width:20px; height:20px; color:var(--dim)}
.pmi:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
/* miniaturas sobre el compositor */
.thumbs{display:flex; flex-wrap:wrap; gap:8px; padding:2px var(--gut) 8px}
.thumbs[hidden]{display:none}
.thumb{
  position:relative; width:56px; height:56px; flex:none;
  border-radius:10px; overflow:hidden;
  border:1px solid var(--rule); background:var(--raise);
  transform:scale(.6); opacity:0;                 /* estado de entrada */
  transition:transform .2s cubic-bezier(.32,.72,0,1),
             opacity .18s ease, width .2s ease, margin .2s ease;
}
.thumb.in{transform:none; opacity:1}
.thumb.out{                                        /* salida: colapsa el hueco */
  transform:scale(.6); opacity:0; width:0;
  margin-left:-8px; border-width:0;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thx{
  position:absolute; top:2px; right:2px; width:18px; height:18px;
  border-radius:50%; border:none; padding:0; cursor:pointer;
  background:#000a; color:#fff; display:grid; place-items:center;
}
.thx .i{width:13px; height:13px}
/* imagenes dentro de la burbuja de usuario */
.uimgs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px}
.uimgs img{
  max-width:200px; max-height:220px; border-radius:10px; display:block;
  border:1px solid var(--rule);
}
.cmeta{                                 /* modelo y razonamiento, sutil */
  font:400 10.5px/1.4 var(--sans); color:var(--faint);
  padding:5px 16px 0; min-height:14px; text-align:right;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.field{flex:1; min-width:0; position:relative; display:flex}
#box{
  flex:1; min-width:0; background:var(--panel); color:var(--field-ink);
  border:1px solid var(--rule); border-radius:var(--r-pill);
  padding:15px 20px 15px 48px; font:15px/1.45 var(--sans);
  max-height:38vh; min-height:24px; overflow-y:auto;
  white-space:pre-wrap; word-break:break-word; cursor:text;
  /* touch-action lo conmuta el JS: sin desborde, el arrastre mueve el
     cursor y no scrollea nada; con desborde, scrollea el interior y el
     'contain' impide que el gesto se encadene al chat */
  touch-action:none; overscroll-behavior:contain;
  transition:padding .22s cubic-bezier(.32,.72,0,1),
             background-color .18s, border-color .18s, color .18s;
  scrollbar-width:none;                        // la linea fina hace de scrollbar
}
#box::-webkit-scrollbar{display:none}
.scrollind{position:absolute; width:3px; border-radius:2px; left:0; top:0;
  background:var(--faint); pointer-events:none; opacity:0; transition:opacity .18s}
.field.typing #box, .field.busy #box,
.field.hasimg #box{padding-right:48px}
/* el marcador de posicion: solo cuando el campo esta vacio de verdad.
   Clase propia (no '.empty', que es la tarjeta de estado sin proyecto) */
#box.ce-blank::before{
  content:attr(data-ph); color:var(--faint); pointer-events:none;
}
/* cuando el marcador es una sugerencia de respuesta, se distingue */
/* sugerencias de respuesta: texto plano bajo la respuesta, flecha curva a la
   izquierda, clic = enviar. Sin bordes ni fondo; separadas entre si. */
.suggests{ display:flex; flex-direction:column; gap:14px; margin:16px 0 4px }
.sug{
  display:flex; align-items:flex-start; gap:10px; width:100%;
  text-align:left; cursor:pointer;
  background:none; border:0; padding:0;
  font:400 15px/1.45 'IBM Plex Sans',system-ui,sans-serif;
  color:var(--dim);
  transition:color .15s;
}
.sug .sarrow{ flex:none; display:flex; margin-top:1px }
.sug .sarrow .i{ width:18px; height:18px; fill:var(--faint); transition:fill .15s }
.sug .stext{ flex:1; min-width:0 }
.sug:hover{ color:var(--ink) }
.sug:hover .sarrow .i{ fill:var(--amber) }
.sug:active{ opacity:.7 }
#box[contenteditable="false"]{opacity:.6; cursor:default}
/* bloque de texto pegado: acento del tema en negrita, se borra como unidad */
.chip{
  color:var(--amber); font-weight:700;
  font-family:var(--mono); font-size:12.5px;
  background:var(--raise); border-radius:6px; padding:1px 7px;
  white-space:nowrap; cursor:default;
}

/* the key that opens the palette, shown as itself */
.slashb{
  position:absolute; left:9px; top:50%; transform:translateY(-50%);
  width:36px; height:36px; border-radius:50%; flex:none;
  border:1px solid var(--rule); background:var(--raise); color:var(--amber);
  font:600 16px/1 var(--mono); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .18s ease,
             transform .22s cubic-bezier(.32,.72,0,1);
}
/* hover solo en dispositivos con puntero: en tactil, Chrome mantiene el
   :hover pegado al ultimo elemento tocado hasta que se toca fuera. En tactil
   el estado va por clase: borde ambar mientras el menu esta abierto */
@media (hover:hover){ .slashb:hover{border-color:var(--amber)} }
.slashb.on{border-color:var(--amber)}
.slashb:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#box:focus{outline:none;border-color:var(--faint)}
.slashb .i{width:22px; height:22px}
.send{
  background:var(--amber); color:var(--on-amber); border:none;
  width:36px; height:36px; border-radius:50%; padding:0; cursor:pointer;
  display:grid; place-items:center;
  position:absolute; right:9px; top:50%; z-index:2;   /* espejo del '/' */
  opacity:0; transform:translateY(-50%) scale(.6); pointer-events:none;
  transition:opacity .18s ease, transform .2s cubic-bezier(.32,.72,0,1),
             background-color .18s, box-shadow .18s;
}
/* aparece con el texto y al trabajar; si no, se esconde en la caja */
.field.typing .send, .field.busy .send, .field.hasimg .send,
.send.sending, .send.halting, .send.summing{
  opacity:1; transform:translateY(-50%); pointer-events:auto;
}
/* enviar y parar comparten sitio y se cruzan con un fundido */
.send .ic{
  grid-area:1/1; display:flex; transition:opacity .18s ease;
}
.send .halt,.send .wait{opacity:0}
.send.halting .go{opacity:0}
.send.halting .halt{opacity:1}
/* esperando el resumen al parar: mismo fondo apagado, aro en vez de cuadrado */
.send.summing .go,.send.summing .halt{opacity:0}
.send.summing .wait{opacity:1}
/* enviando: un aro que gira hasta que el mensaje aparece en el chat */
.send.sending .go,.send.sending .halt{opacity:0}
.send.sending .wait{opacity:1}
.send .wait{align-items:center; justify-content:center}
.sspin{
  width:18px; height:18px; border-radius:50%;
  /* aro fino (grosor de los iconos) en color de texto, que adapta al tema;
     keyframe propio: 'turn' arrastra el translate de .spin y descentraba el aro */
  border:2px solid color-mix(in srgb, currentColor 26%, transparent);
  border-top-color:currentColor;
  animation:bspin .8s linear infinite;
}
@keyframes bspin{to{transform:rotate(360deg)}}
/* al parar (y esperando el resumen), cuadrado/aro claro sobre fondo apagado */
.send.halting, .send.summing{
  background:var(--raise); color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--dim);
}
.send.halting .halt svg{width:18px;height:18px}
.send .i{width:18px;height:18px}
.send:disabled{background:var(--rule);color:var(--faint);cursor:default}

/* ---------- sheet ---------- */
.sheet{
  position:fixed; inset:0; background:var(--veil); display:flex;
  align-items:flex-end; justify-content:center; z-index:20;
  opacity:0; visibility:hidden;
  transition:opacity .22s ease, visibility 0s linear .22s;
}
.sheet.open{
  opacity:1; visibility:visible;
  transition:opacity .22s ease, visibility 0s;
}
.grab{
  height:22px; display:flex; align-items:center; justify-content:center;
  margin:-8px 0 2px; touch-action:none; cursor:grab;
}
.grab::before{
  content:""; width:36px; height:4px; border-radius:2px;
  background:var(--rule);
}
.sheet .card{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:12px 12px 0 0; width:100%; max-width:760px;
  max-height:78vh; overflow-y:auto; touch-action:pan-y;
  padding:14px var(--gut) calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%); will-change:transform;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.sheet.open .card{transform:none}
.sbar{display:flex; align-items:center; gap:9px; margin:2px 0 12px;
  touch-action:none}
.sheet h2{
  font:700 11px/1 var(--sans); letter-spacing:.1em; color:var(--faint);
  text-transform:uppercase; margin:0; flex:1;
}
.backb{
  background:none; border:none; color:var(--dim); cursor:pointer;
  padding:2px; margin-left:-2px; display:flex; flex:none;
}
.backb:hover{color:var(--ink)}
.backb[hidden]{display:none}
.backb .i{width:19px;height:19px}

/* al entrar en una seccion el contenido llega desde la derecha,
   y al volver desde la izquierda */
#sheetBody{
  transition:transform .2s cubic-bezier(.32,.72,0,1), opacity .16s ease;
}
#sheetBody.to-left{transform:translateX(-26px);opacity:0}
#sheetBody.to-right{transform:translateX(26px);opacity:0}
.pick{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:var(--raise); border:1px solid var(--rule);
  border-radius:var(--r-tool); color:var(--ink);
  padding:13px 14px; margin-bottom:7px; cursor:pointer;
  font:400 13px/1.35 var(--sans); box-shadow:var(--lift);
}
.pick .txt{flex:1;min-width:0}
.pick .ch{width:16px;height:16px;color:var(--faint)}
.pick:hover{border-color:var(--amber)}
.pick small{display:block;font:400 11px/1.4 var(--mono);color:var(--faint);
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* etiqueta con el valor actual al lado, en gris tenue (p.ej. Tema | Klaude) */
.pick .lblrow{display:flex; align-items:baseline; min-width:0}
.pick .lblrow > .mq{flex:0 1 auto}
.pick .pval{flex:none; margin-left:7px; color:var(--faint); font-weight:400;
  white-space:nowrap}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.nav .path{flex:1;font:400 11px/1.35 var(--mono);color:var(--dim);
  word-break:break-all}
.usebtn{
  display:block; width:100%; background:var(--amber); color:var(--on-amber);
  border:none; border-radius:7px; font:600 12.5px/1 var(--mono);
  padding:12px; margin-bottom:11px; cursor:pointer;
}
.usebtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pick small.mk{color:var(--amber)}
/* cargar sesion: el titulo respira mientras llega el historial */
.spin{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  transition:opacity .25s ease;
}
.spin span{
  color:var(--ink); font:600 22px/1 var(--mono); letter-spacing:.02em;
  animation:breathe 2.4s ease-in-out infinite;
}
.spin.out{opacity:0}
/* la tarjeta de estado vacio cede el sitio al titulo */
main:has(#spin) .empty{display:none}
@keyframes turn{to{transform:translate(-50%,-50%) rotate(360deg)}}

.empty{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(86%,300px); background:none; cursor:pointer;
  border:1.5px dashed var(--rule); border-radius:16px; padding:30px 22px;
  text-align:center; color:var(--faint); font:400 12.5px/1.5 var(--sans);
  transition:border-color .18s,color .18s;
}
.empty:hover{border-color:var(--amber);color:var(--dim)}
.nosub{padding:14px 4px;color:var(--faint);font:400 12.5px/1.5 var(--sans)}
.empty:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.empty b{display:block;font:700 12px/1.4 var(--sans);color:var(--amber);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}

/* ---------- side rail: projects ---------- */
.scrim{position:fixed;inset:0;background:var(--veil);z-index:25;
  opacity:0;transition:opacity .22s ease}
.scrim.on{opacity:1}
.scrim{will-change:opacity}
.scrim[hidden]{display:none}
.rail{
  position:fixed; top:0; bottom:0; left:0; width:min(82%,292px); z-index:26;
  background:var(--surface); border-right:1px solid var(--rule);
  padding:calc(15px + env(safe-area-inset-top)) 11px
          calc(15px + env(safe-area-inset-bottom));
  overflow-y:auto; transform:translateX(-101%); touch-action:pan-y;
  transition:transform .3s cubic-bezier(.32,.72,0,1),
             background-color .18s, border-color .18s;
  will-change:transform;
}
.rail.on{transform:none}
.railtop{
  display:flex; align-items:center; gap:8px;
  font:600 15px/1.2 var(--mono); color:var(--ink); padding:4px 8px 15px;
}
.railtop span{flex:1; min-width:0}
.foldb{
  display:none; background:none; border:none; color:var(--dim);
  cursor:pointer; padding:3px; border-radius:5px; flex:none;
}
.foldb:hover{color:var(--ink); background:var(--raise)}
.foldb .i{width:19px;height:19px}
.stack{display:flex; flex-direction:column; flex:1; min-height:0; min-width:0}
.grip{display:none}
.addp{
  display:flex; align-items:center; gap:9px; width:100%;
  background:var(--amber); color:var(--on-amber); border:none;
  border-radius:var(--r-tool); padding:12px 14px; cursor:pointer;
  font:600 13px/1 var(--sans); margin-bottom:5px;
}
.addp svg{width:17px;height:17px;flex:none}
.addp.ghost{
  background:transparent; color:var(--amber); border:1px solid var(--rule);
  margin-top:8px;
}
.addp.ghost:hover{background:var(--surface)}
/* ---------- buscar conversacion: pantalla completa sobre el rail ---------- */
.searchview{
  position:fixed; inset:0; z-index:40; background:var(--panel);
  display:flex; flex-direction:column;
  transform:translateY(102%); visibility:hidden;
  transition:transform .26s cubic-bezier(.2,.8,.2,1),
             visibility 0s linear .26s;
}
.searchview.on{transform:none; visibility:visible;
  transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sbar2{
  display:flex; align-items:center; gap:10px; flex:none;
  padding:calc(10px + env(safe-area-inset-top)) 14px 11px;
  border-bottom:1px solid var(--rule);
}
.sbar2 .sic{width:20px;height:20px;color:var(--faint);flex:none}
.sbar2 input{
  flex:1; min-width:0; background:none; border:none; outline:none;
  color:var(--ink); font:400 15px/1.3 var(--sans);
}
.sbar2 input::placeholder{color:var(--faint)}
.xb{
  background:none; border:none; cursor:pointer; padding:6px; flex:none;
  color:var(--faint); display:flex; border-radius:8px;
}
.xb:hover{background:var(--surface); color:var(--ink)}
.xb svg{width:20px;height:20px}
#searchList{
  flex:1; overflow-y:auto;
  padding:6px 14px calc(18px + env(safe-area-inset-bottom));
}
.srow{
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  background:none; border:none; cursor:pointer;
  padding:13px 2px; border-bottom:1px solid var(--rule);
  font:400 14.5px/1.3 var(--sans); color:var(--ink);
}
.srow span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
.srow small{flex:none; font:400 11px/1 var(--mono); color:var(--faint)}
.proj{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; border-radius:var(--r-tool);
  padding:10px 13px; cursor:pointer;
  color:var(--ink); font:500 13px/1.3 var(--sans);
}
.proj .txt{flex:1;min-width:0}
.proj .i{color:var(--faint)}
.proj.on .i{color:var(--amber)}
.proj:hover{background:var(--raise)}
.proj.on{background:var(--raise);color:var(--amber)}
.proj small{
  display:block; font:400 10.5px/1.4 var(--mono); color:var(--faint);
  margin-top:3px;
}
.proj .ch{
  margin-left:auto; transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.pgroup.open .proj .ch{transform:rotate(90deg)}

/* the session list grows from nothing: 0fr to 1fr needs no known height */
.subs{
  display:grid; grid-template-rows:0fr; opacity:0;
  transition:grid-template-rows .28s cubic-bezier(.32,.72,0,1),
             opacity .2s ease;
}
.pgroup.open .subs{grid-template-rows:1fr; opacity:1}
.subs > div{overflow:hidden}
.sess{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:none; border-radius:var(--r-tool);
  padding:9px 12px 9px 30px; cursor:pointer; color:var(--dim);
  font:400 12.5px/1.3 var(--sans);
}
.sess:hover{background:var(--raise);color:var(--ink)}
.sess .i{width:15px;height:15px;color:var(--faint);flex:none}
.sess .txt{flex:1;min-width:0}
.sess small{display:block;font:400 10px/1.4 var(--mono);color:var(--faint);
  margin-top:2px}
.sess.new{color:var(--amber);font-weight:600}
.sess.new .i{color:var(--amber)}
.subs .none{padding:8px 12px 10px 30px;color:var(--faint);
  font:400 12px/1.4 var(--sans)}
/* al terminar de cargar, las sesiones entran con un fundido suave */
@keyframes subsIn{from{opacity:0}to{opacity:1}}

/* ---------- modal dialogs ---------- */
.modal{
  position:fixed; inset:0; z-index:30; display:flex; padding:20px;
  align-items:center; justify-content:center; background:var(--veil);
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  opacity:0; visibility:hidden;
  transition:opacity .2s ease, visibility 0s linear .2s;
}
.modal.open{
  opacity:1; visibility:visible;
  transition:opacity .2s ease, visibility 0s;
}
.mcard{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-card); box-shadow:var(--cast-card);
  width:100%; max-width:470px; max-height:82vh; padding:20px;
  display:flex; flex-direction:column;
  transform:scale(.94) translateY(14px); will-change:transform;
  transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.modal.open .mcard{transform:none}
.mcard h3{font:600 15px/1.3 var(--sans);margin:0 0 13px;color:var(--ink)}
.mbody{overflow-y:auto;font:400 13px/1.55 var(--sans);color:var(--dim)}
.mbody dt{font:600 12.5px/1.5 var(--mono);color:var(--amber);margin-top:11px}
.mbody dt:first-child{margin-top:0}
.mbody dd{margin:1px 0 0}
.mbody p{margin:0 0 9px}
.mbody b{color:var(--ink)}
.macts{display:flex; gap:8px; margin-top:16px; flex:none}
.ok{
  flex:1; background:var(--amber); color:var(--on-amber);
  border:1px solid transparent; border-radius:var(--r-tool);
  padding:12px; cursor:pointer; font:600 13px/1 var(--sans);
}
.ok:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ok.alt{background:var(--raise);color:var(--dim);border-color:var(--rule)}
.ok.alt:hover{color:var(--ink)}
/* what it does cannot be undone: outline, not a filled button */
.ok.danger{background:none;border-color:var(--coral);color:var(--coral)}
@keyframes rise-in{from{opacity:0;transform:translateY(7px)}
                   to{opacity:1;transform:none}}
/* what does not fit slides by, faded at both ends.
   the mask only exists while it runs, or a short label would
   sit there with its edges dissolved for no reason. */
.mq{display:block; overflow:hidden}   /* un span inline mide 0 de ancho */
.mq > span{display:block; white-space:nowrap}
.mq:not(.run) > span{overflow:hidden; text-overflow:ellipsis}
.mq.run{
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 12px,
                     #000 calc(100% - 12px), transparent 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 12px,
             #000 calc(100% - 12px), transparent 100%);
}
.mq.run > span{
  width:max-content; will-change:transform;
  animation:mq var(--mq-dur, 9s) linear infinite;
}
@keyframes mq{
  0%,14%    {transform:translateX(0)}
  46%,54%   {transform:translateX(var(--mq-shift))}
  86%,100%  {transform:translateX(0)}
}

/* la fila elegida de un dialogo de seleccion */
.mrow.on{border-color:var(--amber); color:var(--ink); font-weight:600}
.mrow.on .i{color:var(--amber)}

/* tamano del texto del chat, con las dos A a su tamano real */
.sizecard{
  background:var(--raise); border:1px solid var(--rule);
  border-radius:var(--r-tool); padding:12px 14px; margin-bottom:7px;
  box-shadow:var(--lift);
}
.sizecard .lbl{
  font:700 10px/1 var(--sans); letter-spacing:.11em; color:var(--faint);
  text-transform:uppercase; margin-bottom:12px;
}
.fsize{display:flex; align-items:center; gap:14px}
.fsize .a{flex:none; color:var(--ink); font-weight:600; line-height:1}
.fsize .a.sm{font-size:16px}
.fsize .a.lg{font-size:30px}
.track{position:relative; flex:1; min-width:0; height:24px}
.track .srail{
  position:absolute; left:0; right:0; top:5px; height:14px;
  border-radius:7px; background:var(--panel); border:1px solid var(--rule);
}
.track .dots{
  position:absolute; left:13px; right:13px; top:5px; height:14px;
  background-image:radial-gradient(circle at center,
                   var(--faint) 2.2px, transparent 2.3px);
  background-size:calc(100% / 7) 100%;
}
.track input{
  position:absolute; left:0; top:0; width:100%; height:24px; margin:0;
  background:none; -webkit-appearance:none; appearance:none; cursor:pointer;
}
.track input::-webkit-slider-thumb{
  -webkit-appearance:none; width:24px; height:24px; border-radius:50%;
  background:var(--panel); border:2.5px solid var(--ink);
}
.track input::-moz-range-thumb{
  width:24px; height:24px; border-radius:50%; box-sizing:border-box;
  border:2.5px solid var(--ink); background:var(--panel);
}
.track input:focus-visible::-webkit-slider-thumb{border-color:var(--amber)}
.shead{
  font:700 10px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); margin:15px 0 9px;
}
.shead:first-child{margin-top:0}
.shead[hidden]{display:none}
.fonts{display:flex; gap:8px; margin-top:10px}
.fontb{
  flex:1; min-width:0; background:var(--raise); color:var(--ink);
  border:1px solid var(--rule); border-radius:9px; padding:10px 6px;
  cursor:pointer; display:flex; flex-direction:column; align-items:center;
  gap:4px; transition:border-color .15s ease, background-color .15s ease;
}
.fontb b{font-size:19px; font-weight:500; line-height:1}
.fontb span{
  font:500 9.5px/1.25 var(--mono); color:var(--faint);
  text-align:center; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; max-width:100%;
}
.fontb.on{border-color:var(--amber); background:var(--surface)}
.fontb.on b{color:var(--amber)}

/* ---------- pantalla ancha ----------
   No se mira la orientacion: un movil girado tambien es apaisado, y ahi
   este reparto seria peor. Lo que decide es cuanto ancho hay. */
@media (min-width:1000px){
  body{
    display:grid; grid-template-columns:auto 1fr;
    height:100%; overflow:hidden;
  }
  .rail{
    position:static; transform:none; min-width:0;
    width:var(--rail-w,292px);
    grid-area:1/1; z-index:1; overflow-x:hidden;
    transition:width .3s cubic-bezier(.32,.72,0,1), opacity .18s ease;
  }
  body.folded .rail{
    width:0; opacity:0; pointer-events:none;
    padding-left:0; padding-right:0; border-right-width:0;
  }
  body.dragging .rail{transition:none}   /* el tirador manda al instante */
  .scrim{display:none!important}
  body:not(.folded) #railBtn{display:none}
  .foldb{display:flex}
  .stack{grid-area:1/2; height:100%}

  /* el tirador vive sobre la linea divisoria */
  .grip{
    display:block; position:fixed; top:0; bottom:0; z-index:30;
    left:calc(var(--rail-w,292px) - 3px); width:7px; cursor:col-resize;
  }
  .grip::after{
    content:""; position:absolute; inset:0 3px; background:transparent;
    transition:background-color .15s ease;
  }
  .grip:hover::after,.grip.drag::after{background:var(--amber)}
  body.folded .grip{display:none}
  body.dragging{user-select:none; cursor:col-resize; transition:none}

  /* el compositor se alinea con el texto, no con la columna entera */
  footer .entry,footer .cmeta,.readout,.palette{
    max-width:760px; margin-left:auto; margin-right:auto;
  }
  .palette{left:0; right:0; width:min(760px,100%)}

  /* los ajustes dejan de subir desde abajo: con raton eso no pega */
  .sheet{
    align-items:center;
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
  }
  .sheet .card{
    max-width:470px; border-radius:16px; max-height:76vh;
    padding:18px 20px 20px;
    box-shadow:0 24px 60px #0009;
    transform:translateY(12px) scale(.985);
    transition:transform .24s cubic-bezier(.32,.72,0,1), opacity .18s ease;
    opacity:0;
  }
  .sheet.open .card{transform:none; opacity:1}
  .grab{display:none}

  /* el fondo de la barra se disuelve por los lados en el color del chat,
     con un fundido largo; solo en ancho */
  footer::before{
    --edge:110px;
    -webkit-mask-image:linear-gradient(to right, transparent 0,
      #000 var(--edge), #000 calc(100% - var(--edge)), transparent 100%);
    mask-image:linear-gradient(to right, transparent 0,
      #000 var(--edge), #000 calc(100% - var(--edge)), transparent 100%);
  }

  /* con raton no hace falta tamano de dedo */
  .iconbtn{padding:6px 8px}
}

/* only the theme swap animates; everything else stays instrument-quick */
body,.plate,.readout,footer,.tool,.ask,.pick{
  transition:background-color .18s, border-color .18s, color .18s;
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto}
}
</style>

<script>
const TOKEN = (() => {

/* Lo que de verdad va a ejecutarse, sacado de los argumentos. */
function gist(args){
  if(!args) return "";
  for(const k of ["command", "code", "path", "filePath", "file_path",
                  "pattern", "url", "query"]){
    const v = args[k];
    if(typeof v === "string" && v.trim()) return v.trim();
  }
  return JSON.stringify(args);
}

const MARK = "\u0001";              // lo que va en mono al pintarlo
const unq = s => s.replace(/^(["'])([\s\S]*)\1$/, "$2");
const shortArg = a => a.length > 46 ? "\u2026" + a.slice(-45) : a;

/* corta por &&, ||, ; y | sin partir dentro de comillas */
function cmdPieces(s){
  const out = []; let cur = "", q = null;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(q){ cur += c; if(c === q) q = null; continue; }
    if(c === '"' || c === "'"){ q = c; cur += c; continue; }
    if(c === ";" || c === "\n"){ out.push(cur); cur = ""; continue; }
    if((c === "&" || c === "|") && s[i + 1] === c){
      out.push(cur); cur = ""; i++; continue;
    }
    if(c === "|"){ out.push(cur); cur = ""; continue; }
    cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(Boolean);
}

function readCmd(piece){
  let w = piece.match(/"[^"]*"|'[^']*'|\S+/g) || [];
  const keep = [], warn = [];
  let redir = "", root = false;
  for(let i = 0; i < w.length; i++){          // fuera las redirecciones
    const t = w[i];
    if(/^\d*(>>|>)$/.test(t)){ redir = unq(w[++i] || ""); continue; }
    if(/^\d*<$/.test(t)){ i++; continue; }
    const m = /^(>>|>)(\S+)$/.exec(t);
    if(m){ redir = unq(m[2]); continue; }
    if(/^\d*(>>|>|<|>&)/.test(t)) continue;
    keep.push(t);
  }
  w = keep;
  while(w.length){                            // fuera lo que solo es prefijo
    const h = unq(w[0]);
    if(/^[A-Za-z_]\w*=/.test(h)){ w.shift(); continue; }
    if(/^(sudo|doas|runas)$/.test(h)){ root = true; w.shift(); continue; }
    if(/^(time|nohup|env|exec|command)$/.test(h)){ w.shift(); continue; }
    break;
  }
  if(!w.length) return null;
  const name = unq(w[0]).replace(/\\/g, "/").split("/").pop()
    .toLowerCase().replace(/\.(exe|cmd|bat|ps1|com)$/, "");
  const flags = [];
  let args = [];
  for(const raw of w.slice(1)){
    const t = unq(raw);
    if(/^--[A-Za-z]/.test(t)) flags.push(t.slice(2).split("=")[0].toLowerCase());
    else if(/^-[A-Za-z]/.test(t)) for(const c of t.slice(1)) flags.push(c);
    else if(t !== "-" && t !== "--") args.push(t);
  }
  let key = CMD[name] || "", shown = name;
  // `git push -d rama` no sube nada: borra en el remoto
  const pushDel = name === "git" && (args[0] || "").toLowerCase() === "push"
    && flags.some(f => f === "d" || f === "delete");
  if(pushDel){ args.shift(); key = "gitPushDel"; }
  const tbl = pushDel ? null : (SUB[key] || SUB[name]);
  if(tbl){
    const s0 = (args[0] || "").toLowerCase();
    if(tbl[s0]){ key = tbl[s0]; args.shift(); }
    else { key = ""; if(s0) shown = name + " " + s0; }
  }
  if(key === "pkgAdd" && !args.length) key = "pkgAll";
  if(key === "gitClean" && flags.some(f => f === "x" || f === "X"))
    key = "gitCleanX";
  // en chmod y chown el primer argumento son los permisos, no el fichero:
  // hay que leerlo antes de tirarlo
  if(/^(chmod|chown|icacls|attrib)$/.test(name) && args.length > 1){
    const mode = args.shift();
    if(/^[0-7]?7{2,3}$/.test(mode) || /o\+w/.test(mode)) warn.push("world");
  }
  const rules = FL[key] || FL[name] || {};
  for(const f of flags)
    if(rules[f] && warn.indexOf(rules[f]) < 0) warn.push(rules[f]);
  const fixed = FIX[key] || FIX[name];
  if(fixed && warn.indexOf(fixed) < 0) warn.push(fixed);
  if(root) warn.push("admin");            // lo ultimo, que es un matiz
  if(redir && /^(echo|printf|cat|type)$/.test(name)){
    key = "writeFile"; args = [redir];
  }
  const a = args.length
    ? shortArg(args[0])
      + (args.length > 1 && MANY.indexOf(key) >= 0
         ? " (+" + (args.length - 1) + ")" : "")
    : "";
  let tpl = key ? X(key) : "";
  if(!tpl || (!a && tpl.indexOf("{a}") >= 0)) tpl = X("run");
  const t = tpl.replace("{a}", MARK + a + MARK)
               .replace("{n}", MARK + shown + MARK).trim();
  warn.sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  return {name: name, t: warn.reduce(
    (acc, k) => acc + (GLUE.indexOf(k) < 0 ? ", " : " ") + XT(k), t)};
}

/* [{t:"Elimina ./build y todo su contenido"}, ...] */
function explain(tool, detail){
  if(!detail) return [];
  const cat = toolIcon(tool);
  if(cat !== "terminal"){
    const k = {read:"xRead", edit:"xEdit", search:"xFind"}[cat];
    return k ? [{t: X(k).replace("{a}",
                 MARK + shortArg(detail) + MARK)}] : [];
  }
  const out = cmdPieces(detail).map(readCmd).filter(Boolean);
  for(let i = 0; i < out.length - 1; i++)     // curl ... | sh
    if(/^(curl|wget|iwr)$/.test(out[i].name)
       && /^(sh|bash|zsh|python|python3|node|pwsh|powershell)$/
          .test(out[i + 1].name))
      out[i + 1].t = X("webRun");
  return out;
}


/* ---------- tiny markdown ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const LIST = /^\s*([-*+]|\d+[.)])\s+/;
/* fila separadora de una tabla GFM: |---|:--:|--:| */
const TSEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function inline(t){
  return t
    .replace(/\*\*\*(.+?)\*\*\*/gs,"<strong><em>$1</em></strong>")
    .replace(/\*\*(.+?)\*\*/gs,"<strong>$1</strong>")
    .replace(/(?<![\w*])\*(?!\s)(.+?)(?<!\s)\*(?![\w*])/gs,"<em>$1</em>")
    .replace(/~~(.+?)~~/gs,"<s>$1</s>")
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function block(src){
  return src.split(/\n{2,}/).map(chunk=>{
    const lines = chunk.split("\n").filter(l => l.trim() !== "");
    let out = "", para = [], list = [], ol = false;
    const flushP = () => { if(para.length){ out += "<p>"+para.join("<br>")+"</p>"; para=[]; } };
    const flushL = () => { if(list.length){
      const tag = ol ? "ol" : "ul";
      out += `<${tag}>`+list.join("")+`</${tag}>`; list=[]; } };
    // parte una fila en celdas, respetando \| como barra literal
    const cells = l => l.trim().replace(/^\|/,"").replace(/\|$/,"")
      .split(/(?<!\\)\|/)              // | sin escapar separa
      .map(c => c.trim().replace(/\\\|/g,"|"));
    for(let i=0; i<lines.length; i++){
      const l = lines[i], nx = lines[i+1];
      const h = l.match(/^#{1,6}\s*(.+)$/);
      // tabla: cabecera con | seguida de la fila separadora
      if(l.includes("|") && nx && TSEP.test(nx)){
        flushP(); flushL();
        const head = cells(l);
        const al = cells(nx).map(c =>
          /^:-+:$/.test(c) ? ' style="text-align:center"'
          : /-+:$/.test(c) ? ' style="text-align:right"'
          : /^:-+/.test(c) ? ' style="text-align:left"' : "");
        const A = k => al[k] || "";
        let rows = "";
        for(i += 2; i < lines.length && lines[i].includes("|"); i++){
          const r = cells(lines[i]);
          rows += "<tr>" + head.map((_,k) =>
            `<td${A(k)}>${inline(r[k] || "")}</td>`).join("") + "</tr>";
        }
        i--;
        out += `<div class="twrap"><table><thead><tr>`
          + head.map((c,k) => `<th${A(k)}>${inline(c)}</th>`).join("")
          + `</tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      else if(h){ flushP(); flushL(); out += "<h4>"+inline(h[1])+"</h4>"; }
      else if(LIST.test(l)){
        const num = /^\s*\d/.test(l);
        if(list.length && num !== ol) flushL();
        ol = num; flushP();
        list.push("<li>"+inline(l.replace(LIST,""))+"</li>"); }
      else { flushL(); para.push(inline(l)); }
    }
    flushP(); flushL();
    return out;
  }).join("");
}
function md(src){
  const store = [];
  const held = String(src).replace(/```[\s\S]*?```|`[^`\n]+`/g, m => {
    store.push(m.startsWith("```")
      ? `<div class="cwrap"><pre><code>`
        + esc(m.replace(/^```[\w+-]*\n?|```$/g,"").replace(/\n$/,""))
        + `</code></pre><button class="copyb" type="button"`
        + ` aria-label="copy">${ico("copy")}</button></div>`
      : "<code>"+esc(m.slice(1,-1))+"</code>");
    return "\u0000"+(store.length-1)+"\u0000";
  });
  return block(esc(held))
    .replace(/\u0000(\d+)\u0000/g, (_,i) => store[i])
    .replace(/<p>(<div class="cwrap">[\s\S]*?<\/div>)<\/p>/g, "$1")
    .replace(/<br>(<div class="cwrap">)/g, "$1")
    .replace(/(<\/div>)<br>/g, "$1");
}

/* ---------- rendering ---------- */
function atBottom(){ return main.scrollHeight - main.scrollTop - main.clientHeight < 90; }
function goDown(){
  const show = feed.children.length && !atBottom()
            && !palette.classList.contains("open");
  $("#godown").classList.toggle("on", !!show);
}
addEventListener("load", ()=>{
  main.addEventListener("scroll", goDown, {passive:true});
  $("#godown").onclick = ()=>
    main.scrollTo({top:main.scrollHeight, behavior:"smooth"});
});
const jumpTo = y => main.scrollTo({top:y, behavior:"instant"});
function keepDown(was){
  if(was) jumpTo(main.scrollHeight);   // instant: el suave llega tarde
  requestAnimationFrame(goDown);
}

function render(item){
  const was = atBottom();
  let el = nodes.get(item.id);
  if(!el){
    // el thinking es transparente: no cierra el tramo de herramientas
    if(item.kind !== "tool" && item.kind !== "thinking") groupToolRun();
    el = document.createElement("div"); el.className="turn";
    nodes.set(item.id, el); feed.appendChild(el);
  }
  el.__item = item;
  el.innerHTML = html(item);
  if(item.kind === "ask") wireAsk(el, item);
  if(item.kind === "user") markFoldable(el);
  el.classList.toggle("think-turn", item.kind === "thinking");
  // la nota de "carpeta abierta" es un aviso pasajero: se va con fade
  if(item.kind === "note" && item.key === "project" && !el.dataset.seen){
    el.dataset.seen = "1";
    setTimeout(()=>{
      el.style.transition = "opacity .6s cubic-bezier(.4,0,.2,1)";
      // rAF para que el transition ya este aplicado antes de bajar la opacidad:
      // sin esto, a veces desaparecia de golpe en vez de fundirse
      requestAnimationFrame(()=>{ el.style.opacity = "0"; });
      setTimeout(()=>{ if(el.parentNode){ el.remove(); nodes.delete(item.id); } },
                 680);
    }, 3500);
  }
  keepDown(was);
  return el;
}

/* Un tramo de herramientas seguidas se pliega en un solo desplegable en
   cuanto el agente vuelve a escribir o el turno acaba. Mientras corren se
   ven sueltas; solo se agrupan al cerrarse el tramo. El razonamiento que el
   modelo intercala entre llamadas no rompe el tramo: se absorbe en el grupo
   (aunque este oculto). Solo cuentan las herramientas para el minimo y el
   rotulo, si no un thinking oculto dejaba cada tool suelta. */
function groupToolRun(){
  const run = [];
  let el = feed.lastElementChild;
  while(el && el.__item &&
        (el.__item.kind === "tool" || el.__item.kind === "thinking")){
    run.unshift(el); el = el.previousElementSibling;
  }
  const tools = run.filter(e => e.__item.kind === "tool");
  if(tools.length < 2) return;             // una sola no se agrupa
  const group = document.createElement("div");
  group.className = "turn toolgroup collapsed";
  group.innerHTML = `<button class="ghead">${ico("terminal")}`
    + `<span class="gn">${esc(runLabel(tools.length))}</span>`
    + `${ico("chevron")}</button><div class="gbody"></div>`;
  const body = group.querySelector(".gbody");
  feed.insertBefore(group, run[0]);
  run.forEach(t => body.appendChild(t));   // los nodos siguen en el mapa
}
const runLabel = n => T("ranN").replace("{n}", n);

/* Copiar y estadisticas van una sola vez, en la respuesta final del
   turno; nunca en los trozos de texto entre comandos, ni mientras genera. */
function placeActions(){
  const was = atBottom();          // seguias el final antes de colocar acciones
  feed.querySelectorAll(".msgacts").forEach(el => el.remove());
  feed.querySelectorAll(".suggests").forEach(el => el.remove());
  if(state.running) return;
  const said = [...feed.querySelectorAll(".turn")].filter(t =>
    t.__item && t.__item.kind === "assistant" && !t.__item.streaming);
  const last = said[said.length - 1];
  if(!last) return;
  const it = last.__item;
  const acts = document.createElement("div");
  acts.className = "msgacts";
  acts.innerHTML =
    `<button class="mact copy" aria-label="${esc(T("copy"))}">`
    + `${ico("copy")}</button>`
    + (it.stats ? `<button class="mact stats"`
        + ` aria-label="${esc(T("statsTitle"))}">${ico("stats")}</button>` : "");
  last.appendChild(acts);
  placeSuggests(last);
  // al terminar, las sugerencias crecen el feed: si seguias el final, baja
  // al fondo absoluto para no dejarlas fuera de vista
  if(was) requestAnimationFrame(() => jumpTo(main.scrollHeight));
}

/* Filas de sugerencia bajo la ultima respuesta: mismo aspecto en escritorio y
   movil. Clic en una envia ese mensaje directamente. Solo si el toggle esta
   activo y el modelo dejo marcadores <hint:>. */
function placeSuggests(last){
  if(!suggest) return;
  const hints = parseHints(last.__item.text, last.__item.streaming);
  if(!hints.length) return;
  const wrap = document.createElement("div");
  wrap.className = "suggests";
  wrap.innerHTML = hints.map(h =>
    `<button class="sug" type="button">`
    + `<span class="sarrow">${ico("subdir")}</span>`
    + `<span class="stext">${esc(h)}</span></button>`).join("");
  [...wrap.querySelectorAll(".sug")].forEach((b, i) => {
    b.onclick = () => { box.value = hints[i]; submit(); };
  });
  last.appendChild(wrap);
}

/* Un mensaje del usuario que ocupa mas de seis lineas se puede plegar.
   Se mide la altura, porque contar caracteres no sabe cuanto envuelve en
   el ancho real de la pantalla. */
function foldToggle(b){
  const t = b.querySelector(".utext");
  const wasFolded = b.classList.contains("folded");
  if(STILL.matches){ b.classList.toggle("folded"); return; }
  const cap = 4.4 * parseFloat(getComputedStyle(t).fontSize);
  const full = t.scrollHeight;
  const ease = "max-height .28s cubic-bezier(.32,.72,0,1)";
  if(wasFolded){
    // desplegar: de recortado a completo, y luego sin limite. Sin mover el chat.
    b.classList.remove("folded");
    t.style.maxHeight = cap + "px"; t.getBoundingClientRect();
    t.style.transition = ease; t.style.maxHeight = full + "px";
    setTimeout(() => { t.style.maxHeight = ""; t.style.transition = ""; }, 300);
  } else {
    // comprimir: de completo a recortado, y la vista al inicio del mensaje
    const turn = b.closest(".turn");
    const top = turn.getBoundingClientRect().top
              - main.getBoundingClientRect().top + main.scrollTop - 8;
    t.style.transition = "none"; t.style.maxHeight = full + "px";
    t.getBoundingClientRect();
    b.classList.add("folded");
    t.style.transition = ease; t.style.maxHeight = cap + "px";
    setTimeout(() => { t.style.maxHeight = ""; t.style.transition = ""; }, 300);
    main.scrollTo({top: Math.max(0, top), behavior: "smooth"});
  }
}

function markFoldable(el){
  const bubble = el.querySelector(".blk-you");
  const t = bubble && bubble.querySelector(".utext");
  if(!t || bubble.classList.contains("foldable")) return;
  const line = parseFloat(getComputedStyle(t).lineHeight) || 22;
  if(t.scrollHeight > line * 6 + 4){
    bubble.classList.add("foldable");           // por defecto, desplegado
    const b = document.createElement("button");
    b.className = "ufold";
    b.setAttribute("aria-label", T("fold"));
    b.innerHTML = ico("chevron");
    bubble.appendChild(b);
  }
}

const tail = () => "";   // sin cursor: la barra de lectura ya avisa

/* 'Penso durante 3 segundos', y salta a minutos si se pasa de 60 */
function thoughtLabel(secs){
  let n, u;
  if(secs < 60){ n = Math.max(1, secs);
                 u = n === 1 ? T("secOne") : T("secMany"); }
  else { n = Math.round(secs / 60);
         u = n === 1 ? T("minOne") : T("minMany"); }
  return T("thoughtFor").replace("{n}", n).replace("{u}", u);
}
function imgHtml(images){
  if(!images || !images.length) return "";
  return `<div class="uimgs">` + images.map(im =>
    /^image\/(png|jpe?g|webp|gif)$/.test(im.mimeType || "")
      ? `<img src="data:${im.mimeType};base64,${im.data}" alt="">` : "")
    .join("") + `</div>`;
}
function html(it){
  if(it.kind === "user")
    return `<div class="msg mine"><div class="blk blk-you">`
      + (it.steer ? `<span class="tag">steer</span>` : "")
      + imgHtml(it.images)
      + (it.text ? `<div class="utext">${esc(it.text)}</div>` : "")
      + `</div></div>`;
  if(it.kind === "thinking"){
    const lab = it.streaming ? T("thinking")
      : (it.secs != null ? thoughtLabel(it.secs) : T("reasoning"));
    return `<details class="think">`
      + `<summary>${ico(it.streaming ? "thinkO" : "think")}`
      + `<span class="tlabel${it.streaming ? " shine" : ""}">${esc(lab)}</span>`
      + `${ico("chevron", "tw")}</summary>`
      + `<div class="tbody"><div class="tinn" data-body>${md(it.text || "")}</div></div></details>`;
  }
  if(it.kind === "assistant")
    return `<div class="said${it.streaming ? " stream" : ""}" data-body>`
      + `${md(visibleText(it.text, it.streaming))}${tail(it)}</div>`;
  if(it.kind === "note")
    return `<div class="note ${it.level||""}${it.key==="compacting"?" busy":""}">`
         + ico(NOTE_ICON[it.level] || "info")
         + `<span>${esc(noteText(it))}</span></div>`;
  if(it.kind === "tool"){
    const done = it.status && it.status !== "running";
    // el comando completo va en el cuerpo (con ajuste de linea): el titulo
    // solo cabe una vista previa y casi nunca entra entero
    const full = it.lines ? "" : gist(it.args);
    const cmd = full
      ? `<div class="ccmd"><div class="ch">${ico("terminal")}`
        + `<span>${esc(T("command"))}</span></div><pre>${esc(full)}</pre></div>`
      : "";
    const out = it.lines ? diffHtml(it.lines)
      : done ? `<div class="cout"><div class="ch">${ico("terminal")}`
          + `<span>${esc(T("output"))}</span></div><pre>`
          + (it.output && it.output.trim() ? esc(it.output)
             : `<span class="cempty">${esc(T("noOutput"))}</span>`)
          + `</pre></div>`
      : "";
    const g = it.lines ? (it.args && (it.args.path || it.args.filePath))
                       : full;
    const arg = g ? " " + esc(g.length > 88 ? g.slice(0, 87) + "\u2026" : g)
                  : "";
    const tally = it.added != null
      ? `<span class="tally"><span class="plus">+${it.added}</span>`
        + `<span class="minus">-${it.removed}</span></span>` : "";
    // imagen que devuelve la herramienta (p.ej. read de un png): miniatura
    // bajo la salida; al pulsarla se abre en grande
    const timg = (it.images && it.images.length)
      ? `<div class="cout"><div class="ch">${ico("image")}`
        + `<span>${esc(T("image"))}</span></div><div class="toolimgs">`
        + it.images.map(im =>
            /^image\/(png|jpe?g|webp|gif)$/.test(im.mimeType || "")
              ? `<img class="tim" src="data:${im.mimeType};base64,${im.data}"`
                + ` alt="">` : "").join("")
        + `</div></div>`
      : "";
    const open = !done ? " open" : "";  // hechos y fallidos nacen plegados
    return `<details class="tool" data-s="${it.status||"running"}"${open}>
      <summary><span class="dot"></span>${ico(toolIcon(it.name))}`
    + `<span class="nm">${esc(it.name||T("tools"))}${arg}</span>${tally}`
    + `</summary><div class="tbody">${cmd}${out}${timg}</div></details>`;
  }
  if(it.kind === "ask"){
    const done = it.answered ? " done" : "";
    let opts = "";
    const cancel = `<button class="opt no" data-c="__cancel__">`
                 + `${esc(T("cancel"))}</button>`;
    if(it.method === "confirm")
      opts = `<button class="opt yes" data-c="__yes__">${esc(T("yes"))}</button>`
           + `<button class="opt no" data-c="__no__">${esc(T("no"))}</button>`;
    else if(it.method === "select")
      opts = (it.options||[]).map(o=>`<button class="opt" data-c="${esc(o)}">${esc(o)}</button>`).join("")
           + cancel;
    else
      opts = `<button class="opt" data-c="__text__">${esc(T("typeAnswer"))}`
           + `</button>` + cancel;
    const said = explain(it.tool, it.detail).slice(0, 4)
      .map(e => `<p>${esc(e.t)
        .replace(/\u0001(.*?)\u0001/g, "<code>$1</code>")}</p>`).join("");
    const what = it.detail
      ? `<div class="what"><div class="who">${ico(toolIcon(it.tool))}`
        + `${esc(it.tool || T("tools"))}</div>`
        + (said ? `<div class="says">${said}</div>` : "")
        + `<pre>${esc(it.detail)}</pre></div>`
      : "";
    return `<div class="ask${done}" data-rid="${esc(it.rid)}">
      <div class="cap">${esc(T("asking"))}</div>
      <h3>${esc(it.title)}</h3>
      ${it.body?`<div class="body">${esc(it.body)}</div>`:""}
      ${what}
      <div class="opts">${opts}</div>
      ${it.answered?`<div class="verdict">${ico("done")}`
        + `<span>${esc(T("answered"))}: ${esc(it.answered)}</span></div>`:""}
    </div>`;
  }
  return "";
}

/* delegado: los bloques se rehacen en cada token del streaming */
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  ta.remove();
  return ok;
}
/* los <details> nativos abren de golpe: se anima la altura a mano */
feed.addEventListener("click", e=>{
  const tim = e.target.closest(".tim");     // miniatura de tool -> a lo grande
  if(tim){ e.stopPropagation(); openLightbox(tim.src); return; }
  const uf = e.target.closest(".ufold");
  if(uf){ foldToggle(uf.closest(".blk-you")); return; }
  const gh = e.target.closest(".ghead");
  if(gh){
    const g = gh.parentNode, body = g.querySelector(".gbody");
    if(STILL.matches){ g.classList.toggle("collapsed"); return; }
    if(g.classList.contains("collapsed")){
      g.classList.remove("collapsed");
      const h = body.scrollHeight; body.style.height = "0px";
      requestAnimationFrame(()=>{ body.style.height = h + "px"; });
      setTimeout(()=>{ body.style.height = ""; }, 200);
    } else {
      body.style.height = body.scrollHeight + "px";
      requestAnimationFrame(()=>{ body.style.height = "0px"; });
      setTimeout(()=>{ g.classList.add("collapsed");
                       body.style.height = ""; }, 200);
    }
    return;
  }
  const sum = e.target.closest(".tool > summary, .think > summary");
  if(!sum) return;
  const det = sum.parentNode;
  const body = det.querySelector(":scope > .tbody, :scope > pre, :scope > .diff");
  if(!body || STILL.matches) return;          // sin cuerpo, comportamiento normal
  e.preventDefault();
  const done = () => {
    det.classList.remove("moving");
    body.style.height = "";
  };
  det.classList.add("moving");
  if(det.open){
    // doble rAF tambien al cerrar: con uno solo Chrome no dispara
    // la transicion y el cuerpo saltaba a cero al instante
    body.style.height = body.scrollHeight + "px";
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      body.style.height = "0px";
    });});
    setTimeout(()=>{ det.open = false; done(); }, 300);
  } else {
    // doble rAF: el contenido acaba de renderizarse al abrir el <details>
    // y Chrome no dispara la transicion si el cambio llega en la misma
    // oleada de frames (por eso el open se veia al instante en el movil)
    det.open = true;
    const h = body.scrollHeight;
    body.style.height = "0px";
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      body.style.height = h + "px";
    });});
    setTimeout(done, 320);
  }
});
